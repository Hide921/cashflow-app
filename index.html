const TX_PAGE=20;
function TxDetails({ txs, endD, startD, isPast, accounts, skippedKeys, skippedOccurrences, onSkip, onRestore, onEditTx, onUpdTx, onDeleteTx, embedded=false }){
  const [page,setPage]=useState(0);
  const [showSkipped,setShowSkipped]=useState(false);
  const [deleteTarget,setDeleteTarget]=useState(null);
  const [amountTarget,setAmountTarget]=useState(null);
  const [search,setSearch]=useState('');
  const [typeFilter,setTypeFilter]=useState('all');
  const accMap=useMemo(()=>Object.fromEntries(accounts.map(a=>[a.id,a])),[accounts]);
  const txMap=useMemo(()=>Object.fromEntries(txs.map(t=>[t.id,t])),[txs]);
  const list=useMemo(()=>{
    if(!txs.length||!accounts.length) return [];
    if(isPast) return buildPastTxList(txs,startD,skippedKeys);
    return buildTxList(txs,endD,skippedKeys);
  },[txs,endD,startD,isPast,accounts,skippedKeys]);

  const filteredList=useMemo(()=>{
    if(!search.trim()&&typeFilter==='all') return list;
    return list.filter(ev=>{
      if(typeFilter!=='all'&&ev.type!==typeFilter) return false;
      if(search.trim()&&!ev.label.toLowerCase().includes(search.trim().toLowerCase())) return false;
      return true;
    });
  },[list,search,typeFilter]);

  if(!accounts.length) return null;
  const shown=(page+1)*TX_PAGE;
  const skippedCount=(skippedOccurrences||[]).length;

  return h('div',{className:embedded?'':cardCls},
    amountTarget&&txMap[amountTarget.txId]&&h(ConfirmAmountDialog,{
      tx:txMap[amountTarget.txId],date:amountTarget.date,
      onSave:updated=>{onUpdTx(updated);setAmountTarget(null);},
      onClose:()=>setAmountTarget(null)
    }),

function AddTxModal({ date, accounts, dark, onSave, onClose, initAccountId, editTx, suggestions=[] }){
  const firstId=accounts[0]?.id||'';
  const secondId=accounts[1]?.id||firstId;
  const [form,setForm]=useState(()=>{
    const seed=editTx||{};
    return {
      label:seed.label||'',type:seed.type||'expense',amount:seed.amount?String(seed.amount):'',category:seed.category||'その他',
      accountId:seed.accountId||initAccountId||firstId,fromAccountId:seed.fromAccountId||initAccountId||firstId,toAccountId:seed.toAccountId||secondId,
      recurring:editTx?!!editTx.recurring:false,frequency:editTx?.frequency||'monthly',startDate:editTx?.startDate||date,endDate:editTx?.endDate||''
    };
  });
  const [err,setErr]=useState('');
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const isTransfer=form.type==='transfer';
  // 名前を入力すると、過去に入力した同じ名前の取引を候補に出す（新しい順・最大6件）。
  const [showSugs,setShowSugs]=useState(false);
  const sugs=useMemo(()=>{
    const text=form.label.trim().toLowerCase();
    if(!text||editTx)return [];
    const seen=new Set();
    return [...suggestions].sort((a,b)=>String(b.startDate||'').localeCompare(String(a.startDate||''))).filter(tx=>{
      if(!tx.label||!tx.label.toLowerCase().includes(text)||seen.has(tx.label))return false;
      seen.add(tx.label);return true;
    }).slice(0,6);
  },[form.label,suggestions,editTx]);
  function pickSuggestion(tx){
    setForm(f=>({...f,label:tx.label,type:tx.type,amount:String(tx.amount),category:tx.category||f.category,
      accountId:tx.accountId||f.accountId,fromAccountId:tx.fromAccountId||f.fromAccountId,toAccountId:tx.toAccountId||f.toAccountId}));
    setShowSugs(false);
  }
  useEffect(()=>{const onKey=e=>{if(e.key==='Escape')onClose();};document.addEventListener('keydown',onKey);return()=>document.removeEventListener('keydown',onKey);},[onClose]);
  function submit(e){
    e.preventDefault();
    if(!isTransfer&&!form.label.trim()){setErr('名前を入力してください');return;}
    const amt=parseJpAmt(form.amount);
    if(!amt||amt<=0){setErr('金額を入力してください');return;}
    if(!validTxDate(form.startDate)){setErr('有効な日付を入力してください');return;}
    if(form.recurring&&form.endDate&&(!validTxDate(form.endDate)||form.endDate<form.startDate)){setErr('終了日は開始日以降にしてください');return;}
    if(isTransfer){
      if(!form.fromAccountId||!form.toAccountId){setErr('振替元・振替先の口座を選択してください');return;}
      if(form.fromAccountId===form.toAccountId){setErr('振替元と振替先は別の口座を選択してください');return;}
      onSave({...(editTx||{}),id:editTx?.id||genId(),label:editTx?.type==='transfer'?editTx.label:'資金振替',type:'transfer',amount:amt,category:'',accountId:'',fromAccountId:form.fromAccountId,toAccountId:form.toAccountId,recurring:form.recurring,frequency:form.frequency,startDate:form.startDate||date,endDate:form.endDate||null,overrides:editTx?.overrides||{},adjustBizDay:editTx?.adjustBizDay||''});
    } else {
      if(!form.accountId){setErr('口座を選択してください');return;}
      onSave({...(editTx||{}),id:editTx?.id||genId(),label:form.label.trim(),type:form.type,amount:amt,category:form.category,accountId:form.accountId,fromAccountId:'',toAccountId:'',recurring:form.recurring,frequency:form.frequency,startDate:form.startDate||date,endDate:form.endDate||null,overrides:editTx?.overrides||{},adjustBizDay:editTx?.adjustBizDay||''});
    }
  }
  const inp=`w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 ${dark?'bg-gray-800 border-gray-600 text-gray-100':'bg-white border-gray-300 text-gray-900'}`;

  const parsedPreview=parseJpAmt(form.amount);
  return h('div',{className:'fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4',onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    h('div',{role:'dialog','aria-modal':'true','aria-labelledby':'quick-add-title',className:`rounded-2xl shadow-xl w-full max-w-md p-4 sm:p-5 overflow-y-auto ${dark?'bg-gray-900':'bg-white'}`,style:{maxHeight:'90vh'}},

        ),
        h('button',{onClick:onClose,'aria-label':'取引追加を閉じる',className:'text-gray-400 hover:text-gray-600 text-xl leading-none'},'✕')
      ),
      h('form',{onSubmit:submit,className:'space-y-4'},
        accounts.length===0&&h('p',{className:'rounded-lg bg-amber-50 dark:bg-amber-900/20 px-3 py-2 text-sm text-amber-800 dark:text-amber-200'},'取引を登録する前に、口座画面で口座を登録してください'),
        h('div',null,
          h('p',{className:lbl},'種別'),
          h('div',{className:'grid grid-cols-3 gap-1.5 rounded-xl bg-gray-100 dark:bg-gray-800 p-1'},

              },l)
            )
          )
        ),
        !isTransfer&&h('div',null,
          h('label',{htmlFor:'quick-label',className:lbl},'名前 *'),
          h('div',{className:'relative'},
            h('input',{id:'quick-label',autoFocus:true,autoComplete:'off',className:inp,placeholder:'例: 食費、給与、口座振替',value:form.label,onChange:e=>{const value=e.target.value;setForm(f=>({...f,label:value,category:editTx?f.category:autoCategoryFor(f,value)}));setShowSugs(true);},onBlur:()=>setTimeout(()=>setShowSugs(false),150)}),
            showSugs&&sugs.length>0&&h('div',{className:'absolute left-0 right-0 top-full z-20 mt-1 overflow-hidden rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-xl'},
              sugs.map(tx=>h('button',{key:tx.id,type:'button',onMouseDown:()=>pickSuggestion(tx),className:'flex w-full items-center gap-3 border-b last:border-0 border-gray-100 dark:border-gray-700/60 px-3 py-2.5 text-left hover:bg-indigo-50 dark:hover:bg-indigo-900/20'},
                h('span',{className:'flex-1 truncate text-sm font-medium text-gray-800 dark:text-gray-200'},tx.label),
                h('span',{className:'text-xs text-gray-400'},tx.category||''),
                h('span',{className:'text-xs tabular-nums text-gray-500 dark:text-gray-400'},`¥${Number(tx.amount).toLocaleString()}`))))
          )
        ),
        h('div',null,
          h('label',{htmlFor:'quick-amount',className:lbl},'金額 (円) *'),
          h('input',{id:'quick-amount',type:'text',inputMode:'decimal',className:inp,placeholder:'例: 50000 / 5万',value:form.amount,onChange:e=>sf('amount',e.target.value)}),
          parsedPreview!==null&&form.amount.trim()&&h('p',{className:'text-xs font-medium text-indigo-600 dark:text-indigo-300 mt-1'},`入力金額: ¥${parsedPreview.toLocaleString()}`)
        ),
        isTransfer
          ? h('div',{className:'space-y-2'},
              accounts.length<2&&h('p',{className:'text-xs text-amber-700 dark:text-amber-300'},'振替には異なる口座が2つ必要です'),
              h('div',null,
                h('label',{htmlFor:'quick-from-account',className:lbl},'振替元口座 *'),
                h('select',{id:'quick-from-account',className:inp,value:form.fromAccountId,onChange:e=>sf('fromAccountId',e.target.value)},
                  accounts.map(a=>h('option',{key:a.id,value:a.id},a.name)))
              ),
              h('div',null,
                h('label',{htmlFor:'quick-to-account',className:lbl},'振替先口座 *'),
                h('select',{id:'quick-to-account',className:inp,value:form.toAccountId,onChange:e=>sf('toAccountId',e.target.value)},
                  accounts.map(a=>h('option',{key:a.id,value:a.id},a.name)))
              )

          : h('div',{className:'grid grid-cols-2 gap-2'},

              ),
              h('div',null,
                h('label',{htmlFor:'quick-category',className:lbl},'カテゴリ'),
                h('select',{id:'quick-category',className:inp,value:form.category,onChange:e=>sf('category',e.target.value)},

          h('input',{id:'quick-start-date',type:'date',className:inp,value:form.startDate,onChange:e=>sf('startDate',e.target.value)})

function netCls(n){ return n>=0?'text-emerald-600 dark:text-emerald-400':'text-rose-500 dark:text-rose-400'; }
function fmtSigned(n){ return `${n>=0?'+':'−'}¥${Math.abs(n).toLocaleString()}`; }

// 全口座の残高を1画面で入力する。追証などで口座間のお金を動かしたあとに使う。
function BulkBalanceDialog({accounts,estimates,todayEvents,staleDays,onSave,onClose}){
  const [values,setValues]=useState({});
  const [included,setIncluded]=useState({});
  const inputs=useRef([]);
  useEffect(()=>{const onKey=e=>{if(e.key==='Escape')onClose();};document.addEventListener('keydown',onKey);return()=>document.removeEventListener('keydown',onKey);},[onClose]);
  const rows=accounts.map(account=>{
    const estimate=Math.round(estimates[account.id]??account.balance);
    const events=todayEvents(account);
    const todaySum=events.reduce((sum,ev)=>sum+ev.amt,0);
    const incl=included[account.id]!==false;
    // 今日の予定が銀行にまだ出ていなければ、予定前の残高を基準にする。
    const base=incl?estimate:estimate-todaySum;
    const text=values[account.id]||'';
    const parsed=text.trim()?parseBalanceInput(text,base):null;
    const after=parsed?parsed.value+(incl?0:todaySum):null;
    return {account,estimate,events,incl,text,parsed,after,invalid:!!text.trim()&&!parsed};
  });
  const changed=rows.filter(row=>row.parsed);
  const totalDiff=changed.reduce((sum,row)=>sum+row.after-row.estimate,0);
  const invalid=rows.some(row=>row.invalid);
  function save(){
    if(!changed.length||invalid)return;
    onSave(changed.map(row=>({...row.account,balance:row.parsed.value,balanceAsOf:todayStr(),balanceIncludesAsOfDay:row.events.length>0&&row.incl})));
  }
  const signed=value=>`${value>=0?'+':'−'}¥${Math.abs(Math.round(value)).toLocaleString()}`;
  return h('div',{className:'fixed inset-0 z-[310] bg-black/60 flex items-end sm:items-center justify-center sm:px-4',onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    h('div',{role:'dialog','aria-modal':'true','aria-labelledby':'bulk-balance-title',className:'flex max-h-[92vh] w-full max-w-lg flex-col rounded-t-2xl sm:rounded-2xl bg-white dark:bg-gray-900 shadow-2xl'},
      h('div',{className:'border-b border-gray-100 dark:border-gray-800 px-5 pt-5 pb-3'},
        h('h3',{id:'bulk-balance-title',className:'text-lg font-semibold text-gray-900 dark:text-white'},'残高をまとめて更新'),
        h('p',{className:'mt-1 text-xs text-gray-600 dark:text-gray-300'},'変わった口座だけ入力してください。銀行アプリの残高のほか、「-50000」「+3万」のように打つと今の残高から増減します。')
      ),
      h('div',{className:'flex-1 overflow-y-auto px-5 py-3 space-y-3'},
        rows.map((row,index)=>{
          const days=staleDays(row.account);
          return h('div',{key:row.account.id,className:'rounded-xl border border-gray-200 dark:border-gray-700 p-3'},
            h('div',{className:'flex items-center gap-2'},
              h('span',{className:'h-2.5 w-2.5 shrink-0 rounded-full',style:{backgroundColor:row.account.color}}),
              h('label',{htmlFor:`bulk-balance-${row.account.id}`,className:'min-w-0 flex-1 truncate text-sm font-semibold text-gray-800 dark:text-gray-100'},row.account.name),
              days!==null&&days>=STALE_BALANCE_DAYS&&h('span',{className:'rounded-full bg-amber-100 dark:bg-amber-900/40 px-1.5 py-0.5 text-[10px] font-semibold text-amber-700 dark:text-amber-300'},`${days}日前`),
              h('span',{className:'text-xs text-gray-500 dark:text-gray-400 tabular-nums'},`今 ¥${row.estimate.toLocaleString()}`)
            ),
            h('div',{className:'mt-2 flex items-center gap-2'},
              h('input',{id:`bulk-balance-${row.account.id}`,ref:el=>{inputs.current[index]=el;},type:'text',autoComplete:'off',enterKeyHint:index===rows.length-1?'done':'next',
                placeholder:`例: ${row.estimate.toLocaleString()} / -50000`,value:row.text,
                'aria-invalid':row.invalid?'true':undefined,
                onChange:e=>{const value=e.target.value;setValues(current=>({...current,[row.account.id]:value}));},
                onKeyDown:e=>{if(e.key!=='Enter'||e.isComposing)return;e.preventDefault();const next=inputs.current[index+1];if(next)next.focus();else save();},
                className:`min-w-0 flex-1 rounded-lg border px-3 py-2 text-sm font-semibold tabular-nums bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-400 ${row.invalid?'border-rose-400':'border-gray-300 dark:border-gray-600'}`}),
              h('button',{type:'button',onClick:()=>setValues(current=>({...current,[row.account.id]:String(row.incl?row.estimate:row.estimate-row.events.reduce((sum,ev)=>sum+ev.amt,0))})),className:'shrink-0 rounded-lg px-2 py-2 text-xs font-semibold text-indigo-600 dark:text-indigo-300 hover:bg-indigo-50 dark:hover:bg-indigo-900/30'},'変わらない')
            ),
            row.invalid&&h('p',{className:'mt-1 text-xs text-rose-600'},'金額を読み取れません（例: 120000、-5万、+30000）'),
            row.parsed&&h('p',{className:'mt-1 text-xs text-gray-600 dark:text-gray-300 tabular-nums'},`→ ¥${Math.round(row.after).toLocaleString()}（${signed(row.after-row.estimate)}）`),
            row.events.length>0&&h('label',{className:'mt-1.5 flex items-start gap-1.5 text-[11px] text-gray-600 dark:text-gray-300'},
              h('input',{type:'checkbox',className:'mt-0.5',checked:row.incl,onChange:e=>{const checked=e.target.checked;setIncluded(current=>({...current,[row.account.id]:checked}));}}),
              `今日の予定（${row.events.map(ev=>`${ev.tx.label} ${signed(ev.amt)}`).join('・')}）は銀行の残高にもう反映されている`)
          );
        })
      ),
      h('div',{className:'border-t border-gray-100 dark:border-gray-800 px-5 py-3'},
        changed.length>0&&h('p',{className:'mb-2 text-xs text-gray-600 dark:text-gray-300 tabular-nums'},`${changed.length}口座・合計の増減 ${signed(totalDiff)}`),
        h('div',{className:'flex justify-end gap-2'},
          h('button',{type:'button',onClick:onClose,className:'rounded-xl px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-300'},'キャンセル'),
          h('button',{type:'button',onClick:save,disabled:!changed.length||invalid,className:'rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white disabled:opacity-40 disabled:cursor-not-allowed'},changed.length?`${changed.length}口座を保存`:'保存')
        )
      )
    )
  );
}

function MonthBreakdownCard({ actual, forecast }){
  const [open,setOpen]=useState(false);
  const [view,setView]=useState('actual'); // 'actual' | 'forecast'
  const hasAny=actual.incomeItems.length||actual.expenseItems.length||forecast.incomeItems.length||forecast.expenseItems.length;
  if(!hasAny) return null;

  const aNet=actual.incTotal-actual.expTotal;
  const fNet=forecast.incTotal-forecast.expTotal;
  const data=view==='actual'?actual:forecast;
  const emptyInc=view==='actual'?'今月の収入はまだありません':'今月の収入予定はありません';
  const emptyExp=view==='actual'?'今月の支出はまだありません':'今月の支出予定はありません';

  const renderTable=(items, total, isIncome)=>{
    const colorCls=isIncome?'text-emerald-600 dark:text-emerald-400':'text-rose-500 dark:text-rose-400';
    const sign=isIncome?'+':'-';
    return h('div',null,
      h('h3',{className:`text-xs font-semibold ${colorCls} uppercase tracking-widest mb-3`},isIncome?'収入':'支出'),
      items.length===0
        ?h('p',{className:'text-xs text-gray-400 dark:text-gray-500 py-4'},isIncome?emptyInc:emptyExp)
        :h('table',{className:'w-full text-sm'},
          h('thead',{className:'text-gray-400 dark:text-gray-500 text-xs'},
            h('tr',{className:'border-b border-gray-100 dark:border-gray-700/60'},
              h('th',{className:'text-left py-2 font-medium'},'名前'),
              h('th',{className:'text-right py-2 font-medium'},'金額')
            )
          ),
          h('tbody',{className:'divide-y divide-gray-100 dark:divide-gray-700/60'},
            items.map((it,i)=>{
              return h('tr',{key:i,className:'hover:bg-gray-50 dark:hover:bg-gray-700/30'},
                h('td',{className:'py-2'},
                  h('div',{className:'font-medium text-gray-800 dark:text-gray-200'},it.label),
                  it.count>1&&h('div',{className:'text-xs text-gray-400 dark:text-gray-500'},`${it.count}回`)
                ),
                h('td',{className:`py-2 text-right font-semibold ${colorCls} whitespace-nowrap tabular-nums`},`${sign}¥${it.total.toLocaleString()}`)
              );
            }),
            h('tr',{className:'font-semibold'},
              h('td',{className:'pt-3 text-gray-700 dark:text-gray-300'},'合計'),
              h('td',{className:`pt-3 text-right ${colorCls} whitespace-nowrap tabular-nums`},`${sign}¥${total.toLocaleString()}`)
            )
          )
        )
    );
  };

  const figure=(label,labelCls,n)=>h('div',{className:'text-right leading-tight'},
    h('div',{className:`text-[10px] font-bold uppercase tracking-wider ${labelCls}`},label),
    h('div',{className:`text-sm font-bold tabular-nums ${netCls(n)}`},fmtSigned(n))
  );

  return h('div',{className:cardCls+' overflow-hidden'},
    h('button',{onClick:()=>setOpen(v=>!v),className:'w-full flex items-center justify-between px-5 py-4 text-left hover:bg-gray-50 dark:hover:bg-gray-700/40 transition-colors gap-3'},
      h('span',{className:'text-sm font-semibold text-gray-700 dark:text-gray-200 flex-shrink-0'},'今月の収支'),
      h('div',{className:'flex items-center gap-5 ml-auto'},
        figure('実績','text-gray-400 dark:text-gray-500',aNet),
        figure('予測','text-indigo-400 dark:text-indigo-300',fNet),
        h('span',{className:'text-gray-400 dark:text-gray-500 text-xs flex-shrink-0'},open?'▲':'▼')
      )
    ),
    open&&h('div',{className:'border-t border-gray-100 dark:border-gray-700/60'},
      h('div',{className:'flex items-center gap-2 px-5 pt-4 flex-wrap'},
        [['actual','実績',actual.periodLabel],['forecast','予測',forecast.periodLabel]].map(([v,label,range])=>
          h('button',{key:v,onClick:()=>setView(v),
            className:`px-3 py-1.5 rounded-full text-xs font-semibold transition-colors ${view===v?(v==='actual'?'bg-gray-900 dark:bg-white text-white dark:text-gray-900':'bg-indigo-600 text-white'):'text-gray-500 dark:text-gray-400 border border-gray-200 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700'}`},
            `${label} ${range}`))
      ),
      view==='forecast'&&h('p',{className:'px-5 pt-2 text-xs text-gray-400 dark:text-gray-500'},'登録済みの定期取引と予定（単発）から、今月末までの収支を予測した金額です。'),
      h('div',{className:'px-5 pb-5 pt-4 grid grid-cols-2 gap-4 sm:gap-6'},
        renderTable(data.incomeItems,data.incTotal,true),
        renderTable(data.expenseItems,data.expTotal,false)
      )
    )
  );
}

// ─── Dashboard ───────────────────────────────────────
function Dashboard({ accounts, txs, loans, dark, lowBalance=0, onLowBalanceChange, onAddTx, onBorrow, onUpdAcc, onUpdAccs, onUpdTx, onNavigate, skippedOccurrences, onSkip, onRestore, onDeleteTx, investmentData }){
  const [pIdx,setPIdx]=useState(3);
  const [addDate,setAddDate]=useState(null);
  const [addAccId,setAddAccId]=useState(null);
  const [editTxId,setEditTxId]=useState(null);
  const [editAccId,setEditAccId]=useState(null);
  const [editBal,setEditBal]=useState('');
  const [editIncl,setEditIncl]=useState(false);
  const [editStartBal,setEditStartBal]=useState('');
  const [bulkOpen,setBulkOpen]=useState(false);
  // 残高不足への対処の確認ダイアログ。
  const [remedy,setRemedy]=useState(null);
  const [lineDraft,setLineDraft]=useState(null);
  const loanLimits=(loans||[]).map(loanAvailable).filter(value=>value!==null);
  const totalAvailable=loanLimits.length?loanLimits.reduce((sum,value)=>sum+value,0):null;
  function applyRemedy(){
    const option=remedy?.options[remedy.choice];
    if(!option)return;
    const target=remedy.shortfall.account;
    if(option.type==='transfer')onAddTx({id:genId(),type:'transfer',category:'振替',label:`不足対策（${option.from.name}→${target.name}）`,amount:option.amount,fromAccountId:option.from.id,toAccountId:target.id,startDate:option.date,recurring:false});
    else onBorrow(option.loan.id,{amount:option.amount,date:option.date,accountId:target.id});
    setRemedy(null);
  }
  // 残高推移表から「この回だけ金額を変更」する定期取引の回。
  const [occurrenceTarget,setOccurrenceTarget]=useState(null);
  const [fabOpen,setFabOpen]=useState(false);
  const [hiddenAccIds,setHiddenAccIds]=useState(new Set());
  function toggleAccId(id){ setHiddenAccIds(prev=>{ const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; }); }
  // 今日のこの口座の予定（返済記録は残高に反映済みなので除く）。
  function todayEventsFor(account){
    return balanceEvents(txs,todayD(),todayD(),skippedKeys).filter(ev=>ev.aid===account.id&&!ev.tx.loanPayment);
  }
  // 入力した残高を保存したときの今日の見込み。今日の予定が未反映なら、その分を加える。
  function balancePreview(account,value,includesToday){
    return value+(includesToday?0:todayEventsFor(account).reduce((sum,ev)=>sum+ev.amt,0));
  }
  // 入力欄の値。「-50000」のような増減は、今日の予定を除いた/含めた今の残高から計算する。
  function parsedEditBalance(account){
    const todaySum=todayEventsFor(account).reduce((sum,ev)=>sum+ev.amt,0);
    const base=Math.round(todayBalance(account))-(todayEventsFor(account).length>0&&!editIncl?todaySum:0);
    return parseBalanceInput(editBal,base);
  }
  // 入力したら、前回の入力額と同じでも保存して基準日を今日にする（前回の入力日以降の予定が二重に効かないように）。
  // 表示中の見込みのまま何も変えずに保存したときは、表示が変わらないので更新しない。
  function saveAccountBalance(account){
    const parsed=parsedEditBalance(account);
    if(!parsed)return;
    if(editBal===editStartBal&&editIncl){setEditAccId(null);return;}
    onUpdAcc({...account,balance:parsed.value,balanceAsOf:todayStr(),balanceIncludesAsOfDay:todayEventsFor(account).length>0&&editIncl});
    setEditAccId(null);
  }
  function cancelBalanceEdit(){setEditAccId(null);}
  function saveBulkBalances(list){
    if(onUpdAccs)onUpdAccs(list);else list.forEach(account=>onUpdAcc(account));
    setBulkOpen(false);setEditAccId(null);
  }
  const isPast=PERIODS[pIdx].months<0;
  const skippedKeys=useMemo(()=>new Set(skippedOccurrences||[]),[skippedOccurrences]);
  const {startD,endD}=useMemo(()=>{
    const t=todayD();
    if(isPast) return {startD:addMonths(t,PERIODS[pIdx].months),endD:t};
    return {startD:t,endD:addMonths(t,PERIODS[pIdx].months)};
  },[pIdx,isPast]);
  const fullData=useMemo(()=>{
    if(!accounts.length) return [];
    if(isPast) return buildHistoricalForecast(accounts,txs,startD,skippedKeys);
    return buildForecast(accounts,txs,endD,skippedKeys);
  },[accounts,txs,startD,endD,isPast,skippedKeys]);
  const fData=useMemo(()=>{
    const absMons=Math.abs(PERIODS[pIdx].months);
    const step=absMons<=1?1:absMons<=3?3:7;
    return fullData.filter((_,i)=>i%step===0);
  },[fullData,pIdx]);
  const riskData=useMemo(()=>accounts.length?buildForecast(accounts,txs,addMonths(todayD(),12),skippedKeys):[],[accounts,txs,skippedKeys]);
  const lowLine=Number(lowBalance)||0;
  const shortfalls=useMemo(()=>findShortfalls(accounts,riskData,lowLine),[accounts,riskData,lowLine]);
  const spendable=useMemo(()=>accounts.length?spendableUntilPayday(accounts,txs,riskData,lowLine):null,[accounts,txs,riskData,lowLine]);
  const unconfirmedBills=useMemo(()=>unconfirmedVariableBills(txs),[txs]);
  const txEventMap=useMemo(()=>{
    if(isPast) return {};
    const map={};
    const today=todayD();
    const add=(ds,aid,label,amt,txId,recurring)=>{if(!map[ds])map[ds]={};if(!map[ds][aid])map[ds][aid]=[];map[ds][aid].push({label,amt,txId,recurring});};
    txs.forEach(tx=>{
      if(tx.recurring){
        if(tx.type==='transfer'){
          expandRec(tx,today,endD,skippedKeys).forEach(e=>{const ds=fmt(e.date);add(ds,tx.fromAccountId,tx.label,-e.amt,tx.id,true);add(ds,tx.toAccountId,tx.label,e.amt,tx.id,true);});
        } else {
          expandRec(tx,today,endD,skippedKeys).forEach(e=>add(fmt(e.date),tx.accountId,tx.label,e.amt,tx.id,true));
        }
      } else if(tx.startDate){
        const d=sod(parseISO(tx.startDate));
        const ds=fmt(d);
        if(!isBefore(d,today)&&!isAfter(d,endD)&&!skippedKeys.has(`${tx.id}_${ds}`)){
          if(tx.type==='transfer'){add(ds,tx.fromAccountId,tx.label,-tx.amount,tx.id,false);add(ds,tx.toAccountId,tx.label,tx.amount,tx.id,false);}
          else add(ds,tx.accountId,tx.label,tx.type==='income'?tx.amount:-tx.amount,tx.id,false);
        }
      }
    });
    return map;
  },[txs,endD,isPast,skippedKeys]);

  const totalBal=accounts.reduce((s,a)=>s+a.balance,0);
  const loggedInvestment=useMemo(()=>{
    const latest=[...(investmentData?.log||[])].filter(item=>Number.isFinite(Number(item.total??item.value))).sort((a,b)=>String(a.date).localeCompare(String(b.date))).at(-1);
    return latest?Number(latest.total??latest.value):null;
  },[investmentData]);
  // 投資資産は時価で評価する。価格が取れない間は前回の記録を使う。
  const [liveInvestment,setLiveInvestment]=useState(null);
  const investmentStocks=investmentData?.stocks||[];
  const investmentSignature=investmentStocks.map(stock=>`${stock.id}:${investmentTicker(stock)}:${stock.quantity}:${stock.avgPrice}`).join('|')+`#${JSON.stringify(investmentData?.collateral||[])}`;
  useEffect(()=>{
    if(!investmentStocks.length){setLiveInvestment(null);return;}
    let alive=true;
    fetchInvestmentQuotes([...investmentStocks.map(investmentTicker),'USDJPY=X']).then(quotes=>{
      if(!alive)return;
      const rate=Number(quotes['USDJPY=X']?.price)>0?Number(quotes['USDJPY=X'].price):Number(localGet('usdjpy_rate'))||null;
      const rows=investmentStocks.map(stock=>valueInvestmentStock(stock,quotes[investmentTicker(stock)],rate));
      const {total}=investmentTotals(rows,investmentData?.collateral||[],rate);
      if(total!==null)setLiveInvestment({total,at:new Date()});
    }).catch(()=>{});
    return()=>{alive=false;};
  },[investmentSignature]);
  const latestInvestment=liveInvestment?liveInvestment.total:loggedInvestment;
  const totalDebt=(loans||[]).reduce((sum,loan)=>sum+Number(loan.balance||0),0);
  // 「今の残高」は今日の見込み（入力した残高＋入力日以降の未反映の予定）にそろえる。
  const todayRow=riskData[0]||null;
  const todayTotal=todayRow?todayRow.total:totalBal;
  const todayBalance=account=>todayRow&&todayRow[account.id]!==undefined?todayRow[account.id]:account.balance;
  const staleDays=account=>account.balanceAsOf&&validTxDate(account.balanceAsOf)?Math.round((todayD()-parseISO(account.balanceAsOf))/86400000):null;
  const staleAccounts=accounts.filter(account=>{const days=staleDays(account);return days===null||days>=STALE_BALANCE_DAYS;});
  const lastBalanceUpdate=accounts.map(account=>account.balanceAsOf).filter(validTxDate).sort().at(-1);
  const upcomingWeek=useMemo(()=>buildTxList(txs,addDays(todayD(),7),skippedKeys).filter(event=>event.type==='expense'&&!String(event.txId).startsWith('loan-payment:')),[txs,skippedKeys]);
  const upcomingWeekTotal=upcomingWeek.reduce((sum,event)=>sum+Number(event.amount||0),0);
  const netWorth=todayTotal+(latestInvestment||0)-totalDebt;
  // 表示中の今日の見込みを初期値にする。そのまま保存しても表示は変わらない。
  function openBalanceEditor(account){
    const start=String(Math.round(todayBalance(account)));
    setEditAccId(account.id);setEditBal(start);setEditStartBal(start);setEditIncl(true);
  }
  const monthly=useMemo(()=>monthlyRunRate(txs,todayStr().slice(0,7)),[txs]);

  // 今月の実績（月初〜今日）
  const actualBreakdown=useMemo(()=>{
    const t=todayD();
    const monthStart=sod(new Date(t.getFullYear(),t.getMonth(),1));
    const periodLabel=`${t.getMonth()+1}/1〜${t.getMonth()+1}/${t.getDate()}`;
    return {periodLabel,...computeBreakdown(txs,monthStart,t,skippedKeys)};
  },[txs,skippedKeys]);

  // 今月の予測（月初〜月末）— 定期取引と予定（単発）から1ヶ月まるごとを見積もる
  const monthForecast=useMemo(()=>{
    const t=todayD();
    const monthStart=sod(new Date(t.getFullYear(),t.getMonth(),1));
    const monthEnd=sod(new Date(t.getFullYear(),t.getMonth()+1,0));
    const m=t.getMonth()+1;
    const periodLabel=`${m}/1〜${m}/${monthEnd.getDate()}`;
    return {periodLabel,...computeBreakdown(txs,monthStart,monthEnd,skippedKeys)};
  },[txs,skippedKeys]);

  const net=monthly.inc-monthly.exp;
  const editTx=editTxId?txs.find(t=>t.id===editTxId):null;
  const currentSalary=txs.filter(tx=>tx.salary?.month===todayStr().slice(0,7));
  const moveScheduledEvent=(txId,fromDate,toDate)=>{
    const result=moveScheduledTransaction(txs.find(tx=>tx.id===txId),fromDate,toDate,todayStr(),skippedKeys);
    if(result.transaction&&result.transaction!==txs.find(tx=>tx.id===txId))onUpdTx(result.transaction);
    return result;
  };
  const currentSalaryNet=currentSalary.reduce((sum,tx)=>sum+Number(tx.amount||0),0);
  const unconfiguredRepayments=(loans||[]).filter(loan=>!loanRepaymentStatus(loan,txs,accounts).ready);
  function openTxEditor(txId){
    const tx=txs.find(item=>item.id===txId);
    if(tx?.salary){onNavigate&&onNavigate('salary');return;}
    if(tx?.loanPlan||tx?.loanPayment){onNavigate&&onNavigate('loans');return;}
    setEditTxId(txId);
  }

  return h('div',{className:'space-y-5'},
    addDate&&onAddTx&&h(AddTxModal,{date:addDate,accounts,dark,initAccountId:addAccId,suggestions:txs.filter(tx=>!tx.loanPayment&&!tx.loanPlan&&!tx.salary),onClose:()=>{setAddDate(null);setAddAccId(null);},onSave:tx=>{onAddTx(tx);setAddDate(null);setAddAccId(null);}}),
    editTx&&onUpdTx&&h(AddTxModal,{date:editTx.startDate||todayStr(),accounts,dark,editTx,onClose:()=>setEditTxId(null),onSave:tx=>{onUpdTx(tx);setEditTxId(null);}}),
    remedy&&h('div',{className:'fixed inset-0 z-[310] bg-black/60 flex items-center justify-center px-4',onClick:e=>{if(e.target===e.currentTarget)setRemedy(null);}},

function SyncStatus({status,onRetry}){
  const state=status?.state||'synced';
  const meta={
    saving:{label:'保存中',cls:'text-indigo-600 dark:text-indigo-400',spin:true},
    synced:{label:'同期済',cls:'text-emerald-600 dark:text-emerald-400'},

const RECENT_REFLECTED_DAYS=14;
function UpcomingPayments({txs,accounts,skippedKeys,onSkip,onDeleteTx,onUpdTx}){
  const today=todayD();
  const end30=addDays(today,30);
  const [deleteTarget,setDeleteTarget]=useState(null);
  const [amountTarget,setAmountTarget]=useState(null);
  const [showAll,setShowAll]=useState(false);
  const [menuKey,setMenuKey]=useState(null);
  useEffect(()=>{
    if(!menuKey)return;
    const close=e=>{if(e.type==='keydown'?e.key==='Escape':!e.target.closest?.('[role="menu"],[aria-expanded]'))setMenuKey(null);};
    document.addEventListener('mousedown',close);document.addEventListener('keydown',close);
    return()=>{document.removeEventListener('mousedown',close);document.removeEventListener('keydown',close);};
  },[menuKey]);
  const accMap={};
  accounts.forEach(a=>{accMap[a.id]=a;});
  const events=[];
  txs.forEach(tx=>{
    if(tx.type==='transfer'||tx.loanPayment) return;
    if(tx.recurring){
      expandRec(tx,today,end30,skippedKeys).forEach(e=>{
        const date=fmt(e.date);
        events.push({date,label:tx.label,amount:Math.abs(e.amt),type:tx.type,daysLeft:Math.round((e.date-today)/86400000),txId:tx.id,recurring:true,confirmed:tx.overrides?.[date]!==undefined});
      });
    } else {
      const d=sod(parseISO(tx.startDate));
      if(!isBefore(d,today)&&!isAfter(d,end30)&&(!skippedKeys||!skippedKeys.has(`${tx.id}_${fmt(d)}`))){
        events.push({date:fmt(d),label:tx.label,amount:tx.amount,type:tx.type,daysLeft:Math.round((d-today)/86400000),txId:tx.id,recurring:false});
      }
    }
  });
  events.sort((a,b)=>a.date.localeCompare(b.date));
  // 残高の入力日以降に過ぎた定期の予定は、予定額のまま今日の残高見込みに反映済み。金額が違うときだけ直す。
  const recent=[];
  if(onUpdTx)txs.forEach(tx=>{
    if(!tx.recurring||tx.type==='transfer'||tx.loanPayment||tx.loanPlan||!accMap[tx.accountId])return;
    const anchor=balanceAnchor(accMap[tx.accountId]);
    expandRec(tx,addDays(today,-RECENT_REFLECTED_DAYS),addDays(today,-1),skippedKeys).forEach(e=>{
      if(eventIncludedInBalance({date:e.date,tx},anchor))return;
      const date=fmt(e.date);
      recent.push({date,label:tx.label,amount:Math.abs(e.amt),type:tx.type,daysAgo:Math.round((today-e.date)/86400000),txId:tx.id,confirmed:tx.overrides?.[date]!==undefined});
    });
  });
  recent.sort((a,b)=>b.date.localeCompare(a.date));
  if(!events.length&&!recent.length) return null;
  return h('div',{className:cardCls+' p-5'},
    amountTarget&&txs.find(tx=>tx.id===amountTarget.txId)&&h(ConfirmAmountDialog,{
      tx:txs.find(tx=>tx.id===amountTarget.txId),date:amountTarget.date,
      onSave:updated=>{onUpdTx(updated);setAmountTarget(null);},
      onClose:()=>setAmountTarget(null)
    }),
    deleteTarget&&h(ConfirmDialog,{
      title:'取引を削除',
      message:deleteTarget.recurring
        ?`定期取引「${deleteTarget.label}」を削除しますか？取引管理からも削除され、全ての予定が消えます。`
        :`「${deleteTarget.label}」を削除しますか？この操作は取り消せません。`,
      onConfirm:()=>{ onDeleteTx&&onDeleteTx(deleteTarget.txId); setDeleteTarget(null); },
      onCancel:()=>setDeleteTarget(null)
    }),
    h('div',{className:'flex items-center gap-2.5 mb-4'},
      h('div',{className:'w-8 h-8 rounded-lg bg-amber-100 dark:bg-amber-900/50 flex items-center justify-center'},
        h('svg',{className:'w-4 h-4 text-amber-600 dark:text-amber-400',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:'2'},
          h('rect',{x:'3',y:'4',width:'18',height:'18',rx:'2',ry:'2'}),
          h('line',{x1:'16',y1:'2',x2:'16',y2:'6'}),
          h('line',{x1:'8',y1:'2',x2:'8',y2:'6'}),
          h('line',{x1:'3',y1:'10',x2:'21',y2:'10'})
        )
      ),
      h('h2',{className:'text-base font-semibold text-gray-700 dark:text-gray-300'},'直近30日の予定'),
      h('span',{className:'ml-auto text-xs bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 rounded-full px-2 py-0.5 font-medium'},`${events.length}件`)
    ),
    recent.length>0&&h('div',{className:'mb-3 rounded-xl bg-gray-50 dark:bg-gray-900/40 px-3 py-2.5'},
      h('p',{className:'text-xs font-semibold text-gray-600 dark:text-gray-300'},'残高に自動反映した予定'),
      h('p',{className:'text-[11px] text-gray-500 dark:text-gray-400 mt-0.5'},'残高の入力後に過ぎた予定です。予定額のまま今日の見込みに入っています。金額が違ったときだけ直してください。'),
      h('ul',{className:'mt-1.5 divide-y divide-gray-200/70 dark:divide-gray-700'},recent.map(ev=>h('li',{key:`${ev.txId}_${ev.date}`,className:'flex items-center gap-2 py-1.5 text-sm'},
        h('span',{className:'w-12 shrink-0 text-xs text-gray-500 dark:text-gray-400 tabular-nums'},ev.date.slice(5).replace('-','/')),
        h('span',{className:'flex-1 min-w-0 truncate text-gray-700 dark:text-gray-200'},ev.label,ev.confirmed&&h('span',{className:'ml-1.5 text-xs text-amber-600 dark:text-amber-400'},'確定額')),
        h('span',{className:`tabular-nums font-semibold whitespace-nowrap ${ev.type==='income'?'text-emerald-600 dark:text-emerald-400':'text-rose-500 dark:text-rose-400'}`},`${ev.type==='income'?'+':'-'}¥${ev.amount.toLocaleString()}`),
        h('button',{type:'button',onClick:()=>setAmountTarget(ev),className:'shrink-0 text-xs font-medium text-amber-700 dark:text-amber-300 hover:bg-amber-50 dark:hover:bg-amber-900/20 px-1.5 py-0.5 rounded'},'金額を修正')
      )))
    ),
    h('div',{className:'divide-y divide-gray-100 dark:divide-gray-700'},
      events.slice(0,showAll?events.length:6).map((ev,i)=>
        h('div',{key:i,className:'flex flex-wrap items-center gap-x-3 gap-y-1.5 py-2.5'},
          h('div',{className:`w-11 text-center flex-shrink-0 rounded-lg py-1 ${ev.daysLeft===0?'bg-amber-100 dark:bg-amber-900/40':'bg-gray-50 dark:bg-gray-700/50'}`},
            h('div',{className:`text-base font-bold leading-none tabular-nums ${ev.daysLeft===0?'text-amber-600 dark:text-amber-400':'text-gray-600 dark:text-gray-300'}`},ev.daysLeft===0?'今日':ev.daysLeft),
            ev.daysLeft>0&&h('div',{className:'text-xs text-gray-400 dark:text-gray-500 mt-0.5'},'日後')
          ),
          h('div',{className:'flex-1 min-w-0'},
            h('p',{className:'text-sm font-medium text-gray-800 dark:text-gray-200 break-words'},ev.label),
            h('p',{className:'text-xs text-gray-400 dark:text-gray-500 mt-0.5'},ev.date.slice(5).replace('-','/'),ev.recurring&&h('span',{className:`ml-1.5 ${ev.confirmed?'text-amber-600 dark:text-amber-400':'text-gray-400'}`},ev.confirmed?'確定額':'概算'))
          ),
          h('div',{className:`text-sm font-bold tabular-nums whitespace-nowrap ${ev.type==='income'?'text-emerald-600 dark:text-emerald-400':'text-rose-500 dark:text-rose-400'}`},
            `${ev.type==='income'?'+':'-'}¥${ev.amount.toLocaleString()}`),
          (onSkip||onDeleteTx||onUpdTx)&&h('div',{className:'relative flex w-full justify-end gap-1'},
            onUpdTx&&ev.recurring&&h('button',{
              onClick:()=>setAmountTarget(ev),
              className:'text-xs font-medium text-amber-700 dark:text-amber-300 hover:bg-amber-50 dark:hover:bg-amber-900/20 px-1.5 py-0.5 rounded whitespace-nowrap',
              title:'今回だけ予定額を確定額に変更'
            },ev.confirmed?'修正':'金額確定'),
            // めったに使わない操作は「…」の中にまとめる。
            (onSkip||onDeleteTx)&&h('button',{
              type:'button',onClick:()=>setMenuKey(current=>current===`${ev.txId}_${ev.date}`?null:`${ev.txId}_${ev.date}`),
              'aria-label':`${ev.label}のその他の操作`,'aria-expanded':menuKey===`${ev.txId}_${ev.date}`,
              className:'text-sm leading-none text-gray-400 dark:text-gray-500 hover:text-gray-700 dark:hover:text-gray-200 px-2 py-0.5 rounded hover:bg-gray-100 dark:hover:bg-gray-700'
            },'…'),
            menuKey===`${ev.txId}_${ev.date}`&&h('div',{role:'menu',className:'absolute right-0 top-full z-20 mt-1 w-56 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 py-1 shadow-lg'},

              onDeleteTx&&h('button',{

const LOAN_COLORS=['#f97316','#8b5cf6','#0ea5e9','#10b981','#ef4444','#64748b'];

function loanYen(value){ return `¥${Number(value||0).toLocaleString()}`; }
function loanDueInfo(date){
  if(!date) return null;
  const days=Math.round((parseISO(date).getTime()-todayD().getTime())/86400000);
  if(days<0) return {label:`${Math.abs(days)}日超過`,className:'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30'};
  if(days===0) return {label:'今日',className:'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30'};
  if(days<=7) return {label:`あと${days}日`,className:'text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/30'};
  return {label:`あと${days}日`,className:'text-gray-500 dark:text-gray-400 bg-gray-50 dark:bg-gray-700/60'};
}

function LoanManager({loans,accounts=[],txs=[],onChange,onReflectPayment,onUndoPayment,onAddTx,addToast}){
  const blank={name:'',lender:'',loanType:'card',originalAmount:'',balance:'',interestRate:'',monthlyPayment:'',nextPaymentDate:'',repaymentAccountId:'',repaymentTransactionId:'',notes:'',color:LOAN_COLORS[0],deposit:true,depositAccountId:'',depositDate:todayStr(),creditLimit:'',repaymentMethod:'monthly',closingDay:'15',paymentDay:'10',paymentTable:'',adjustBizDay:''};

  const defaultPaymentAccount=lastRepaymentAccount||(accounts.length===1?accounts[0].id:'');
  const paymentAccountId=payment.accountId||loans.find(loan=>loan.id===payment.loanId)?.repaymentAccountId||defaultPaymentAccount;
  const reflectedPayment=id=>accounts.some(account=>(account.loanRepayments||[]).some(item=>item.id===id));
  const [showAddForm,setShowAddForm]=useState(false);
  // 既存の借入で、借りたお金を口座に入れるフォーム。
  const [depositForm,setDepositForm]=useState(null);
  useEffect(()=>{if(loans.length===0&&!editId)setShowAddForm(true);},[loans.length,editId]);
  const sf=(key,value)=>setForm(current=>({...current,[key]:value}));
  const editingLoan=editId?loans.find(loan=>loan.id===editId):null;
  const repaymentCandidates=txs.filter(tx=>tx.type==='expense'&&tx.recurring&&!tx.loanPlan);
  function cancelForm(){setEditId(null);setForm(blank);setErr('');setShowAddForm(false);}
  function openAddForm(){setEditId(null);setForm(blank);setErr('');setShowAddForm(true);}
  const totalBalance=loans.reduce((sum,loan)=>sum+Number(loan.balance||0),0);
  const availableList=loans.map(loanAvailable).filter(value=>value!==null);
  const totalAvailable=availableList.length?availableList.reduce((sum,value)=>sum+value,0):null;
  const totalMonthly=loans.reduce((sum,loan)=>sum+(Number(loan.balance)>0&&loan.repaymentMethod!=='lumpSum'?tieredPayment(loan,Number(loan.balance)):0),0);
  const totalPaid=loans.reduce((sum,loan)=>sum+(loan.payments||[]).reduce((s,item)=>s+Number(item.amount||0),0),0);
  const hasMonthlyPayment=loans.some(loan=>tieredPayment(loan,Number(loan.balance))>0);
  const paymentLoan=loans.find(loan=>loan.id===payment.loanId);
  const coverCandidate=paymentLoan?nextLoanOccurrence(paymentLoan,loans,txs,accounts,payment.paidAt):'';
  const paymentRows=loans.flatMap(loan=>(loan.payments||[]).map(item=>({...item,loanName:loan.name,loanId:loan.id}))).sort((a,b)=>String(b.paidAt).localeCompare(String(a.paidAt)));

  function preset(type){
    setEditId(null);setErr('');
    setShowAddForm(true);
    const presets={
      card:{name:'千葉銀行カードローン',lender:'千葉銀行',loanType:'card',repaymentMethod:'monthly',paymentTable:'chibabank',adjustBizDay:'next',color:LOAN_COLORS[0]},
      cashing:{name:'三井住友カード キャッシング',lender:'三井住友カード',loanType:'cashing',repaymentMethod:'lumpSum',interestRate:'18',closingDay:'15',paymentDay:'10',color:LOAN_COLORS[2]},
      personal:{name:'個人からの借入',lender:'',loanType:'personal',repaymentMethod:'monthly',color:LOAN_COLORS[1]}
    };
    setForm({...blank,...presets[type]});
  }
  function submit(e){
    e.preventDefault();
    const balance=form.balance===''?NaN:Number(form.balance);
    const original=form.originalAmount===''?(Number.isNaN(balance)?0:balance):Number(form.originalAmount);
    if(!form.name.trim()){setErr('借入名を入力してください');return;}
    if(!Number.isSafeInteger(balance)||balance<0){setErr('現在残高を0以上の整数の円で入力してください');return;}
    if(!Number.isSafeInteger(original)||original<0){setErr('借入総額を0以上の整数の円で入力してください');return;}
    if(original<balance){setErr('借入総額は現在残高以上で入力してください');return;}
    if(!Number.isFinite(Number(form.interestRate||0))||Number(form.interestRate||0)<0||Number(form.monthlyPayment||0)<0){setErr('金利・返済額は0以上で入力してください');return;}
    if(!Number.isSafeInteger(Number(form.monthlyPayment||0))){setErr('月間返済額は整数の円で入力してください');return;}
    const tableKey=formPaymentTable(form);
    const table=form.repaymentMethod!=='lumpSum'?LOAN_PAYMENT_TABLES[tableKey]:null;
    if(form.nextPaymentDate&&!validTxDate(form.nextPaymentDate)){setErr('有効な次回返済日を入力してください');return;}
    if(form.repaymentAccountId&&!accounts.some(account=>account.id===form.repaymentAccountId)){setErr('返済元口座を選び直してください');return;}
    if(form.repaymentTransactionId&&!repaymentCandidates.some(tx=>tx.id===form.repaymentTransactionId)){setErr('登録済みの返済取引を選び直してください');return;}
    const creditLimit=form.creditLimit===''||form.creditLimit===undefined?0:Number(form.creditLimit);
    if(!Number.isSafeInteger(creditLimit)||creditLimit<0){setErr('利用限度額は0以上の整数の円で入力してください');return;}
    if(creditLimit>0&&balance>creditLimit){setErr('現在残高が利用限度額を超えています');return;}
    const lumpSum=form.repaymentMethod==='lumpSum';
    const closingDay=Number(form.closingDay),paymentDay=Number(form.paymentDay);
    if(lumpSum&&(!Number.isInteger(closingDay)||closingDay<1||closingDay>31||!Number.isInteger(paymentDay)||paymentDay<1||paymentDay>31)){setErr('締め日・支払日は1〜31日で入力してください（月末は31）');return;}
    if(lumpSum&&!editId&&balance>0&&!validTxDate(form.nextPaymentDate)){setErr('今の残高を返す次回の支払日を入力してください');return;}
    const item={...form,name:form.name.trim(),lender:form.lender.trim(),originalAmount:original,balance,interestRate:Number(form.interestRate||0),monthlyPayment:lumpSum?0:table?tieredPayment({paymentTiers:table.tiers},balance):Number(form.monthlyPayment||0),
      paymentTable:form.repaymentMethod==='lumpSum'?'':table?tableKey:'fixed',paymentTiers:table?table.tiers:[],interestUnit:table?table.interestUnit:1,adjustBizDay:['next','prev'].includes(form.adjustBizDay)?form.adjustBizDay:'',nextPaymentDate:form.nextPaymentDate||'',notes:form.notes.trim(),
      creditLimit,repaymentMethod:lumpSum?'lumpSum':'monthly',...(lumpSum?{closingDay,paymentDay,repaymentTransactionId:''}:{})};
    if(editId){
      const {deposit,depositAccountId,depositDate,...fields}=item;
      const current=loans.find(loan=>loan.id===editId);
      const unsettled=(current?.borrowings||[]).filter(entry=>entry.due&&!entry.settled).reduce((sum,entry)=>sum+Number(entry.amount||0),0);
      const opening=fields.repaymentMethod==='lumpSum'&&balance>unsettled;
      if(opening&&!validTxDate(fields.nextPaymentDate)){setErr('今の残高を返す次回の支払日を入力してください');return;}
      onChange(list=>list.map(loan=>loan.id===editId?{...loan,...fields,id:editId,
        ...(opening?{borrowings:[...(loan.borrowings||[]),{id:`opening-${genId()}`,amount:balance-unsettled,date:todayStr(),due:fields.nextPaymentDate,additional:true,opening:true}]}:{})}:loan));
      addToast('借入を更新しました');
    }
    else{
      const {deposit,depositAccountId,depositDate,...fields}=item;
      // 翌月一括は、今の残高を「次回支払日に返す借入」として持つ。
      const created={...fields,id:genId(),payments:[],
        ...(fields.repaymentMethod==='lumpSum'&&balance>0?{borrowings:[{id:`opening-${genId()}`,amount:balance,date:todayStr(),due:fields.nextPaymentDate,additional:true,opening:true}]}:{})};
      if(deposit&&onAddTx&&balance>0){
        const result=loanDeposit(created,{amount:balance,date:depositDate,accountId:depositAccountId},accounts);
        if(result.error){setErr(result.error);return;}
        onChange(current=>[...current,result.loan]);onAddTx(result.transaction);
        addToast(`借入を追加し、${accounts.find(account=>account.id===depositAccountId)?.name}に${loanYen(balance)}を入金しました`);
      }else{onChange(current=>[...current,created]);addToast('借入を追加しました');}
    }
    setForm(blank);setEditId(null);setErr('');setShowAddForm(false);
  }
  function edit(loan){
    setShowAddForm(true);
    setEditId(loan.id);setErr('');setForm({name:loan.name||'',lender:loan.lender||'',loanType:loan.loanType||'other',originalAmount:String(loan.originalAmount||''),balance:String(loan.balance||0),interestRate:String(loan.interestRate||''),monthlyPayment:String(loan.monthlyPayment||''),nextPaymentDate:loan.nextPaymentDate||'',repaymentAccountId:loan.repaymentAccountId||'',repaymentTransactionId:loan.repaymentTransactionId||'',notes:loan.notes||'',color:loan.color||LOAN_COLORS[0],creditLimit:loan.creditLimit?String(loan.creditLimit):'',repaymentMethod:loan.repaymentMethod||'monthly',closingDay:String(loan.closingDay||15),paymentDay:String(loan.paymentDay||10),paymentTable:loanPaymentTable(loan)||'fixed',adjustBizDay:loan.adjustBizDay||(isChibabankCardLoan(loan)?'next':'')});
    requestAnimationFrame(()=>document.getElementById('loan-editor')?.scrollIntoView({behavior:'smooth',block:'start'}));
  }
  function addPayment(e){
    e.preventDefault();
    const loan=loans.find(item=>item.id===payment.loanId),amount=Number(payment.amount);
    if(!loan){setPaymentErr('借入を選択してください');return;}
    if(!Number.isSafeInteger(amount)||amount<=0){setPaymentErr('返済額を整数の円で入力してください');return;}
    if(!validTxDate(payment.paidAt)||payment.paidAt>todayStr()){setPaymentErr('今日までの有効な返済日を入力してください');return;}
    if(onReflectPayment&&!accounts.some(account=>account.id===paymentAccountId)){setPaymentErr('支払口座を選択してください');return;}
    // 金利があれば、日割り利息を先に払った残りで元金を減らす。
    const split=splitLoanPayment(loan,amount,payment.paidAt);
    if(amount>split.interest+Number(loan.balance||0)){setPaymentErr('返済額が残高と利息の合計を超えています');return;}
    const item={id:genId(),amount,principal:split.principal,interest:split.interest,paidAt:payment.paidAt,note:payment.note.trim(),coversDate:payment.coversSchedule&&coverCandidate?coverCandidate:''};

function investmentTicker(stock){
  if(stock.yahooTicker) return stock.yahooTicker;
  const ticker=String(stock.ticker||'').trim().toUpperCase();
  if(stock.market==='US') return ticker;
  if(stock.market==='CRYPTO') return ticker.replace(/-USD$/,'')+'-USD';
  if(/^\d{7}$/.test(ticker)) return '0'+ticker+'.T';
  return ticker+'.T';
}
function canonicalInvestmentStocks(items){
  return items.map(stock=>({...stock}));
}
// 価格APIは初回に pending を返すことがあるため、価格がそろうまで数回取り直す。
async function fetchInvestmentQuotes(tickers){
  await wakeInvestmentApi();
  const merged={};
  let pending=[...new Set(tickers.filter(Boolean))];
  for(let attempt=0;attempt<4&&pending.length;attempt++){
    if(attempt>0)await new Promise(resolve=>setTimeout(resolve,1600));
    for(let i=0;i<pending.length;i+=48){
      const batch=pending.slice(i,i+48);
      const res=await fetch(`${INVESTMENT_API}/api/prices?mode=cached&tickers=${encodeURIComponent(batch.join(','))}`,{cache:'no-store',signal:AbortSignal.timeout?AbortSignal.timeout(75000):undefined});
      if(!res.ok) throw new Error(`価格API HTTP ${res.status}`);
      Object.assign(merged,await res.json());
    }
    pending=pending.filter(ticker=>!(Number(merged[ticker]?.price)>0));
  }
  return merged;
}
// 予算（円またはドル）で買える米国株の株数（1株単位）。手数料・税は含めない。
// cost・rest・unitCost は予算と同じ通貨。円予算のときは為替レートが必要。
function buyableQuantity({price,fxRate,budget,currency='JPY'}){
  const rate=fxRate>0?fxRate:null;
  if(!(price>0)||(currency==='JPY'&&!rate))return null;
  const priceYen=rate?price*rate:null;
  const unitCost=currency==='USD'?price:priceYen;
  if(!(budget>0))return {currency,priceYen,unitCost,quantity:0,cost:0,rest:0};
  const quantity=Math.floor(budget/unitCost);
  const cost=quantity*unitCost;
  return {currency,priceYen,unitCost,quantity,cost,rest:budget-cost};
}

// 1銘柄の評価。quote が無ければ保存済みの価格を使う。為替が無いドル建ては評価額 null。
function valueInvestmentStock(stock,quote,fxRate){
  const key=investmentTicker(stock);
  const divisor=stock.market==='FUND'?10000:1;
  const live=Number(quote?.price)>0;
  const price=live?Number(quote.price)/divisor:Number(stock.currentPrice)||0;
  const prev=Number(quote?.prev_close)>0?Number(quote.prev_close)/divisor:Number(stock.prevClose)||0;
  const currency=quote?.currency||stock.currency||(stock.market==='US'||stock.market==='CRYPTO'?'USD':'JPY');
  const avgCurrency=stock.avgCurrency||currency;
  const fx=currency==='USD'?fxRate:1;
  const costFx=avgCurrency==='USD'?fxRate:1;
  const value=price>0&&fx!==null?price*Number(stock.quantity||0)*fx:null;
  const cost=costFx!==null?Number(stock.avgPrice||0)*Number(stock.quantity||0)*costFx:null;
  const pl=value!==null&&cost!==null?value-cost:null;
  const day=price>0&&prev>0&&fx!==null?(price-prev)*Number(stock.quantity||0)*fx:null;
  return {...stock,key,price,prev,currency,value,cost,pl,day,live:live&&!quote?.stale,priceSource:live?(quote?.stale?'APIキャッシュ':'API'):'保存値',plPct:cost&&pl!==null?pl/cost*100:0};
}
// 総資産 = 現物評価額 + 担保金 + 信用の含み損益（完全管理と同じ定義）。
function investmentTotals(rows,collateral,fxRate){
  const spotRows=rows.filter(row=>row.tradeType!=='margin'),marginRows=rows.filter(row=>row.tradeType==='margin');
  const spotValue=spotRows.reduce((sum,row)=>sum+(row.value||0),0);
  const spotCost=spotRows.reduce((sum,row)=>sum+(row.cost||0),0);
  const marginPL=marginRows.reduce((sum,row)=>sum+(row.pl||0),0);
  const collateralValue=(collateral||[]).reduce((sum,item)=>sum+(Number(item.amount)||0)*(item.currency==='USD'?(fxRate||0):1),0);
  const complete=!rows.some(row=>row.value===null||row.pl===null)&&!(collateral||[]).some(item=>item.currency==='USD'&&!fxRate);
  return {spotValue,spotCost,marginPL,collateralValue,total:complete?spotValue+collateralValue+marginPL:null};
}

function googleFinanceCsv(stocks,{includeMargin=false}={}){
  const header=['Symbol','Exchange','Name','Quantity','Average Cost','Currency','Asset Type','Account'];
  const rows=(stocks||[]).filter(stock=>Number(stock.quantity)>0&&(includeMargin||stock.tradeType!=='margin')).map(stock=>{
    const ticker=String(stock.ticker||'').trim().toUpperCase();
    const market=stock.market||'JP';
    const symbol=market==='CRYPTO'?ticker.replace(/-USD$/,''):ticker;
    const exchange=market==='JP'?'TYO':market==='CRYPTO'?'CRYPTO':'';
    const type={JP:'Stock (Japan)',US:'Stock (US)',FUND:'Mutual fund (Japan, price per unit)',CRYPTO:'Cryptocurrency'}[market]||market;
    const account=[stock.accountType==='nisa'?'NISA':'Taxable',stock.tradeType==='margin'?'Margin':''].filter(Boolean).join(' / ');
    const currency=stock.avgCurrency||stock.currency||(market==='US'||market==='CRYPTO'?'USD':'JPY');
    const cost=Number(stock.avgPrice)||0;
    return [symbol,exchange,stock.name||'',Number(stock.quantity),Math.round(cost*1e6)/1e6,currency,type,account];
  });
  return [header,...rows].map(row=>row.map(csvCell).join(',')).join('\n');

function AuthScreen({mode,onDone}){
  const [email,setEmail]=useState('');

  const [error,setError]=useState('');
  const [info,setInfo]=useState('');
  const recovery=mode==='recovery';
  async function submit(e){
    e.preventDefault();if(busy)return;setError('');setInfo('');
    try{
    if(recovery){
      if(password.length<8){setError('パスワードは8文字以上にしてください');return;}
      setBusy(true);
      const {error:err}=await _sb.auth.updateUser({password});
      setBusy(false);
      if(err){setError('パスワードを変更できませんでした: '+err.message);return;}
      onDone&&onDone();return;
    }
    if(!email.trim()||!password){setError('メールアドレスとパスワードを入力してください');return;}
    setBusy(true);
    const {error:err}=await _sb.auth.signInWithPassword({email:email.trim(),password});
    setBusy(false);
    if(err)setError(/invalid/i.test(err.message)?'メールアドレスまたはパスワードが違います':'ログインできませんでした: '+err.message);
    }catch{setError('通信できませんでした。接続を確認して再試行してください。');}
    finally{setBusy(false);}
  }
  async function forgot(){
    if(busy)return;
    setError('');setInfo('');
    if(!email.trim()){setError('先にメールアドレスを入力してください');return;}
    setBusy(true);
    try{
    const {error:err}=await _sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:window.location.origin+window.location.pathname});
    if(err)setError('送信できませんでした: '+err.message);
    else setInfo('パスワード再設定のメールを送りました。メール内のリンクから開いてください。');
    }catch{setError('通信できませんでした。接続を確認して再試行してください。');}
    finally{setBusy(false);}

      h('div',null,h('label',{htmlFor:'login-password',className:labelCls},recovery?'新しいパスワード（8文字以上）':'パスワード'),h('input',{id:'login-password',type:'password',autoComplete:recovery?'new-password':'current-password',className:inputCls,value:password,onChange:e=>setPassword(e.target.value)})),
      error&&h('p',{role:'alert',className:'text-sm text-rose-600 dark:text-rose-400'},error),

      h('button',{type:'submit',disabled:busy,className:'w-full rounded-xl bg-slate-900 dark:bg-white py-2.5 text-sm font-semibold text-white dark:text-slate-900 disabled:opacity-50'},busy?'処理中…':recovery?'パスワードを変更':'ログイン'),
      !recovery&&h('button',{type:'button',disabled:busy,onClick:forgot,className:'w-full text-xs text-gray-500 dark:text-gray-400 hover:underline disabled:opacity-50'},'パスワードを忘れた場合')

function AuthGate(){
  const [state,setState]=useState({checking:true,session:null,recovery:false,error:''});
  const [revision,setRevision]=useState(0);
  useEffect(()=>{
    let alive=true,receivedEvent=false;
    const apply=(session,event)=>{
      if(!alive)return;
      const id=session?.user?.id;
      if(accountStorage&&accountStorage.userId!==id){setState({checking:true,session:null,recovery:false,error:''});window.location.reload();return;}
      try{
        if(id){
          if(!window.CashflowStorage)throw new Error('保存機能を読み込めませんでした。ページを再読み込みしてください。');
          accountStorage=window.CashflowStorage.activate(id);
        }
        setState(current=>({...current,checking:false,error:'',session:session||null,recovery:event==='PASSWORD_RECOVERY'?true:current.recovery&&event!=='SIGNED_OUT'}));
      }catch(error){setState(current=>({...current,checking:false,error:error.message}));}
    };
    _sb.auth.getSession().then(({data,error})=>{if(error)throw error;if(!receivedEvent)apply(data?.session);}).catch(()=>{if(alive&&!receivedEvent)setState(current=>({...current,checking:false,error:'ログイン状態を確認できませんでした。通信状況を確認して再試行してください。'}));});
    const {data:listener}=_sb.auth.onAuthStateChange((event,session)=>{
      if(!alive)return;
      receivedEvent=true;apply(session,event);
    });
    return()=>{alive=false;listener?.subscription?.unsubscribe();};
  },[revision]);
  if(state.checking)return h('div',{role:'status',className:'min-h-screen bg-[#f7f7f5] dark:bg-gray-950 flex items-center justify-center text-gray-600 dark:text-gray-300'},'ログインを確認しています…');
  if(state.error)return h('div',{className:'min-h-screen bg-[#f7f7f5] dark:bg-gray-950 flex flex-col items-center justify-center gap-4 p-6'},h('p',{role:'alert',className:'text-gray-800 dark:text-gray-200'},state.error),h('button',{onClick:()=>{setState(current=>({...current,checking:true,error:''}));setRevision(n=>n+1);},className:'rounded-xl bg-indigo-600 px-5 py-3 text-white'},'再試行'));
  if(state.recovery)return h(AuthScreen,{mode:'recovery',onDone:()=>setState(current=>({...current,recovery:false}))});
  if(!state.session)return h(AuthScreen,{mode:'login'});
  const userId=state.session.user.id;
  if(window.CashflowStorage.needsLegacyChoice(userId))return h('main',{className:'min-h-screen bg-[#f7f7f5] dark:bg-gray-950 flex items-center justify-center p-4'},
    h('section',{className:cardCls+' max-w-lg p-6 space-y-4 text-gray-800 dark:text-gray-100'},
      h('h1',{className:'text-lg font-bold'},'端末データを引き継ぐ'),
      h('p',{className:'text-sm break-all'},`ログイン中: ${state.session.user.email||userId}`),
      h('p',{className:'text-sm'},'このブラウザに以前のデータがあります。このアカウントのデータであることを確認して引き継いでください。未同期の変更も含まれます。'),
      h('button',{className:'w-full rounded-xl bg-indigo-600 px-4 py-3 font-semibold text-white',onClick:()=>{try{window.CashflowStorage.resolveLegacy(userId,true);setRevision(n=>n+1);}catch{setState(current=>({...current,error:'端末データを保存できません。空き容量を確認してください。'}));}}},'このアカウントのデータとして引き継ぐ'),
      h('button',{className:'w-full rounded-xl border border-gray-300 dark:border-gray-600 px-4 py-3 text-sm',onClick:()=>{try{window.CashflowStorage.resolveLegacy(userId,false);setRevision(n=>n+1);}catch{setState(current=>({...current,error:'端末に設定を保存できませんでした。'}));}}},'クラウドのデータで始める'),
      h('p',{className:'text-xs text-gray-500 dark:text-gray-400'},'以前のデータは端末に残ります。必要なら先に控えを保存できます。'),
      h('button',{className:'text-sm underline text-indigo-700 dark:text-indigo-300',onClick:()=>downloadBlob(`cashflow_legacy_${todayStr()}.json`,JSON.stringify({version:1,format:'cashflow-legacy-storage',storage:window.CashflowStorage.legacySnapshot()},null,2),'application/json')},'以前の端末データの控えを保存')));
  return h(App,{key:userId,userEmail:state.session.user?.email||''});
}
async function signOut(){
  const pending=Object.keys(readPending()).length;
  if(pending&&!window.confirm('クラウドに未同期の変更があります。ログアウトすると、次にログインするまで同期されません。ログアウトしますか？'))return;
  const {error}=await _sb.auth.signOut();
  if(error)throw error;
  window.location.reload();
}

  function savePendingKey(key,value){

    },()=>{});
    saveQueues.current[key]=task.catch(()=>{});

      const retry=cacheRetry.current[key];
      if(retry&&JSON.stringify(retry.pendingValue)===JSON.stringify(value)){
        if(writeLocalCache(retry.cacheKey,retry.data))delete cacheRetry.current[key];
        else{setLocalSaveFailed(true);return;}
      }
      if(JSON.stringify(volatilePending.current[key])===JSON.stringify(value)){
        delete volatilePending.current[key];
        const pending=readPending();
        if(Object.prototype.hasOwnProperty.call(pending,key)){
          delete pending[key];
          if(!localSet(LS_PENDING,JSON.stringify(pending))){volatilePending.current[key]=value;setLocalSaveFailed(true);}
        }
      }else if(!clearPendingIfCurrent(key,value)){
        setLocalSaveFailed(true);
        setSyncStatus({state:'error',message:'端末の未同期記録を更新できません。再試行してください'});

  async function syncAll(){

      });
      const tasks=Object.entries({...readPending(),...volatilePending.current}).map(([key,value])=>savePendingKey(key,value));
      await Promise.all(tasks);
      if(Object.keys(readPending()).length||Object.keys(volatilePending.current).length||Object.keys(cacheRetry.current).length)throw new Error('端末保存または同期が完了していません');

    try{parsed=transactionsFromCsv(text,accounts);}catch(error){addToast(error.message,'error');return;}

    if(!items.length){addToast('追加できる取引がありませんでした','error');return;}
    if(!window.confirm(`${items.length}件の取引を追加します${skipped?`（形式や口座を確認できない${skipped}件は追加しません）`:''}。同じファイルの再取り込みは重複登録になります。追加しますか？`))return;
    updTxs(current=>[...current,...items]);addToast(`${items.length}件を追加しました${skipped?`（${skipped}件スキップ）`:''}`);setShowSettings(false);setActiveView('transactions');
  }

  if(loading) return h('div',{className:'min-h-screen bg-[#f7f7f5] dark:bg-gray-950 flex items-center justify-center'},
    h('div',{className:'text-center'},h('div',{className:'w-8 h-8 rounded-full border-2 border-slate-200 border-t-slate-800 animate-spin mx-auto mb-3'}),h('p',{className:'text-gray-400 dark:text-gray-500 text-sm'},'読み込み中…'))
  );

  return h('div',{className:'min-h-screen bg-[#f7f7f5] dark:bg-gray-950'},
    h('header',{className:'bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50'},
      h('div',{className:'max-w-[1600px] mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-3'},
        h('button',{onClick:()=>setActiveView('home'),className:'flex items-center gap-2.5 flex-shrink-0','aria-label':'ホームへ'},
          h('div',{className:'w-9 h-9 bg-slate-900 dark:bg-slate-100 rounded-xl flex items-center justify-center'},
            h('span',{className:'text-base leading-none font-bold text-white dark:text-slate-950'},'¥')
          ),
          h('h1',{className:'hidden sm:block text-base font-bold text-gray-900 dark:text-gray-100 tracking-tight'},'Cashflow')
        ),
        h(AppNavigation,{active:activeView,onChange:setActiveView}),
        h('div',{className:'flex items-center gap-1.5'},
          h(SyncStatus,{status:syncStatus,onRetry:()=>retryRef.current?retryRef.current():syncAll()}),
          h('button',{
            onClick:()=>setDark(v=>!v),
            className:'w-8 h-8 flex items-center justify-center rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors',
            title:dark?'ライトモードに切替':'ダークモードに切替','aria-label':dark?'ライトモードに切替':'ダークモードに切替'
          },
            dark
              ? h('svg',{className:'w-4 h-4',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:'2'},
                  h('circle',{cx:'12',cy:'12',r:'5'}),
                  h('path',{d:'M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42'})
                )
              : h('svg',{className:'w-4 h-4',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:'2'},
                  h('path',{d:'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'})
                )
          ),
          h('div',{className:'w-px h-5 bg-gray-200 dark:bg-gray-700 mx-1'}),
          h('button',{
            onClick:()=>setShowSettings(true),
            className:'flex items-center gap-1.5 px-2 sm:px-3 py-1.5 rounded-full text-sm font-medium text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors','aria-label':'設定を開く'
          },
            h('svg',{className:'w-4 h-4',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:'2'},
              h('circle',{cx:'12',cy:'12',r:'3'}),
              h('path',{d:'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'})
            ),
            h('span',{className:'hidden sm:inline'},'設定')
          )
        )
      )
    ),
    h('main',{className:activeView==='investments'?'w-full px-2 sm:px-3 py-3 sm:py-4 pb-24':'max-w-[1600px] mx-auto px-3 sm:px-6 py-4 sm:py-6 pb-28'},
      syncStatus.state==='conflict'&&h('div',{role:'alert',className:'mb-4 rounded-xl border border-amber-300 bg-amber-50 dark:border-amber-800 dark:bg-amber-950/40 px-4 py-3 text-sm text-amber-900 dark:text-amber-200'},
        h('p',null,'他の端末（または別のタブ）でデータが更新されています。どちらの内容を残すか選んでください。'),
        h('div',{className:'mt-2 flex flex-wrap gap-3'},
          h('button',{type:'button',onClick:resolveConflictWithCloud,className:'font-semibold underline'},'クラウドの最新を読み込む（この端末の変更を破棄）'),
          h('button',{type:'button',onClick:resolveConflictWithLocal,className:'font-semibold underline'},'この端末の内容で上書き')
        )
      ),
      syncStatus.state==='stale'&&h('div',{role:'status',className:'mb-4 rounded-xl border border-indigo-200 bg-indigo-50 dark:border-indigo-800 dark:bg-indigo-950/40 px-4 py-3 text-sm text-indigo-900 dark:text-indigo-200'},
        '他の端末でデータが更新されました。',
        h('button',{type:'button',onClick:()=>window.location.reload(),className:'ml-3 font-semibold underline'},'最新を読み込む')
      ),
      localSaveFailed&&h('div',{role:'alert',className:'mb-4 rounded-xl border border-rose-300 bg-rose-50 dark:border-rose-800 dark:bg-rose-950/40 px-4 py-3 text-sm text-rose-800 dark:text-rose-200'},
        '端末の保存領域に問題があります。同期が完了するまでページを閉じず、オンラインで再試行してください。',
        h('button',{type:'button',onClick:syncAll,className:'ml-3 font-semibold underline'},'再試行')
      ),
      activeView==='home'&&h(Dashboard,{accounts,txs:cashflowTxs,loans,dark,lowBalance:preferences.lowBalance,
        onLowBalanceChange:value=>{updPreferences({...preferences,lowBalance:value});addToast(`注意ラインを¥${value.toLocaleString()}にしました`);},
        onBorrow:(loanId,deposit)=>{
          const loan=loansRef.current.find(item=>item.id===loanId);
          const result=loan?loanDeposit(loan,{...deposit,additional:true},accountsRef.current):{error:'借入が見つかりません'};
          if(result.error){addToast(result.error,'error');return;}
          updLoans(current=>current.map(item=>item.id===loanId?result.loan:item));
          updTxs(current=>[...current,result.transaction]);
          addToast(`${loan.name}から¥${result.transaction.amount.toLocaleString()}を借りる予定を追加しました`);
        },
        onAddTx:tx=>updTxs(current=>[...current,tx]),
        onUpdTx:updCashflowTx,
        onUpdAcc:updated=>updAcc(current=>current.map(a=>a.id===updated.id?{...a,balance:updated.balance,balanceAsOf:updated.balanceAsOf,balanceIncludesAsOfDay:!!updated.balanceIncludesAsOfDay}:a)),
        onUpdAccs:list=>{
          updAcc(current=>current.map(a=>{const updated=list.find(item=>item.id===a.id);return updated?{...a,balance:updated.balance,balanceAsOf:updated.balanceAsOf,balanceIncludesAsOfDay:!!updated.balanceIncludesAsOfDay}:a;}));
          addToast(`${list.length}口座の残高を更新しました`);
        },
        onNavigate:setActiveView,
        skippedOccurrences,
        onSkip:handleSkip,
        onRestore:handleRestore,
        onDeleteTx:deleteTx,
        investmentData
      }),
      activeView==='transactions'&&h('div',{className:'space-y-4'},
        h('div',null,h('h2',{className:'text-xl font-bold text-gray-900 dark:text-gray-100'},'取引'),h('p',{className:'text-sm text-gray-400 mt-1'},'予定・実績・定期取引を管理')),
        h(TxManager,{accounts,txs:txs.filter(tx=>!tx.salary),onChange:updTxs,onDelete:deleteTx,addToast,salaryMonthly:monthlyRunRate(txs,todayStr().slice(0,7)).salary,repaymentMonthly:recurringMonthly(cashflowTxs.filter(tx=>tx.loanPlan)).expense})
      ),
      activeView==='salary'&&h(SalaryManager,{accounts,txs,onChange:updTxs,onDelete:deleteTx,addToast,prefs:preferences,onPrefs:updPreferences}),
      activeView==='accounts'&&h('div',{className:'space-y-4'},h('div',null,h('h2',{className:'text-xl font-bold text-gray-900 dark:text-gray-100'},'口座'),h('p',{className:'text-sm text-gray-400 mt-1'},'残高と表示色を管理')),h(AccountManager,{accounts,onChange:updAcc,addToast,todayBalances:accounts.length?buildForecast(accounts,cashflowTxs,todayD(),new Set(skippedOccurrences))[0]||{}:{}})),
      activeView==='investments'&&h(InvestmentHub,{data:investmentData,onReload:reloadInvestments,onStocksChange:updateInvestmentStocks,onEmbeddedChange:applyEmbeddedInvestmentData}),
      activeView==='loans'&&h('div',{className:'space-y-4'},h('div',null,h('h2',{className:'text-xl font-bold text-gray-900 dark:text-gray-100'},'借入'),h('p',{className:'text-sm text-gray-400 mt-1'},'カードローンや個人間の借入残高・返済を管理')),h(LoanManager,{loans,accounts,txs,onChange:updLoans,onReflectPayment:applyPayment,onUndoPayment:undoPayment,onAddTx:tx=>updTxs(current=>[...current,tx]),addToast})),
      activeView==='analysis'&&h(AnalysisView,{txs:cashflowTxs,budgets,onBudgetChange:updBudgets,skippedOccurrences})
    ),
    showSettings&&h(PreferencesModal,{onClose:()=>setShowSettings(false),dark,setDark,syncStatus,onRetry:syncAll,accounts,txs,loans,budgets,skipped:skippedOccurrences,prefs:preferences,onPrefs:updPreferences,onRestore:restoreBackup,onCsvImport:importCsv,userEmail}),
    h(Toast,{toasts})
  );
}

const AppErrorBoundary=React.Component&&class extends React.Component{
  constructor(props){super(props);this.state={failed:false};}
  static getDerivedStateFromError(){return {failed:true};}
  render(){
    if(!this.state.failed)return this.props.children;
    return h('main',{className:'min-h-screen bg-[#f7f7f5] dark:bg-gray-950 flex items-center justify-center p-5'},h('section',{role:'alert',className:cardCls+' max-w-lg p-6 space-y-4 text-gray-800 dark:text-gray-100'},
      h('h1',{className:'text-lg font-bold'},'画面を表示できませんでした'),
      h('p',{className:'text-sm'},'保存済みのデータは削除していません。端末に保存された内容の控えを取り、ページを再読み込みしてください。'),
      h('button',{className:'rounded-xl border border-gray-300 dark:border-gray-600 px-4 py-3 mr-2',onClick:()=>downloadBlob(`cashflow_recovery_${todayStr()}.json`,JSON.stringify({cache:readLocalCache(),pending:readPending()},null,2),'application/json')},'保存データの控え'),
      h('button',{className:'rounded-xl bg-indigo-600 text-white px-4 py-3',onClick:()=>window.location.reload()},'再読み込み')));
  }
};
ReactDOM.createRoot(document.getElementById('root')).render(h(React.StrictMode,null,h(AppErrorBoundary,null,h(AuthGate))));
</script>
