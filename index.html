// ─── Date helpers ─────────────────────────────────────
function sod(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function validTxDate(value){ return /^\d{4}-\d{2}-\d{2}$/.test(value||'')&&fmt(parseISO(value))===value; }
const DOW=['日','月','火','水','木','金','土'];
function fmtDisp(s){ const [y,m,d]=s.split('-'); const dt=new Date(Number(y),Number(m)-1,Number(d)); return `${y}/${m}/${d}(${DOW[dt.getDay()]})`; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){
  const day=d.getDate();
  const x=new Date(d); x.setDate(1); x.setMonth(x.getMonth()+n);
  const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();
  x.setDate(Math.min(day,last)); return x;
}
function isAfter(a,b){ return a.getTime()>b.getTime(); }
function isBefore(a,b){ return a.getTime()<b.getTime(); }
// 祝日法（2020年以降）に基づき年ごとに計算する。振替休日・国民の休日を含む。
const JP_HOLIDAY_CACHE={};
function nthMonday(y,m,n){ const first=new Date(y,m-1,1).getDay(); return 1+(8-first)%7+(n-1)*7; }
function jpHolidays(y){
  if(JP_HOLIDAY_CACHE[y]) return JP_HOLIDAY_CACHE[y];
  const k=(m,d)=>fmt(new Date(y,m-1,d));
  const vernal=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));
  const autumn=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));
  const set=new Set([[1,1],[1,nthMonday(y,1,2)],[2,11],[2,23],[3,vernal],[4,29],[5,3],[5,4],[5,5],
    [7,nthMonday(y,7,3)],[8,11],[9,nthMonday(y,9,3)],[9,autumn],[10,nthMonday(y,10,2)],[11,3],[11,23]].map(([m,d])=>k(m,d)));
  // 内閣府の特例日程: https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html
  if(y===2020||y===2021){
    [[7,nthMonday(y,7,3)],[8,11],[10,nthMonday(y,10,2)]].forEach(([m,d])=>set.delete(k(m,d)));
    (y===2020?[[7,23],[7,24],[8,10]]:[[7,22],[7,23],[8,8]]).forEach(([m,d])=>set.add(k(m,d)));
  }
  [...set].forEach(ds=>{ // 国民の休日: 祝日に挟まれた平日
    const mid=addDays(parseISO(ds),1);
    if(!set.has(fmt(mid))&&set.has(fmt(addDays(mid,1)))&&mid.getDay()!==0) set.add(fmt(mid));
  });
  [...set].sort().forEach(ds=>{ // 振替休日: 日曜の祝日の後の最初の平日
    if(parseISO(ds).getDay()!==0) return;
    let x=addDays(parseISO(ds),1);
    while(set.has(fmt(x))) x=addDays(x,1);
    set.add(fmt(x));
  });
  return JP_HOLIDAY_CACHE[y]=set;
}
function isJpHoliday(d){ return jpHolidays(d.getFullYear()).has(fmt(d)); }
function prevBizDay(d){
  let x=new Date(d);
  while(true){ const dow=x.getDay(),ds=fmt(x); if(dow!==0&&dow!==6&&!isJpHoliday(x)) break; x.setDate(x.getDate()-1); }
  return x;
}
function nextBizDay(d){
  let x=new Date(d);
  while(true){ const dow=x.getDay(),ds=fmt(x); if(dow!==0&&dow!==6&&!isJpHoliday(x)) break; x.setDate(x.getDate()+1); }
  return x;
}

async function _sbSet(key,value){

  // 読み込みに失敗して比較元がない家計データは、既存のクラウドを上書きしない。
  if(DATA_KEYS.includes(key)&&known===undefined)throw syncConflictError(key);
  let result;
  if(known===null) result=await _sb.from('user_data').insert({key,value,updated_at}).select('updated_at');
  else if(known!==undefined) result=await _sb.from('user_data').update({value,updated_at}).eq('key',key).eq('updated_at',known).select('updated_at');
  else result=await _sb.from('user_data').upsert({key,value,updated_at},{onConflict:'key'}).select('updated_at');
  if(result.error){if(known===null&&result.error.code==='23505')throw syncConflictError(key);throw result.error;}
  if(known!==undefined&&!(result.data||[]).length) throw syncConflictError(key);
  if(DATA_KEYS.includes(key)) rememberStamp(key,result.data?.[0]?.updated_at??updated_at);
  if(key==='sp_stocks') writeStocksBase(value);
  return value;
}

function stockUserFields(stock){

function readStocksBase(){try{const v=JSON.parse(localGet(LS_STOCKS_BASE)||'null');return Array.isArray(v)?v:null;}catch{return null;}}
function writeStocksBase(stocks){if(Array.isArray(stocks))localSet(LS_STOCKS_BASE,JSON.stringify(stocks));}
function mergeStockEdits(base,local,remote){
  const baseMap=new Map(base.map(stock=>[stock.id,stock])),localIds=new Set(local.map(stock=>stock.id));
  let result=remote.map(stock=>({...stock}));
  local.forEach(stock=>{
    const before=baseMap.get(stock.id);
    if(before&&JSON.stringify(stockUserFields(before))===JSON.stringify(stockUserFields(stock)))return;
    const index=result.findIndex(item=>item.id===stock.id);
    if(index>=0)result[index]={...result[index],...stockUserFields(stock)};
    else result.push({...stock});
  });
  base.forEach(stock=>{if(!localIds.has(stock.id))result=result.filter(item=>item.id!==stock.id);});
  return result;
}

// ─── Forecast ─────────────────────────────────────────
function recurrenceStartIndex(base,startD,frequency){
  const days=Math.floor((Date.UTC(startD.getFullYear(),startD.getMonth(),startD.getDate())-
    Date.UTC(base.getFullYear(),base.getMonth(),base.getDate()))/86400000);
  const months=(startD.getFullYear()-base.getFullYear())*12+startD.getMonth()-base.getMonth();
  if(frequency==='daily') return Math.max(0,days-14);
  if(frequency==='weekly') return Math.max(0,Math.floor(days/7)-2);
  if(frequency==='monthly') return Math.max(0,months-2);
  if(frequency==='yearly') return Math.max(0,Math.floor(months/12)-2);
  return 0;
}
function expandRecBase(tx, startD, endD, skippedKeys){
  const evts=[];
  const base=sod(parseISO(tx.startDate));
  const biz=tx.adjustBizDay;
  // 前営業日への移動では、期間外の予定日が期間内に繰り上がることがある。
  const searchEnd=biz==='prev'||biz===true ? addDays(endD,7) : endD;
  const lim=tx.endDate ? new Date(Math.min(sod(parseISO(tx.endDate)),searchEnd)) : searchEnd;
  const overrides=tx.overrides||{};
  const first=recurrenceStartIndex(base,startD,tx.frequency);
  for(let n=first;n<first+1500;n++){
    let cur;
    if(tx.frequency==='daily') cur=addDays(base,n);
    else if(tx.frequency==='weekly') cur=addDays(base,n*7);
    else if(tx.frequency==='monthly') cur=addMonths(base,n);
    else if(tx.frequency==='yearly') cur=addMonths(base,n*12);
    else break;
    cur=sod(cur);
    if(isAfter(cur,lim)) break;
    const adj=biz==='prev'||biz===true ? sod(prevBizDay(cur)) : biz==='next' ? sod(nextBizDay(cur)) : cur;
    if(!isBefore(adj,startD)&&!isAfter(adj,endD)){
      const ds=fmt(adj);
      if(!skippedKeys||!skippedKeys.has(`${tx.id}_${ds}`)){
        const raw=overrides[ds]!==undefined ? overrides[ds] : tx.amount;
        const amt=tx.type==='income'?raw:tx.type==='transfer'?raw:-raw;
        evts.push({date:adj,amt});
      }
    }
  }
  return evts;
}

function expandRec(tx,startD,endD,skippedKeys){
  const moves=tx.dateMoves||{};
  const events=expandRecBase(tx,startD,endD,skippedKeys).filter(event=>!moves[fmt(event.date)]);
  Object.entries(moves).forEach(([original,target])=>{
    if(!validTxDate(original)||!validTxDate(target))return;
    const date=sod(parseISO(target));
    if(isBefore(date,startD)||isAfter(date,endD)||skippedKeys?.has(`${tx.id}_${original}`)||skippedKeys?.has(`${tx.id}_${target}`))return;
    const source=expandRecBase(tx,sod(parseISO(original)),sod(parseISO(original)),null)[0];
    if(!source)return;
    const raw=tx.overrides?.[target]??Math.abs(source.amt);
    events.push({date,amt:tx.type==='expense'?-raw:raw});
  });
  return events.filter(event=>!(tx.paidDates||[]).includes(fmt(event.date))&&!(tx.untilDate&&fmt(event.date)>tx.untilDate)).sort((a,b)=>a.date-b.date);
}

function moveScheduledTransaction(tx,fromDate,toDate,today=todayStr(),skippedKeys=new Set()){
  if(tx?.loanPayment)return {error:'反映済みの返済は借入タブで管理してください'};
  if(!tx||!validTxDate(fromDate)||!validTxDate(toDate))return {error:'有効な移動日を選択してください'};
  if(fromDate<today||toDate<today)return {error:'今日以降の予定へ移動してください'};
  if(fromDate===toDate)return {transaction:tx};
  if(skippedKeys.has(`${tx.id}_${fromDate}`))return {error:'支払済み・除外済みの予定は移動できません'};
  if(!tx.recurring){
    if(tx.startDate!==fromDate)return {error:'予定が変更されています。表示を更新してください'};
    return {transaction:{...tx,startDate:toDate}};
  }
  const from=sod(parseISO(fromDate)),to=sod(parseISO(toDate));
  const sources=expandRec(tx,from,from,skippedKeys);
  if(!sources.length)return {error:'移動元の予定が見つかりません'};
  if(sources.length>1)return {error:'同じ定期取引がこの日に複数あります。取引の設定から日付を確認してください'};
  if(expandRec(tx,to,to,null).length||skippedKeys.has(`${tx.id}_${toDate}`))return {error:'移動先には同じ定期取引の予定があります。別の日を選んでください'};
  const dateMoves={...(tx.dateMoves||{})};
  const original=Object.keys(dateMoves).find(date=>dateMoves[date]===fromDate)||fromDate;
  if(toDate===original)delete dateMoves[original];
  else dateMoves[original]=toDate;
  const overrides={...(tx.overrides||{})};
  if(overrides[fromDate]!==undefined){overrides[toDate]=overrides[fromDate];delete overrides[fromDate];}
  return {transaction:{...tx,dateMoves,overrides}};
}

function loanRepaymentId(loanId){return `loan-repayment:${loanId}`;}
function loanPaymentId(loanId,paymentId){return `loan-payment:${loanId}:${paymentId}`;}
function reflectLoanPayment(accounts,loan,payment,accountId){
  const id=loanPaymentId(loan.id,payment.id);
  if(accounts.some(account=>(account.loanRepayments||[]).some(item=>item.id===id)))return accounts;
  if(!accounts.some(account=>account.id===accountId))throw new Error('返済元口座を選択してください');
  if(!Number.isSafeInteger(Number(payment.amount))||Number(payment.amount)<=0||!validTxDate(payment.paidAt)||payment.paidAt>todayStr())throw new Error('返済額と日付を確認してください（今日までの返済のみ反映できます）');
  return accounts.map(account=>account.id!==accountId?account:{...account,balance:Number(account.balance)-Number(payment.amount),loanRepayments:[...(account.loanRepayments||[]),{id,loanId:loan.id,paymentId:payment.id,amount:Number(payment.amount),paidAt:payment.paidAt,...(payment.coversDate!==undefined?{coversDate:payment.coversDate}:{}),label:`返済（${loan.name}）`} ]});
}
function undoLoanPayment(accounts,loanId,paymentId){
  const id=loanPaymentId(loanId,paymentId);
  return accounts.map(account=>{const item=(account.loanRepayments||[]).find(entry=>entry.id===id);return item?{...account,balance:Number(account.balance)+item.amount,loanRepayments:account.loanRepayments.filter(entry=>entry.id!==id)}:account;});
}
function loanRepaymentStatus(loan,txs,accounts){
  if(loan.repaymentMethod==='lumpSum'){
    if(!(Number(loan.balance)>0))return {needed:false,ready:true,message:''};
    const account=accounts.find(item=>item.id===loan.repaymentAccountId);
    return {needed:true,ready:!!account,message:account?`残高表: ${account.name}から支払日に一括返済`:'残高表に未反映です。「編集」で返済元口座を設定してください。'};
  }
  if(!(Number(loan.balance)>0)||!(tieredPayment(loan,Number(loan.balance))>0))return {needed:false,ready:true,message:''};
  if(loan.repaymentTransactionId){
    const tx=txs.find(item=>item.id===loan.repaymentTransactionId&&item.type==='expense'&&item.recurring);
    const ready=!!tx&&accounts.some(account=>account.id===tx.accountId);
    return {needed:true,ready,message:ready?'残高表: 登録済みの返済取引を使用':'選択した返済取引・口座がありません。編集から設定を確認してください。'};
  }
  const account=accounts.find(item=>item.id===loan.repaymentAccountId);
  const ready=!!account&&validTxDate(loan.nextPaymentDate);
  return {needed:true,ready,message:ready?`残高表: ${account.name}から毎月返済`:'残高表に未反映です。「編集」で返済元口座と次回返済日を設定してください。'};
}
// 返済記録が消し込む定期返済の日付。coversDate未設定の古い記録は返済日と同じ日の予定を消し込む。
function loanCoveredDates(loan,payments){
  const records=[...(loan.payments||[]),...payments.filter(item=>item.loanId===loan.id&&!(loan.payments||[]).some(p=>p.id===item.paymentId))];
  return records.map(item=>item.coversDate!==undefined?item.coversDate:item.paidAt).filter(Boolean);
}
// 借入残高を超えて返済予定を出さない。最終回は残額に合わせる（利息は考慮しない）。
function capLoanSchedule(tx,balance){
  const amount=Math.abs(Number(tx.amount)||0);
  if(!(balance>0)||!(amount>0))return tx;
  const today=todayD(),n=Math.ceil(balance/amount)+Object.keys(tx.overrides||{}).length+12;
  const months={daily:Math.ceil(n/28)+1,weekly:Math.ceil(n/4)+1,monthly:n,yearly:n*12}[tx.frequency]||n;
  let rest=balance;
  for(const event of expandRec(tx,today,addMonths(today,months),null)){
    const value=Math.abs(event.amt),ds=fmt(event.date);
    if(value<rest){rest-=value;continue;}
    if(value===rest)return {...tx,untilDate:ds};
    const prev=(tx.overrides||{})[ds];
    return {...tx,untilDate:ds,overrides:{...(tx.overrides||{}),[ds]:rest},loanCap:{date:ds,amount:rest,prev}};
  }
  return tx;
}
function withLoanRepaymentPlans(txs,loans,accounts){
  const accountIds=new Set(accounts.map(account=>account.id));
  const payments=accounts.flatMap(account=>(account.loanRepayments||[]).map(item=>({...item,accountId:account.id,type:'expense',category:'返済',startDate:item.paidAt,recurring:false,loanPayment:true})));
  const scheduledTxs=txs.map(tx=>{
    const loan=(loans||[]).find(item=>item.repaymentTransactionId===tx.id);
    if(!loan||!tx.recurring)return tx;
    const paidDates=loanCoveredDates(loan,payments);
    const base=paidDates.length?{...tx,paidDates}:tx;
    if(sortedPaymentTiers(loan).length)return slideLoanSchedule({...base,amount:tieredPayment(loan,Number(loan.balance)),adjustBizDay:base.adjustBizDay},loan);
    return capLoanSchedule(base,Number(loan.balance));
  });
  const plans=(loans||[]).flatMap(loan=>{
    if(loan.repaymentMethod==='lumpSum'){
      if(!accountIds.has(loan.repaymentAccountId))return [];
      const covered=new Set(loanCoveredDates(loan,payments));
      return lumpSumDues(loan).filter(due=>!covered.has(due.date)).map(due=>({id:`loan-lump:${loan.id}:${due.date}`,loanId:loan.id,loanPlan:true,lumpSum:true,
        label:`返済（${loan.name}・一括）`,type:'expense',category:'返済',amount:due.amount,accountId:loan.repaymentAccountId,recurring:false,startDate:due.date}));
    }
    const slide=sortedPaymentTiers(loan).length>0;
    const amount=slide?tieredPayment(loan,Number(loan.balance)):Number(loan.monthlyPayment||0);
    if(loan.repaymentTransactionId||!(Number(loan.balance)>0)||!Number.isSafeInteger(amount)||amount<=0||
      !validTxDate(loan.nextPaymentDate)||!accountIds.has(loan.repaymentAccountId))return [];
    const plan={id:loanRepaymentId(loan.id),loanId:loan.id,loanPlan:true,label:`返済（${loan.name}）`,type:'expense',category:'返済',
      amount,accountId:loan.repaymentAccountId,recurring:true,frequency:'monthly',startDate:loan.nextPaymentDate,
      endDate:null,adjustBizDay:loan.adjustBizDay||(isChibabankCardLoan(loan)?'next':''),paidDates:loanCoveredDates(loan,payments),overrides:loan.repaymentOverrides||{},dateMoves:loan.repaymentDateMoves||{}};
    return [slide?slideLoanSchedule(plan,loan):capLoanSchedule(plan,Number(loan.balance))];
  });
  return [...scheduledTxs,...plans,...payments];
}
// 予定表示用の付加情報を外し、保存できる取引に戻す。
function stripLoanScheduleFields(tx){
  const {paidDates,untilDate,loanCap,slideComputed,...clean}=tx;
  if(slideComputed&&clean.overrides){
    clean.overrides=Object.fromEntries(Object.entries(clean.overrides).filter(([date,value])=>slideComputed[date]!==value));
  }
  if(loanCap&&clean.overrides&&clean.overrides[loanCap.date]===loanCap.amount){
    const overrides={...clean.overrides};
    if(loanCap.prev===undefined)delete overrides[loanCap.date];else overrides[loanCap.date]=loanCap.prev;
    clean.overrides=overrides;
  }
  return clean;
}
// ─── 利息・限度額・キャッシング ─────────────────────────
// 日割り利息（円未満切り捨て）。カードローン・キャッシングの一般的な計算方法。
// unit は付利単位（千葉銀行は100円未満を切り捨てて計算）。
function loanInterest(balance,ratePct,days,unit=1){
  const b=Math.floor((Number(balance)||0)/unit)*unit,r=Number(ratePct)||0;
  if(!(b>0)||!(r>0)||!(days>0))return 0;
  return Math.floor(b*r/100*days/365);
}
// 利用限度額が設定されていれば、あといくら借りられるか。未設定は null。
function loanAvailable(loan){
  const limit=Number(loan?.creditLimit)||0;
  return limit>0?Math.max(0,limit-(Number(loan.balance)||0)):null;
}
function daysBetween(from,to){return Math.round((parseISO(to)-parseISO(from))/86400000);}
// カードの締め日・支払日から、その日に借りた分の返済日を求める（支払日が休日なら翌営業日）。
// closingDay は 1〜31（31は月末）。
function cardPaymentDate(date,closingDay,paymentDay){
  const d=parseISO(date);
  const monthEnd=(y,m)=>new Date(y,m+1,0).getDate();
  const closing=Math.min(Number(closingDay)||31,monthEnd(d.getFullYear(),d.getMonth()));
  const closeMonth=d.getDate()<=closing?0:1;
  const pay=new Date(d.getFullYear(),d.getMonth()+closeMonth+1,1);
  pay.setDate(Math.min(Number(paymentDay)||27,monthEnd(pay.getFullYear(),pay.getMonth())));
  return fmt(nextBizDay(pay));
}
// 翌月一括返済（キャッシング）で未返済の借入を返済日ごとにまとめる。利息は借りた日から返済日まで。
function lumpSumDues(loan){
  const groups={};
  (loan.borrowings||[]).filter(item=>item.due&&!item.settled).forEach(item=>{
    const g=groups[item.due]||(groups[item.due]={date:item.due,principal:0,interest:0,ids:[]});
    g.principal+=Number(item.amount)||0;
    g.interest+=loanInterest(item.amount,loan.interestRate,Math.max(0,daysBetween(item.date,item.due)));
    g.ids.push(item.id);
  });
  return Object.values(groups).sort((a,b)=>a.date.localeCompare(b.date)).map(g=>({...g,amount:g.principal+g.interest}));
}
// 毎月返済の1回分を利息と元金に分ける。前回の返済（なければ30日前）からの日割り利息を先に払う。
function splitLoanPayment(loan,amount,date){
  const last=[...(loan.payments||[])].map(item=>item.paidAt).filter(value=>validTxDate(value)&&value<date).sort().at(-1);
  const days=last?daysBetween(last,date):30;
  const interest=Math.min(Number(amount),loanInterest(loan.balance,loan.interestRate,days,loanInterestUnit(loan)));
  const principal=Math.min(Number(amount)-interest,Number(loan.balance)||0);
  return {interest,principal:Math.max(0,principal)};
}
// 手動で返済したとき、翌月一括の借入を返済日の早い順に、返した元金の分だけ返済済みにする。
function settleLumpSum(loan,principal,paymentId){
  let rest=Number(principal)||0;
  const order=[...(loan.borrowings||[])].filter(item=>item.due&&!item.settled).sort((a,b)=>a.due.localeCompare(b.due)||a.date.localeCompare(b.date)).map(item=>item.id);
  const settle=new Set();
  for(const id of order){
    const item=loan.borrowings.find(entry=>entry.id===id);
    if(rest<Number(item.amount))break;
    rest-=Number(item.amount);settle.add(id);
  }
  return (loan.borrowings||[]).map(item=>settle.has(item.id)?{...item,settled:true,settledBy:paymentId}:item);
}
// 千葉銀行カードローンの約定返済額（約定返済日前日の最終借入残高ごと）。
// クイックパワー＜アドバンス＞・マイワレット・プレミアクラスの商品概要（千葉銀行公式サイト、2025年12月16日現在ほか）で共通。
const CHIBABANK_CARDLOAN_TIERS=[
  [100000,2000],[200000,4000],[300000,6000],[400000,8000],[500000,10000],[1000000,15000],
  [1500000,20000],[2000000,25000],[2500000,30000],[3000000,35000],[3500000,40000],[4000000,45000],
  [4500000,50000],[5000000,55000],[6000000,60000],[7000000,65000],[8000000,70000]
].map(([upTo,amount])=>({upTo,amount}));
const LOAN_PAYMENT_TABLES={chibabank:{label:'千葉銀行カードローンの返済額表（残高スライド）',tiers:CHIBABANK_CARDLOAN_TIERS,interestUnit:100}};
// 残高スライド方式: 返済額をその時点の借入残高で決める。
// paymentTiers は {upTo, amount} の一覧。upTo が null の行は「それより上すべて」。未設定なら月間返済額（固定）。
// 借入先・名前が千葉銀行のカードローン（翌月一括を除く）。
function isChibabankCardLoan(loan){
  return loan?.repaymentMethod!=='lumpSum'&&!['cashing','personal'].includes(loan?.loanType)&&/千葉銀|ちばぎん/.test(`${loan?.lender||''}${loan?.name||''}`);
}
// 使う返済額表。「毎月同じ額」を選んだ借入（paymentTable:'fixed'）以外で、千葉銀行カードローンなら銀行の表を自動で使う。
function loanPaymentTable(loan){
  if(loan?.paymentTable==='fixed')return null;
  if(loan?.paymentTable&&LOAN_PAYMENT_TABLES[loan.paymentTable])return loan.paymentTable;
  if((loan?.paymentTiers||[]).length)return null;
  return isChibabankCardLoan(loan)?'chibabank':null;
}
// 入力中のフォームで使う返済額表（未選択なら千葉銀行カードローンは銀行の表）。
function formPaymentTable(form){
  return form.paymentTable||(isChibabankCardLoan(form)?'chibabank':'fixed');
}
function loanInterestUnit(loan){
  const table=loanPaymentTable(loan);
  return Number(loan?.interestUnit)||(table?LOAN_PAYMENT_TABLES[table].interestUnit:1)||1;
}
function sortedPaymentTiers(loan){
  const table=loanPaymentTable(loan);
  const tiers=table?LOAN_PAYMENT_TABLES[table].tiers:(loan.paymentTable==='fixed'?[]:loan.paymentTiers||[]);
  return tiers.filter(tier=>Number(tier.amount)>0)
    .sort((a,b)=>(a.upTo==null?Infinity:Number(a.upTo))-(b.upTo==null?Infinity:Number(b.upTo)));
}
function tieredPayment(loan,balance){
  const tiers=sortedPaymentTiers(loan);
  if(!tiers.length)return Number(loan.monthlyPayment)||0;
  const tier=tiers.find(item=>item.upTo==null||Number(balance)<=Number(item.upTo))||tiers.at(-1);
  return Number(tier.amount);
}
const SLIDE_HORIZON_MONTHS=120;
// 残高スライドの返済予定。今日以降の各回で、見込み残高から返済額を決め、日割り利息を引いた元金で残高を減らす。
// 自分で確定した回（overrides）はその額を使う。完済する回で予定を止める。
function slideLoanSchedule(tx,loan){
  let balance=Number(loan.balance)||0;
  if(!(balance>0)||!sortedPaymentTiers(loan).length)return tx;
  const today=todayD(),userOverrides=tx.overrides||{},computed={},overrides={...userOverrides};
  const lastPaid=[...(loan.payments||[])].map(item=>item.paidAt).filter(value=>validTxDate(value)&&value<=fmt(today)).sort().at(-1);
  let prev=lastPaid||fmt(addDays(today,-30));
  for(const event of expandRec({...tx,overrides:{}},today,addMonths(today,SLIDE_HORIZON_MONTHS),null)){
    const ds=fmt(event.date);
    const interest=loanInterest(balance,loan.interestRate,Math.max(1,daysBetween(prev,ds)),loanInterestUnit(loan));
    const planned=userOverrides[ds]!==undefined?Number(userOverrides[ds]):tieredPayment(loan,balance);
    const due=Math.min(planned,balance+interest);
    if(userOverrides[ds]===undefined||due!==Number(userOverrides[ds])){overrides[ds]=due;computed[ds]=due;}
    balance-=Math.max(0,due-interest);
    prev=ds;
    if(balance<=0)return {...tx,overrides,slideComputed:computed,untilDate:ds};
  }
  return {...tx,overrides,slideComputed:computed};
}
// 残高スライドで、次に返済額が下がる回（返済予定から求める）。
function loanNextStepDown(loan,txs,accounts){
  if(!sortedPaymentTiers(loan).length||!(Number(loan.balance)>0))return null;
  const plan=withLoanRepaymentPlans(txs||[],[loan],accounts||[]).find(item=>item.loanPlan?item.loanId===loan.id:(!item.loanPayment&&item.id===loan.repaymentTransactionId));
  if(!plan)return null;
  const today=todayD(),events=expandRec(plan,today,addMonths(today,SLIDE_HORIZON_MONTHS),null);
  if(!events.length)return null;
  const first=Math.abs(events[0].amt);
  const next=events.find(event=>Math.abs(event.amt)<first);
  return next?{date:fmt(next.date),amount:Math.abs(next.amt),current:first,firstDate:fmt(events[0].date)}:{current:first,firstDate:fmt(events[0].date)};
}
// 毎月返済の完済見込み。返済額が利息以下なら完済できない。
function loanPayoffPlan(loan,maxMonths=600){
  let balance=Number(loan.balance)||0,totalInterest=0,months=0;
  if(!(balance>0))return {months:0,totalInterest:0};
  if(!(tieredPayment(loan,balance)>0))return {error:'月間返済額が未設定です'};
  while(balance>0&&months<maxMonths){
    const payment=tieredPayment(loan,balance);
    const interest=loanInterest(balance,loan.interestRate,30,loanInterestUnit(loan));
    if(payment<=interest)return {error:'返済額が利息以下のため、このままでは残高が減りません'};
    totalInterest+=interest;
    balance-=Math.min(balance,payment-interest);
    months++;
  }
  return {months,totalInterest};
}

// 借りたお金を口座に入れる入金取引を作る。additional なら追加の借入として借入残高と借入総額も増やす。
// 入金は通常の収入取引なので、残高の入力日以降の日付なら今日の見込みに加わり、入力済みの残高とは二重にならない。
function loanDeposit(loan,{amount,date,accountId,additional},accounts){
  const value=Number(amount);
  if(!Number.isSafeInteger(value)||value<=0)return {error:'入金額を整数の円で入力してください'};
  if(!validTxDate(date))return {error:'有効な入金日を入力してください'};
  if(!accounts.some(account=>account.id===accountId))return {error:'入金する口座を選択してください'};
  const available=loanAvailable(loan);
  if(additional&&available!==null&&value>available)return {error:`利用限度額を超えます（空き枠 ${'¥'+available.toLocaleString()}）`};
  const transaction={id:genId(),type:'income',category:'借入',label:`借入（${loan.name}）`,amount:value,accountId,startDate:date,recurring:false,loanId:loan.id};
  const lumpSum=additional&&loan.repaymentMethod==='lumpSum';
  const record={id:transaction.id,amount:value,date,accountId,additional:!!additional,...(lumpSum?{due:cardPaymentDate(date,loan.closingDay,loan.paymentDay)}:{})};
  const next={...loan,borrowings:[...(loan.borrowings||[]),record],
    ...(additional?{balance:Number(loan.balance||0)+value,originalAmount:Number(loan.originalAmount||loan.balance||0)+value}:{})};
  return {transaction,loan:next};
}
// 指定日の前後で、まだ消し込まれていない最初の定期返済日。
function nextLoanOccurrence(loan,loans,txs,accounts,fromDate,backDays=7){
  if(!validTxDate(fromDate))return '';
  const tx=withLoanRepaymentPlans(txs,loans,accounts).find(item=>item.loanPlan?item.loanId===loan.id:(!item.loanPayment&&item.id===loan.repaymentTransactionId));
  if(!tx)return '';
  const d=parseISO(fromDate),event=expandRec(tx,addDays(d,-backDays),addDays(d,45),null)[0];
  return event?fmt(event.date):'';
}

// 口座残高 balance は「balanceAsOf より前の入出金（balanceIncludesAsOfDay なら当日分も）」を反映済みの値。
// 未設定なら今日の入出金は未反映として扱う。返済記録は反映時に残高から引いているため常に反映済み。
function balanceEvents(txs,startD,endD,skippedKeys){
  const evts=[];
  txs.forEach(tx=>{
    const push=(date,amt)=>{
      if(tx.type==='transfer'){evts.push({date,amt:-amt,aid:tx.fromAccountId,tx});evts.push({date,amt,aid:tx.toAccountId,tx});}
      else evts.push({date,amt,aid:tx.accountId,tx});
    };
    if(tx.recurring){
      expandRec(tx,startD,endD,skippedKeys).forEach(e=>push(e.date,e.amt));
    } else if(tx.startDate){
      const d=sod(parseISO(tx.startDate)),ds=fmt(d);
      if(!isBefore(d,startD)&&!isAfter(d,endD)&&(!skippedKeys||!skippedKeys.has(`${tx.id}_${ds}`)))
        push(d,tx.type==='income'||tx.type==='transfer'?tx.amount:-tx.amount);
    }
  });
  return evts;
}
function balanceAnchor(account){
  const date=validTxDate(account.balanceAsOf)?account.balanceAsOf:todayStr();
  return {date,includesDay:!!account.balanceIncludesAsOfDay};
}
function eventIncludedInBalance(ev,anchor){
  if(ev.tx.loanPayment)return true;
  const ds=fmt(ev.date);
  return ds<anchor.date||(ds===anchor.date&&anchor.includesDay);
}
// startD〜endD の各日の終了時点の残高。
function buildBalanceRows(accounts,txs,startD,endD,skippedKeys){
  const anchors=Object.fromEntries(accounts.map(a=>[a.id,balanceAnchor(a)]));
  const anchorDates=Object.values(anchors).map(a=>parseISO(a.date));
  const lo=new Date(Math.min(startD,...anchorDates)),hi=new Date(Math.max(endD,...anchorDates));
  const byDate={};
  balanceEvents(txs,sod(lo),sod(hi),skippedKeys).forEach(ev=>{
    const anchor=anchors[ev.aid];
    if(!anchor)return;
    const ds=fmt(ev.date);
    (byDate[ds]=byDate[ds]||[]).push({...ev,included:eventIncludedInBalance(ev,anchor)});
  });
  // 期間開始前日の終了時点の残高を求める。
  const before=fmt(addDays(startD,-1));
  const cur={};
  accounts.forEach(a=>{cur[a.id]=Number(a.balance)||0;});
  Object.entries(byDate).forEach(([ds,evs])=>evs.forEach(ev=>{
    if(ev.included&&ds>before)cur[ev.aid]-=ev.amt;
    else if(!ev.included&&ds<=before)cur[ev.aid]+=ev.amt;
  }));
  const rows=[];
  for(let cursor=sod(startD);!isAfter(cursor,endD);cursor=addDays(cursor,1)){
    const ds=fmt(cursor);
    (byDate[ds]||[]).forEach(ev=>{cur[ev.aid]+=ev.amt;});
    const row={date:ds};let tot=0;
    accounts.forEach(a=>{row[a.id]=Math.round(cur[a.id]);tot+=cur[a.id];});
    row.total=Math.round(tot);
    rows.push(row);
  }
  return rows;
}
function buildForecast(accounts, txs, endD, skippedKeys){
  return buildBalanceRows(accounts,txs,todayD(),endD,skippedKeys);
}

// ─── Transaction List for Details ─────────────────────
function buildTxList(txs, endD, skippedKeys) {
  const today=todayD();
  const evts=[];
  txs.forEach(tx=>{
    if(tx.recurring){
      if(tx.type==='transfer'){
        expandRec(tx,today,endD,skippedKeys).forEach(e=>{
          evts.push({date:fmt(e.date),label:tx.label,category:tx.category||'',type:'transfer',amount:Math.abs(e.amt),fromAccountId:tx.fromAccountId,toAccountId:tx.toAccountId,txId:tx.id,recurring:true});
        });
      } else {
        expandRec(tx,today,endD,skippedKeys).forEach(e=>{
          evts.push({date:fmt(e.date),label:tx.label,category:tx.category||'',type:tx.type,amount:Math.abs(e.amt),accountId:tx.accountId,txId:tx.id,recurring:true});
        });
      }
    } else {
      const d=sod(parseISO(tx.startDate));
      const ds=fmt(d);
      if(!isBefore(d,today)&&!isAfter(d,endD)&&(!skippedKeys||!skippedKeys.has(`${tx.id}_${ds}`))){
        if(tx.type==='transfer'){
          evts.push({date:ds,label:tx.label,category:tx.category||'',type:'transfer',amount:tx.amount,fromAccountId:tx.fromAccountId,toAccountId:tx.toAccountId,txId:tx.id,recurring:false});
        } else {
          evts.push({date:ds,label:tx.label,category:tx.category||'',type:tx.type,amount:tx.amount,accountId:tx.accountId,txId:tx.id,recurring:false});
        }
      }
    }
  });
  evts.sort((a,b)=>a.date.localeCompare(b.date));
  return evts;
}

// ─── Historical Forecast (past) ───────────────────────
function buildHistoricalForecast(accounts, txs, startD, skippedKeys){
  return buildBalanceRows(accounts,txs,startD,todayD(),skippedKeys);
}

// ─── Past Transaction List ─────────────────────────────
function buildPastTxList(txs, startD, skippedKeys){
  const today=todayD();
  const evts=[];
  txs.forEach(tx=>{
    if(tx.recurring){
      if(tx.type==='transfer'){
        expandRec(tx,startD,today,skippedKeys).forEach(e=>{
          evts.push({date:fmt(e.date),label:tx.label,category:tx.category||'',type:'transfer',amount:Math.abs(e.amt),fromAccountId:tx.fromAccountId,toAccountId:tx.toAccountId,txId:tx.id,recurring:true});
        });
      } else {
        expandRec(tx,startD,today,skippedKeys).forEach(e=>{
          evts.push({date:fmt(e.date),label:tx.label,category:tx.category||'',type:tx.type,amount:Math.abs(e.amt),accountId:tx.accountId,txId:tx.id,recurring:true});
        });
      }
    } else {
      const d=sod(parseISO(tx.startDate));
      const ds=fmt(d);
      if(!isBefore(d,startD)&&!isAfter(d,today)&&(!skippedKeys||!skippedKeys.has(`${tx.id}_${ds}`))){
        if(tx.type==='transfer'){
          evts.push({date:ds,label:tx.label,category:tx.category||'',type:'transfer',amount:tx.amount,fromAccountId:tx.fromAccountId,toAccountId:tx.toAccountId,txId:tx.id,recurring:false});
        } else {
          evts.push({date:ds,label:tx.label,category:tx.category||'',type:tx.type,amount:tx.amount,accountId:tx.accountId,txId:tx.id,recurring:false});
        }

}

// ─── Monthly breakdown (実績/予測 共通) ─────────────────
// startD〜endD の収入・支出を「名前×口座」単位で集計する。
// 定期取引はスケジュールから展開、単発取引は期間内のものを含める。
function computeBreakdown(txs, startD, endD, skippedKeys){
  const incMap={},expMap={};
  txs.forEach(tx=>{
    if(tx.type==='transfer') return;
    const target=tx.type==='income'?incMap:expMap;
    const key=tx.label;
    const add=amt=>{
      if(!target[key]) target[key]={label:tx.label,category:tx.category||'',total:0,count:0};
      target[key].total+=amt; target[key].count++;
    };
    if(tx.recurring){
      expandRec(tx,startD,endD,skippedKeys).forEach(e=>add(Math.abs(e.amt)));
    } else if(tx.startDate){
      const d=sod(parseISO(tx.startDate));
      const ds=fmt(d);
      if(!isBefore(d,startD)&&!isAfter(d,endD)&&!(skippedKeys&&skippedKeys.has(`${tx.id}_${ds}`))) add(tx.amount);
    }
  });
  const incomeItems=Object.values(incMap).sort((a,b)=>b.total-a.total);
  const expenseItems=Object.values(expMap).sort((a,b)=>b.total-a.total);
  return {
    incomeItems, expenseItems,
    incTotal:incomeItems.reduce((s,it)=>s+it.total,0),
    expTotal:expenseItems.reduce((s,it)=>s+it.total,0),
  };
}

function guessCategory(label){
  const text=String(label||'').normalize('NFKC');
  if(!text.trim())return '';
  return CATEGORY_RULES.find(([,pattern])=>pattern.test(text))?.[0]||'';
}
// 入力中の名前に合わせたカテゴリ。「その他」か、前の名前から推定したカテゴリのままなら付け替える。
function autoCategoryFor(form,label){
  const guess=text=>{const found=guessCategory(text);return form.type==='income'?(found==='給与'?found:''):(found==='給与'?'':found);};
  if(form.type==='transfer')return form.category;
  return form.category==='その他'||form.category===guess(form.label)?(guess(label)||'その他'):form.category;
}
// 分析では、借入の返済は「返済」、「その他」やカテゴリなしの支出は名前から振り分け、分からなければ「その他」に入れる。
function analysisCategory(category,label){
  if(category===REPAYMENT_CAT)return REPAYMENT_CAT;
  const known=CATEGORY_ALIASES[category]||category;
  if(EXPENSE_CATS.includes(known)&&known!=='その他')return known;
  const guessed=guessCategory(label);
  return EXPENSE_CATS.includes(guessed)?guessed:'その他';
}
const STALE_BALANCE_DAYS=3;
const DEFAULT_PREFS={notifications:false,notifyDays:7,largePayment:100000,lowBalance:0,autoLoanPayments:true,autoSalary:true,salaryAutoDismissed:[]};

function monthBounds(base){
  const d=sod(base);
  return {
    start:sod(new Date(d.getFullYear(),d.getMonth(),1)),
    end:sod(new Date(d.getFullYear(),d.getMonth()+1,0))
  };
}
function buildMonthlyStats(txs,base,skippedKeys,throughToday=false){
  const {start,end:rawEnd}=monthBounds(base);
  const end=throughToday&&base.getMonth()===todayD().getMonth()&&base.getFullYear()===todayD().getFullYear()?todayD():rawEnd;
  const byCategory={}; let income=0,expense=0;
  txs.forEach(tx=>{
    if(tx.type==='transfer') return;
    const addAmount=(amount)=>{
      const n=Math.abs(Number(amount)||0);
      if(tx.type==='income') income+=n;
      else {expense+=n; const cat=analysisCategory(tx.category,tx.label); byCategory[cat]=(byCategory[cat]||0)+n;}
    };
    if(tx.recurring){
      expandRec(tx,start,end,skippedKeys).forEach(e=>addAmount(e.amt));
    } else if(tx.startDate){
      const d=sod(parseISO(tx.startDate)),ds=fmt(d);
      if(!isBefore(d,start)&&!isAfter(d,end)&&(!skippedKeys||!skippedKeys.has(`${tx.id}_${ds}`))) addAmount(tx.amount);
    }
  });
  return {income,expense,net:income-expense,byCategory,start,end};
}
// 残高が line（注意ライン、未設定なら0円）を下回る最初の日。shortage はラインまでの不足額。
function findShortfalls(accounts,forecast,line=0){
  const found=[];
  accounts.forEach(account=>{
    const first=forecast.find(row=>Number(row[account.id])<line);
    if(!first) return;
    const balance=Number(first[account.id]);
    found.push({account,date:first.date,shortage:line-balance,balance});
  });
  return found.sort((a,b)=>a.date.localeCompare(b.date));
}
// 残高不足への対応候補。不足日の前営業日（今日より前なら今日）までに、
// 余裕のある別口座から振り替えるか、空き枠のある借入から借りる（金利の低い順）。
// 必要額は、最初の不足日から31日間で最も深い不足額。振替は千円単位、借入は1万円単位に切り上げる。
function shortfallRemedies(shortfall,accounts,forecast,loans,today=todayStr(),line=0){
  const start=forecast.findIndex(row=>row.date===shortfall.date);
  const rows=start<0?[]:forecast.slice(start,start+31);
  const needed=Math.max(shortfall.shortage,...rows.map(row=>line-(Number(row[shortfall.account.id])||0)));
  const before=fmt(prevBizDay(addDays(parseISO(shortfall.date),-1)));
  const date=before<today?today:before;
  const amount=Math.ceil(needed/1000)*1000,borrowAmount=Math.ceil(needed/10000)*10000;
  const transfers=accounts.filter(account=>account.id!==shortfall.account.id).map(account=>{
    const future=forecast.filter(row=>row.date>=date).map(row=>Number(row[account.id])||0);
    return {type:'transfer',from:account,amount,date,spare:future.length?Math.min(...future):0};
  }).filter(item=>item.spare-amount>=line).sort((a,b)=>b.spare-a.spare);
  const borrows=(loans||[]).map(loan=>({type:'borrow',loan,amount:borrowAmount,date,available:loanAvailable(loan)}))
    .filter(item=>item.available!==null&&item.available>=borrowAmount)
    .sort((a,b)=>(Number(a.loan.interestRate)||0)-(Number(b.loan.interestRate)||0));
  return {needed,date,options:[...transfers,...borrows]};
}
// 次の給料日（今日より後の最初の給与入金）までに使えるお金。
// 口座ごとに、給料日の前日までの最低残高から注意ラインを引いた額（マイナスは0）を合計する。
function spendableUntilPayday(accounts,txs,forecast,line=0,today=todayStr()){
  const start=addDays(parseISO(today),1);
  const salary=balanceEvents(txs,start,addDays(start,62),null)
    .filter(ev=>ev.amt>0&&ev.tx.type==='income'&&(ev.tx.salary||ev.tx.category==='給与'))
    .sort((a,b)=>a.date-b.date)[0];
  if(!salary)return null;
  const payday=fmt(salary.date);
  const rows=forecast.filter(row=>row.date>=today&&row.date<payday);
  if(!rows.length)return null;
  const perAccount=accounts.map(account=>{
    const lowest=Math.min(...rows.map(row=>Number(row[account.id])||0));
    return {account,lowest,spendable:Math.max(0,Math.floor(lowest-line))};
  });
  const total=perAccount.reduce((sum,item)=>sum+item.spendable,0);
  const days=daysBetween(today,payday);
  return {payday,days,total,perDay:days>0?Math.floor(total/days):total,perAccount};
}
// 金額が毎回変わる引落（カードなど）で、近いのに金額が未確定の回。
// ラベル・カテゴリに「カード」を含むか、過去に金額を確定したことがある定期支出を対象にする。
function unconfirmedVariableBills(txs,days=14,today=todayStr()){
  const start=parseISO(today),end=addDays(start,days);
  const variable=tx=>tx.recurring&&tx.type==='expense'&&!tx.loanPlan&&!tx.loanPayment&&tx.category!==REPAYMENT_CAT&&
    (/カード/.test(`${tx.label||''}${tx.category||''}`)||Object.keys(tx.overrides||{}).some(date=>date<today));
  return txs.filter(variable).flatMap(tx=>expandRec(tx,start,end,null)
    .filter(ev=>tx.overrides?.[fmt(ev.date)]===undefined)
    .map(ev=>({txId:tx.id,label:tx.label,date:fmt(ev.date),amount:Math.abs(ev.amt)})))
    .sort((a,b)=>a.date.localeCompare(b.date));
}

function isDataObject(value){return value!==null&&typeof value==='object'&&!Array.isArray(value);}
function validateBackup(data){

  };

      if(!isDataObject(item[field]))fail(`${label}の移動日が不正です`);

    amount(tx.amount,'取引');date(tx.startDate,'取引開始日');date(tx.endDate,'取引終了日',true);
    if(tx.endDate&&tx.endDate<tx.startDate)fail('取引終了日が開始日より前です');
    if(tx.recurring!==undefined&&typeof tx.recurring!=='boolean')fail('取引の繰り返し設定が不正です');
    if(tx.recurring&&!Object.prototype.hasOwnProperty.call(FREQS,tx.frequency))fail('取引の頻度が不正です');

    if(tx.salary!==undefined){
      if(!isDataObject(tx.salary)||!/^\d{4}-(0[1-9]|1[0-2])$/.test(tx.salary.month||''))fail('給与の対象月が不正です');
      optionalText(tx.salary,['employer','kind'],'給与');

    optionalText(loan,['lender','notes','loanType','repaymentAccountId','repaymentTransactionId','color'],'借入');date(loan.nextPaymentDate,'次回返済日',true);schedule(loan,'借入');
    if(loan.payments!==undefined)list(loan.payments,'返済履歴').forEach(item=>{amount(item.amount,'返済履歴');date(item.paidAt,'返済履歴');date(item.coversDate,'返済対象日',true);optionalText(item,['note','accountId'],'返済履歴');});
    if(loan.borrowings!==undefined)list(loan.borrowings,'借入履歴').forEach(item=>{amount(item.amount,'借入履歴');date(item.date,'借入履歴');date(item.due,'借入の返済日',true);optionalText(item,['accountId','transactionId','settledBy'],'借入履歴');});
    if(loan.creditLimit!==undefined)amount(loan.creditLimit,'利用限度額');
    if(loan.paymentTiers!==undefined){
      if(!Array.isArray(loan.paymentTiers))fail('借入の返済額表が不正です');
      loan.paymentTiers.forEach(tier=>{if(!isDataObject(tier))fail('借入の返済額表が不正です');amount(tier.amount,'借入の返済額表');if(tier.upTo!==null&&tier.upTo!==undefined)amount(tier.upTo,'借入の返済額表');});

    if(loan.adjustBizDay!==undefined&&!['','next','prev'].includes(loan.adjustBizDay))fail('借入の返済日の扱いが不正です');
    if(loan.repaymentMethod!==undefined&&!['monthly','lumpSum'].includes(loan.repaymentMethod))fail('借入の返済方法が不正です');
    for(const field of ['closingDay','paymentDay'])if(loan[field]!==undefined&&(!Number.isInteger(loan[field])||loan[field]<1||loan[field]>31))fail('借入の締め日・支払日が不正です');

  if(!Array.isArray(skipped)||skipped.some(value=>typeof value!=='string'))fail('予定から外した回の形式が不正です');

  return {accounts,transactions,loans,budgets,skipped,preferences:{...DEFAULT_PREFS,...preferences}};
}

function parseCsvRows(text){

      else if(ch==='"'){quoted=false;closed=true;}
      else cell+=ch;
    } else if(ch==='"'){if(cell||closed)throw new Error('CSVの引用符が不正です');quoted=true;}
    else if(ch===','){row.push(cell);cell='';closed=false;}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&src[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';closed=false;}
    else{if(closed)throw new Error('CSVの引用符の後に不要な文字があります');cell+=ch;}
  }
  if(quoted)throw new Error('CSVの引用符が閉じられていません');
  if(cell||row.length||closed){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(v=>String(v).trim()));
}
// YYYY-MM-DD / YYYY/M/D を受け付け、無効なら null。
function csvDate(value){
  const m=String(value||'').trim().match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
  if(!m)return null;
  const ds=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return validTxDate(ds)?ds:null;
}
function transactionsFromCsv(text,accounts){
  const rows=parseCsvRows(text); if(!rows.length) return {items:[],skipped:0};
  const headers=rows[0].map(v=>v.trim());
  if(new Set(headers).size!==headers.length)throw new Error('CSVの列名が重複しています');
  const missing=['名前','種別','口座','金額','開始日'].filter(name=>!headers.includes(name));
  if(missing.length)throw new Error(`CSVに必要な列がありません: ${missing.join('・')}`);
  const idx=name=>headers.indexOf(name);
  const accountsByName=new Map();
  accounts.forEach(account=>{const name=account.name.trim();accountsByName.set(name,[...(accountsByName.get(name)||[]),account]);});
  const findAccount=value=>{const matches=accountsByName.get(String(value||'').trim())||[];return matches.length===1?matches[0]:null;};
  let skipped=0;
  const items=rows.slice(1).map(row=>{
    const typeLabel=(row[idx('種別')]||'').trim();
    const type=typeLabel==='収入'?'income':typeLabel==='振替'?'transfer':'expense';
    const rawAmount=parseJpAmt(row[idx('金額')]);
    const account=findAccount(row[idx('口座')]);
    const toAccount=findAccount(row[idx('振替先口座')]);
    if(row.length!==headers.length||!['収入','支出','振替'].includes(typeLabel)||!row[idx('名前')]?.trim()||!Number.isSafeInteger(rawAmount)||rawAmount===0||(!account&&type!=='transfer')||(type==='transfer'&&(!account||!toAccount||account.id===toAccount.id))){skipped++;return null;}
    const freqLabel=(row[idx('頻度')]||'単発').trim();
    const frequency=Object.entries(FREQS).find(([,label])=>label===freqLabel)?.[0];
    const startDate=csvDate(row[idx('開始日')]);
    const endDate=row[idx('終了日')]?.trim()?csvDate(row[idx('終了日')]):'';
    const adjustLabel=(row[idx('営業日調整')]||'').trim();
    const adjustBizDay=Object.entries(BIZ_ADJUST_LABELS).find(([,label])=>label===adjustLabel)?.[0]||'';
    if((freqLabel!=='単発'&&!frequency)||!startDate||endDate===null||(endDate&&endDate<startDate)||(adjustLabel&&!adjustBizDay)){skipped++;return null;}
    return {id:genId(),label:row[idx('名前')].trim(),type,amount:Math.abs(rawAmount),category:row[idx('カテゴリ')]||guessCategory(row[idx('名前')])||'その他',accountId:type==='transfer'?'':(account?.id||''),fromAccountId:type==='transfer'?account.id:'',toAccountId:type==='transfer'?toAccount.id:'',overrides:{},recurring:freqLabel!=='単発',frequency:frequency||'monthly',startDate,endDate:endDate||null,adjustBizDay};
  }).filter(Boolean);
  return {items,skipped};
}

// モーダルの重なりを管理し、最前面だけがキーボードを受け取る。
const modalDialogStack=[];
let modalBodyOverflow='';
function useModalDialog(open,onClose){
  const dialogRef=useRef(null);
  const closeRef=useRef(onClose);
  closeRef.current=onClose;
  useEffect(()=>{
    const dialog=dialogRef.current;
    if(!open||!dialog)return;
    const previous=document.activeElement;
    const focusable=()=>[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],[tabindex]:not([tabindex="-1"])')].filter(el=>el.tabIndex>=0&&el.getClientRects().length>0);
    if(!modalDialogStack.length){modalBodyOverflow=document.body.style.overflow;document.body.style.overflow='hidden';}
    modalDialogStack.push(dialog);
    dialog.tabIndex=-1;
    if(!dialog.contains(document.activeElement))(dialog.querySelector('[data-dialog-initial-focus]')||focusable()[0]||dialog).focus({preventScroll:true});
    const onKey=e=>{
      if(modalDialogStack.at(-1)!==dialog||e.isComposing)return;
      if(e.key==='Escape'&&closeRef.current){e.preventDefault();e.stopPropagation();closeRef.current();return;}
      if(e.key!=='Tab')return;
      const elements=focusable(),first=elements[0],last=elements.at(-1);
      if(!first){e.preventDefault();dialog.focus();return;}
      if(!dialog.contains(document.activeElement)||document.activeElement===dialog){e.preventDefault();(e.shiftKey?last:first).focus();}
      else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    };
    document.addEventListener('keydown',onKey,true);
    return()=>{
      document.removeEventListener('keydown',onKey,true);
      const wasTop=modalDialogStack.at(-1)===dialog;
      const index=modalDialogStack.indexOf(dialog);
      if(index>=0)modalDialogStack.splice(index,1);
      if(!modalDialogStack.length)document.body.style.overflow=modalBodyOverflow;
      if(wasTop&&previous?.isConnected)previous.focus({preventScroll:true});
    };
  },[open]);
  return dialogRef;
}

// ─── CSV export ────────────────────────────────────────
const BIZ_ADJUST_LABELS={prev:'前営業日',next:'翌営業日'};
function csvCell(value){ return `"${String(value??'').replace(/"/g,'""')}"`; }
// 確定額・日付移動は CSV に含まれない。完全な控えは JSON バックアップを使う。
function downloadTxCsv(txs, accounts){
  const aMap=Object.fromEntries(accounts.map(a=>[a.id,a.name]));
  const header=['名前','種別','カテゴリ','口座','振替先口座','金額','頻度','開始日','終了日','営業日調整'];
  const rows=txs.map(tx=>[
    tx.label||'',
    tx.type==='income'?'収入':tx.type==='transfer'?'振替':'支出',
    tx.category||'',
    aMap[tx.accountId]||aMap[tx.fromAccountId]||'',
    tx.type==='transfer'?(aMap[tx.toAccountId]||''):'',
    tx.type==='income'?tx.amount:-tx.amount,
    tx.recurring?(FREQS[tx.frequency]||tx.frequency):'単発',
    tx.startDate||'',
    tx.endDate||'',
    BIZ_ADJUST_LABELS[tx.adjustBizDay===true?'prev':tx.adjustBizDay]||'',
  ]);
  const csv=[header,...rows].map(r=>r.map(csvCell).join(',')).join('\n');
  downloadBlob(`transactions_${fmt(new Date())}.csv`,'﻿'+csv,'text/csv');
}

// ─── SVG Line Chart ───────────────────────────────────
function SvgChart({ data, accounts, dark, onDateClick, hiddenAccIds, onToggleAcc }){
  const W=700, H=260, PL=72, PR=20, PT=16, PB=40;
  const iW=W-PL-PR, iH=H-PT-PB;
  const gridColor=dark?'#1e293b':'#f1f5f9';
  const axisColor=dark?'#334155':'#e2e8f0';
  const tickColor=dark?'#94a3b8':'#64748b';
  const dotStroke=dark?'#0f172a':'#ffffff';

  if(!data.length) return h('div',{className:'flex items-center justify-center h-48 text-gray-400 dark:text-gray-500 text-sm'},'口座を追加するとグラフが表示されます');

  const keys=['total',...accounts.map(a=>a.id)];
  const colorMap={total:'#6366f1'};
  accounts.forEach(a=>{ colorMap[a.id]=a.color; });
  const nameMap={total:'合計'};
  accounts.forEach(a=>{ nameMap[a.id]=a.name; });

  const allVals=data.flatMap(d=>keys.map(k=>d[k]??0));
  let minV=Math.min(...allVals), maxV=Math.max(...allVals);
  if(minV===maxV){ minV-=10000; maxV+=10000; }
  const pad=(maxV-minV)*0.08;
  const yMin=minV-pad, yMax=maxV+pad;

  function xp(i){ return PL+i/(data.length-1||1)*iW; }
  function yp(v){ return PT+iH-(v-yMin)/(yMax-yMin)*iH; }
  function fmtY(v){ if(Math.abs(v)>=10000000) return (v/10000000).toFixed(1)+'千万'; if(Math.abs(v)>=10000) return Math.round(v/10000)+'万'; return Math.round(v/1000)+'k'; }

  const ticks=[];
  const step=Math.pow(10,Math.floor(Math.log10(Math.max(1,yMax-yMin)/5)));
  const tickStep=Math.ceil((yMax-yMin)/5/step)*step;
  let tv=Math.ceil(yMin/tickStep)*tickStep;
  while(tv<=yMax){ ticks.push(tv); tv+=tickStep; }

  const xTicks=[];
  const xi=Math.max(1,Math.floor(data.length/6));
  data.forEach((d,i)=>{ if(i%xi===0||i===data.length-1) xTicks.push({i,label:d.date.slice(5)}); });

  const [tip,setTip]=useState(null);

  function onMouseMove(e){
    const rect=e.currentTarget.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const ix=Math.round((mx-PL)/iW*(data.length-1));
    if(ix>=0&&ix<data.length) setTip({i:ix,x:xp(ix),d:data[ix]});
  }

  const tipStyle=dark
    ?{background:'#1e293b',border:'1px solid #334155',color:'#e2e8f0'}
    :{background:'#ffffff',border:'1px solid #e2e8f0',color:'#374151'};

  function onSvgClick(e){
    if(!onDateClick) return;
    const rect=e.currentTarget.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const ix=Math.round((mx-PL)/iW*(data.length-1));
    if(ix>=0&&ix<data.length) onDateClick(data[ix].date);
  }

  return h('div',{className:'relative'},
    h('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{fontFamily:'inherit',cursor:onDateClick?'crosshair':undefined},onMouseMove,onMouseLeave:()=>setTip(null),onClick:onSvgClick},
      ticks.map(v=>h('line',{key:v,x1:PL,y1:yp(v),x2:W-PR,y2:yp(v),stroke:gridColor,strokeWidth:1})),
      ticks.map(v=>h('g',{key:'yt'+v},
        h('line',{x1:PL-4,y1:yp(v),x2:PL,y2:yp(v),stroke:axisColor,strokeWidth:1}),
        h('text',{x:PL-6,y:yp(v)+4,textAnchor:'end',fontSize:10,fill:tickColor},fmtY(v))
      )),
      xTicks.map(({i,label})=>h('g',{key:'xt'+i},
        h('line',{x1:xp(i),y1:PT+iH,x2:xp(i),y2:PT+iH+4,stroke:axisColor,strokeWidth:1}),
        h('text',{x:xp(i),y:PT+iH+16,textAnchor:'middle',fontSize:10,fill:tickColor},label)
      )),
      h('line',{x1:PL,y1:PT,x2:PL,y2:PT+iH,stroke:axisColor,strokeWidth:1}),
      h('line',{x1:PL,y1:PT+iH,x2:W-PR,y2:PT+iH,stroke:axisColor,strokeWidth:1}),
      [...accounts.map(a=>a.id),'total'].filter(k=>k==='total'||!hiddenAccIds||!hiddenAccIds.has(k)).map(k=>{
        const pts=data.map((d,i)=>`${xp(i)},${yp(d[k]??0)}`).join(' ');
        return h('polyline',{key:k,points:pts,fill:'none',stroke:colorMap[k],strokeWidth:k==='total'?2.5:1.5,strokeDasharray:k==='total'?undefined:'5,3',opacity:0.9});
      }),
      tip && h('line',{x1:tip.x,y1:PT,x2:tip.x,y2:PT+iH,stroke:dark?'#475569':'#94a3b8',strokeWidth:1,strokeDasharray:'3,2'}),
      tip && keys.filter(k=>k==='total'||!hiddenAccIds||!hiddenAccIds.has(k)).map(k=>h('circle',{key:k,cx:tip.x,cy:yp(tip.d[k]??0),r:4,fill:colorMap[k],stroke:dotStroke,strokeWidth:1.5}))
    ),
    tip && h('div',{
      className:'absolute rounded-lg shadow-lg p-2.5 text-xs pointer-events-none z-10',
      style:{top:'4px',left:Math.min(tip.x/W*100,65)+'%',...tipStyle}
    },
      h('p',{className:'font-semibold mb-1.5'},(()=>{const [y,m,d]=tip.d.date.split('-');const dt=new Date(Number(y),Number(m)-1,Number(d));return `${y}/${m}/${d}(${DOW[dt.getDay()]})`;})()),
      keys.filter(k=>k==='total'||!hiddenAccIds||!hiddenAccIds.has(k)).map(k=>{const v=tip.d[k]??0;return h('p',{key:k,className:'leading-5',style:{color:colorMap[k]}},`${nameMap[k]}: ${v<0?'-':''}¥${Math.abs(v).toLocaleString()}`)}),
      onDateClick&&h('p',{className:'mt-1.5 text-blue-400 text-[10px] font-medium'},'クリックして取引を追加')
    ),
    h('div',{className:'flex flex-wrap gap-3 mt-2 pl-16'},
      keys.map(k=>{
        const hidden=k!=='total'&&hiddenAccIds&&hiddenAccIds.has(k);
        return h('span',{key:k,
          className:`flex items-center gap-1.5 text-xs text-gray-500 dark:text-gray-400 transition-opacity select-none ${k!=='total'&&onToggleAcc?'cursor-pointer hover:opacity-70':''} ${hidden?'opacity-30 line-through':''}`,
          onClick:k!=='total'&&onToggleAcc?()=>onToggleAcc(k):undefined,
          title:k!=='total'&&onToggleAcc?(hidden?'クリックして表示':'クリックして非表示'):undefined
        },
          h('span',{className:'inline-block w-5',style:{height:'2px',backgroundColor:colorMap[k],borderRadius:'1px'}}),
          nameMap[k]
        );
      })
    )
  );
}

// ─── Amount parser (Japanese shorthand) ───────────────
function parseJpAmt(s){
  if(!s&&s!==0) return null;
  s=String(s).trim().replace(/,/g,'').replace(/[¥￥]/g,'');
  if(/^-?\d+$/.test(s)) return parseInt(s,10);
  if(/^-?\d+\.\d+$/.test(s)) return Math.round(parseFloat(s));
  const mMan=s.match(/^(\d+\.?\d*)\s*万\s*(\d+\.?\d*)?\s*千?$/);
  if(mMan){ return Math.round(parseFloat(mMan[1])*10000+(mMan[2]?parseFloat(mMan[2])*1000:0)); }
  const mSen=s.match(/^(\d+\.?\d*)\s*千$/);
  if(mSen) return Math.round(parseFloat(mSen[1])*1000);
  return null;
}

// 残高欄の入力を読む。「-50000」「+3万」のように符号から始めると今の残高からの増減、
// 「320000-50000」のような足し引きもできる。全角や「円」「,」も受け付ける。
function parseBalanceInput(text,current){
  const s=String(text??'').normalize('NFKC').replace(/[ー−–—]/g,'-').replace(/[,\s¥円]/g,'');
  if(!s)return null;
  const terms=s.match(/[+-]?[^+-]+/g);
  if(!terms||terms.join('')!==s)return null;
  let total=0;
  for(const term of terms){
    const amount=parseJpAmt(term.replace(/^[+-]/,''));
    if(amount===null)return null;
    total+=term[0]==='-'?-amount:amount;
  }
  const relative=/^[+-]/.test(s);
  const value=relative?Math.round(Number(current)||0)+total:total;
  return Number.isSafeInteger(value)?{value,relative}:null;
}

function salaryTransactionFromDraft(draft,existing){
  const gross=parseJpAmt(draft.gross);
  const detailed=['socialInsurance','incomeTax','residentTax','otherDeductions'].some(key=>draft[key]!==undefined);
  const socialInsurance=detailed?parseJpAmt(draft.socialInsurance??'0'):0;
  const incomeTax=detailed?parseJpAmt(draft.incomeTax??'0'):0;
  const residentTax=detailed?parseJpAmt(draft.residentTax??'0'):0;
  const otherDeductions=parseJpAmt(detailed?draft.otherDeductions??'0':draft.deductions);
  const parts=[['社保',socialInsurance],['源泉所得税',incomeTax],['住民税',residentTax],['その他控除',otherDeductions]];
  const kind=draft.kind||'monthly';
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(draft.month||'')) return {error:'対象月を選択してください'};
  if(!validTxDate(draft.payDate)) return {error:'有効な支給日を入力してください'};
  if(!['monthly','summerBonus','winterBonus'].includes(kind)) return {error:'給与の区分を選択してください'};
  if(!Number.isSafeInteger(gross)||gross<=0) return {error:'額面を入力してください'};
  for(const [label,value] of parts){if(!Number.isSafeInteger(value)||value<0)return {error:`${label}は0円以上で入力してください`};}
  const deductions=parts.reduce((sum,[,value])=>sum+value,0);
  if(!Number.isSafeInteger(deductions)) return {error:'控除額を確認してください'};
  if(deductions>=gross) return {error:'控除額は額面より少なくしてください'};
  if(!draft.accountId) return {error:'入金口座を選択してください'};
  const employer=(draft.employer||'').trim();
  const name=kind==='summerBonus'?'夏季賞与':kind==='winterBonus'?'冬季賞与':'給与';
  const paySchedule=kind==='monthly'?salaryPaySchedule({startDate:draft.payDate,salary:{month:draft.month,payDate:draft.payDate,paySchedule:draft.paySchedule}}):null;
  return {transaction:{
    ...(existing||{}),id:existing?.id||genId(),type:'income',category:'給与',
    label:employer?`${name}（${employer}）`:name,amount:gross-deductions,
    accountId:draft.accountId,startDate:fmt(prevBizDay(parseISO(draft.payDate))),recurring:false,
    salary:{month:draft.month,kind,employer,gross,socialInsurance,incomeTax,residentTax,otherDeductions,deductions,
      payDate:draft.payDate,...(paySchedule?{paySchedule}:{})}
  }};
}

function salaryBreakdown(tx){
  const salary=tx.salary||{};
  const socialInsurance=Number(salary.socialInsurance||0);
  const incomeTax=Number(salary.incomeTax||0);
  const residentTax=Number(salary.residentTax||0);
  const otherDeductions=salary.otherDeductions!==undefined?Number(salary.otherDeductions||0):
    Math.max(0,Number(salary.deductions||0)-socialInsurance-incomeTax-residentTax);
  return {gross:Number(salary.gross||0),socialInsurance,incomeTax,residentTax,otherDeductions,
    deductions:Number(salary.deductions||0),net:Number(tx.amount||0)};
}

function previousSalaryMonth(month){
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month||''))return '';
  return fmt(addMonths(parseISO(`${month}-01`),-1)).slice(0,7);
}

function salaryDefaultScheduledPayDate(month,kind){
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month||'')||!['monthly','summerBonus','winterBonus'].includes(kind))return '';
  const [year,number]=month.split('-').map(Number);
  const date=kind==='monthly'?new Date(year,number,0):new Date(year,number-1,15);
  return fmt(date);
}

function salaryDefaultPayDate(month,kind){
  const scheduled=salaryDefaultScheduledPayDate(month,kind);
  return scheduled?fmt(prevBizDay(parseISO(scheduled))):'';
}

// 指定日を保持し、休日の繰上げや2月の月末調整が次月の支給日に影響しないようにする。
function salaryScheduledPayDate(month,schedule){
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month||'')||!schedule||
    !Number.isInteger(schedule.day)||schedule.day<1||schedule.day>31||!Number.isSafeInteger(schedule.monthOffset))return '';
  const [year,number]=month.split('-').map(Number);
  const date=new Date(year,number-1+schedule.monthOffset,1);
  const last=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();
  date.setDate(schedule.monthEnd?last:Math.min(schedule.day,last));
  const result=fmt(date);
  return validTxDate(result)?result:'';
}

function salaryPaySchedule(tx){
  const salary=tx?.salary;
  const specified=validTxDate(salary?.payDate)?salary.payDate:tx?.startDate;
  if(!salary||!/^\d{4}-(0[1-9]|1[0-2])$/.test(salary.month||'')||!validTxDate(specified))return null;
  if(salaryScheduledPayDate(salary.month,salary.paySchedule)===specified)return {...salary.paySchedule};
  const [year,month,day]=specified.split('-').map(Number);
  const monthOffset=(year-Number(salary.month.slice(0,4)))*12+month-Number(salary.month.slice(5));
  const monthEnd=day===new Date(year,month,0).getDate()||
    (!salary.payDate&&specified===salaryDefaultPayDate(salary.month,'monthly'));
  return {day,monthOffset,monthEnd};
}

function salaryDraftFromSource(tx,targetMonth){
  if(!tx?.salary||!/^\d{4}-(0[1-9]|1[0-2])$/.test(targetMonth||''))return null;
  const part=salaryBreakdown(tx);
  const paySchedule=salaryPaySchedule(tx);
  const payDate=salaryScheduledPayDate(targetMonth,paySchedule);
  if(!payDate)return null;
  return {month:targetMonth,payDate,paySchedule,kind:'monthly',
    employer:tx.salary.employer||'',gross:String(part.gross),socialInsurance:String(part.socialInsurance),
    incomeTax:String(part.incomeTax),residentTax:String(part.residentTax),
    otherDeductions:String(part.otherDeductions),accountId:tx.accountId||''};
}

function salaryDraftFromPrevious(tx,targetMonth){
  const previousMonth=previousSalaryMonth(targetMonth);
  if(!previousMonth||!tx?.salary||(tx.salary.kind&&tx.salary.kind!=='monthly')||tx.salary.month!==previousMonth||!validTxDate(tx.startDate))return null;
  return salaryDraftFromSource(tx,targetMonth);
}

// 定期取引の1か月あたりの額（毎週は年52回、毎日は年365日で換算）。
function monthlyEquivalent(tx){
  const amount=Number(tx.amount)||0;
  if(tx.frequency==='daily')return amount*365/12;
  if(tx.frequency==='weekly')return amount*52/12;
  if(tx.frequency==='yearly')return amount/12;
  return amount;
}
// 終了日が過ぎていない定期取引。
function activeRecurring(tx,today=todayD()){
  return !!tx.recurring&&(!tx.endDate||!isBefore(sod(parseISO(tx.endDate)),today));
}
// 定期の収入・支出（月あたり）。返済は支出に含め、内訳として repayment も返す。
function recurringMonthly(txs){
  const result={income:0,expense:0,repayment:0};
  txs.filter(tx=>activeRecurring(tx)&&tx.type!=='transfer').forEach(tx=>{
    const amount=Math.round(monthlyEquivalent(tx));
    if(tx.type==='income'){result.income+=amount;return;}
    result.expense+=amount;
    if(tx.loanPlan||tx.category===REPAYMENT_CAT)result.repayment+=amount;
  });
  return result;
}
function monthlyRunRate(txs,currentMonth){
  const {income:recurringIncome,expense:exp}=recurringMonthly(txs);
  const latestByEmployer=new Map();
  txs.filter(tx=>tx.type==='income'&&tx.salary&&(!tx.salary.kind||tx.salary.kind==='monthly')&&
    /^\d{4}-(0[1-9]|1[0-2])$/.test(tx.salary.month||'')&&tx.salary.month<=currentMonth)
    .forEach(tx=>{
      const employer=(tx.salary.employer||'').trim();
      const previous=latestByEmployer.get(employer);
      if(!previous||previous.month<tx.salary.month)latestByEmployer.set(employer,{month:tx.salary.month,amount:Number(tx.amount)||0});
      else if(previous.month===tx.salary.month)previous.amount+=Number(tx.amount)||0;
    });
  const salary=[...latestByEmployer.values()].reduce((total,item)=>total+item.amount,0);
  const salaryMonths=[...new Set([...latestByEmployer.values()].map(item=>item.month))].sort();
  return {inc:recurringIncome+salary,exp,salary,salaryMonths};
}

function salaryBulkCopyPlan(records,source,startMonth,endMonth){
  if(!source?.salary||source.salary.kind&&source.salary.kind!=='monthly')return {error:'月給の明細をコピー元に選んでください',rows:[]};
  if(!salaryPaySchedule(source))return {error:'コピー元の対象月と支給日を確認してください',rows:[]};
  const validMonth=value=>/^\d{4}-(0[1-9]|1[0-2])$/.test(value||'');
  if(!validMonth(startMonth)||!validMonth(endMonth))return {error:'開始月と終了月を選択してください',rows:[]};
  const monthIndex=value=>Number(value.slice(0,4))*12+Number(value.slice(5))-1;
  const start=monthIndex(startMonth),end=monthIndex(endMonth);
  if(end<start)return {error:'終了月は開始月以降にしてください',rows:[]};
  if(end-start>=24)return {error:'一度にコピーできるのは24か月までです',rows:[]};
  const employer=(source.salary.employer||'').trim();
  const existing=new Set(records.filter(tx=>tx.type==='income'&&tx.salary&&(!tx.salary.kind||tx.salary.kind==='monthly')&&(tx.salary.employer||'').trim()===employer).map(tx=>tx.salary.month));
  const rows=[];
  for(let index=start;index<=end;index++){
    const month=`${String(Math.floor(index/12)).padStart(4,'0')}-${String(index%12+1).padStart(2,'0')}`;
    rows.push({month,payDate:salaryPayDateLike(source,month),status:month===source.salary.month?'コピー元':existing.has(month)?'登録済み':'作成'});
  }
  return {error:'',rows};
}

// ─── 自動処理（アプリを開いたときに実行） ───────────────
const AUTO_LOAN_LOOKBACK_DAYS=31;
// 返済日を過ぎた定期返済を返済履歴に記録し、借入残高を減らす。
// 口座残高は、入力した残高にまだ含まれていない回（残高の入力日以降）だけ差し引く。
// 近い日付に手動の返済記録がある回は二重計上を避けるため記録しない。
function autoLoanPayments(loans,txs,accounts,today=todayStr()){
  let nextLoans=loans,nextAccounts=accounts;
  const records=[];
  const todayDate=parseISO(today);
  const reflect=(live,payment,accountId,date)=>{
    const account=nextAccounts.find(item=>item.id===accountId);
    const reflected=!!account&&!eventIncludedInBalance({date:parseISO(date),tx:{}},balanceAnchor(account));
    if(reflected)nextAccounts=reflectLoanPayment(nextAccounts,live,payment,account.id);
    return reflected;
  };
  for(const loan of loans){
    if(!(Number(loan.balance)>0))continue;
    if(loan.repaymentMethod==='lumpSum'){
      for(const due of lumpSumDues(loan).filter(item=>item.date<today&&item.date>=fmt(addDays(todayDate,-AUTO_LOAN_LOOKBACK_DAYS)))){
        const live=nextLoans.find(item=>item.id===loan.id),id=`auto-${due.date}`;
        if((live.payments||[]).some(item=>item.id===id||item.coversDate===due.date))continue;
        const principal=Math.min(due.principal,Number(live.balance)||0);
        const payment={id,amount:principal+due.interest,principal,interest:due.interest,paidAt:due.date,note:'自動記録（一括返済）',coversDate:due.date,auto:true};
        nextLoans=nextLoans.map(item=>item.id===loan.id?{...item,balance:(Number(item.balance)||0)-principal,payments:[...(item.payments||[]),payment],
          borrowings:(item.borrowings||[]).map(entry=>due.ids.includes(entry.id)?{...entry,settled:true,settledBy:id}:entry)}:item);
        const reflected=loan.repaymentAccountId?reflect(live,payment,loan.repaymentAccountId,due.date):false;
        records.push({loanName:loan.name,date:due.date,amount:payment.amount,reflected});
      }
      continue;
    }
    const schedule=withLoanRepaymentPlans(txs,nextLoans,nextAccounts).find(item=>item.loanPlan?item.loanId===loan.id:(!item.loanPayment&&item.recurring&&item.id===loan.repaymentTransactionId));
    if(!schedule)continue;
    for(const event of expandRec(schedule,addDays(todayDate,-AUTO_LOAN_LOOKBACK_DAYS),addDays(todayDate,-1),null)){
      const date=fmt(event.date),id=`auto-${date}`;
      const live=nextLoans.find(item=>item.id===loan.id);
      const balance=Number(live.balance)||0;
      if(!(balance>0))break;
      const nearManual=(live.payments||[]).some(item=>item.id===id||item.coversDate===date||
        (validTxDate(item.paidAt)&&Math.abs(parseISO(item.paidAt)-event.date)<=7*86400000));
      if(nearManual)continue;
      // 金利があれば、返済額のうち日割り利息を先に払い、残りで元金を減らす。
      const {interest,principal}=splitLoanPayment(live,Math.round(Math.abs(event.amt)),date);
      const amount=principal+interest;
      if(!(amount>0))continue;
      const payment={id,amount,principal,interest,paidAt:date,note:'自動記録',coversDate:date,auto:true};
      nextLoans=nextLoans.map(item=>item.id===loan.id?{...item,balance:balance-principal,payments:[...(item.payments||[]),payment]}:item);
      const reflected=reflect(live,payment,schedule.accountId,date);
      records.push({loanName:loan.name,date,amount,reflected});
    }
  }
  return {loans:nextLoans,accounts:nextAccounts,records};
}
// コピー元の指定日・月末払い・翌月払いを引き継ぎ、土日祝なら前営業日にする。
function salaryPayDateLike(source,month){
  const specified=salaryScheduledPayDate(month,salaryPaySchedule(source));
  return specified?fmt(prevBizDay(parseISO(specified))):'';
}
// 勤務先ごとに最新の月給と同じ内容で、来月分までの月給を「仮」で用意する。
// 3か月以上登録のない勤務先は対象外。削除した仮の月給（dismissed）は作り直さない。
function autoSalaryEstimates(txs,today=todayStr(),dismissed=[]){
  const shift=(month,n)=>fmt(addMonths(parseISO(`${month}-01`),n)).slice(0,7);
  const currentMonth=today.slice(0,7),lastMonth=shift(currentMonth,1),oldest=shift(currentMonth,-2);
  const latest=new Map();
  txs.filter(tx=>tx.type==='income'&&tx.salary&&!tx.salary.estimated&&(!tx.salary.kind||tx.salary.kind==='monthly')&&
    /^\d{4}-(0[1-9]|1[0-2])$/.test(tx.salary.month||'')&&tx.salary.month<=currentMonth&&validTxDate(tx.startDate))
    .forEach(tx=>{
      const employer=(tx.salary.employer||'').trim(),previous=latest.get(employer);
      if(!previous||previous.salary.month<tx.salary.month)latest.set(employer,tx);
    });
  const skip=new Set(dismissed),ids=new Set(txs.map(tx=>tx.id)),created=[];
  const registered=new Set(txs.filter(tx=>tx.type==='income'&&tx.salary&&(!tx.salary.kind||tx.salary.kind==='monthly'))
    .map(tx=>`${(tx.salary.employer||'').trim()}|${tx.salary.month}`));
  latest.forEach((source,employer)=>{
    if(source.salary.month<oldest)return;
    for(let month=shift(source.salary.month,1);month<=lastMonth;month=shift(month,1)){
      const id=`salary-auto:${employer}:${month}`;
      if(skip.has(`${employer}|${month}`)||ids.has(id)||registered.has(`${employer}|${month}`))continue;
      const draft=salaryDraftFromSource(source,month);
      if(!draft)continue;
      const result=salaryTransactionFromDraft(draft);
      if(result.error)continue;
      created.push({...result.transaction,id,salary:{...result.transaction.salary,estimated:true}});
    }
  });
  return created;
}

function salaryYearTotals(records,year){
  return records.filter(tx=>tx.salary?.month?.startsWith(`${year}-`)).reduce((sum,tx)=>{
    const part=salaryBreakdown(tx);
    Object.keys(sum).forEach(key=>sum[key]+=part[key]);
    return sum;
  },{gross:0,socialInsurance:0,incomeTax:0,residentTax:0,otherDeductions:0,deductions:0,net:0});
}

// 年間合計の内訳: 月給と賞与、支給済み（今日まで）と予定に分ける。
function salaryYearSummary(records,year,today=todayStr()){
  const inYear=records.filter(tx=>tx.salary?.month?.startsWith(`${year}-`));
  const isBonus=tx=>tx.salary.kind==='summerBonus'||tx.salary.kind==='winterBonus';
  return {
    ...salaryYearTotals(inYear,year),
    count:inYear.length,
    monthly:salaryYearTotals(inYear.filter(tx=>!isBonus(tx)),year),
    bonus:salaryYearTotals(inYear.filter(isBonus),year),
    paid:salaryYearTotals(inYear.filter(tx=>tx.startDate<=today),year),
    scheduled:salaryYearTotals(inYear.filter(tx=>tx.startDate>today),year)
  };
}

    // 令和8・9年分の給与収入69万1千円以上220万円未満の特例（給与所得の金額）
    salarySpecial:[[691000,741000,()=>0],[741000,2191000,g=>g-740000],[2191000,2193000,()=>1451000],[2193000,2196000,()=>1453000],[2196000,2200000,()=>1456000]],
    basic:[[4890000,1040000],[6550000,670000],[23500000,620000],...NENCHO_BASIC_TAIL]}
};
NENCHO_RULES[2027]={...NENCHO_RULES[2026],label:'令和9年分',note:'令和8年分と同じ（基礎控除・給与所得控除の特例は令和8・9年分）'};
const NENCHO_SOURCES=[
  ['国税庁 No.1199 基礎控除','https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1199.htm'],
  ['国税庁 No.1410 給与所得控除','https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1410.htm']
];
// 対象年の税制。未登録の年は登録済みの最新年分で概算し、その旨を返す。
function nenchoRulesFor(year){
  if(NENCHO_RULES[year])return {rules:NENCHO_RULES[year],year,fallback:false};
  const known=Object.keys(NENCHO_RULES).map(Number).sort((a,b)=>a-b);
  const use=known.filter(y=>y<=year).at(-1)??known[0];
  return {rules:NENCHO_RULES[use],year:use,fallback:true};
}
// 給与所得の金額（年末調整等のための給与所得控除後の給与等の金額の表に相当）
function nenchoSalaryIncome(gross,rules){
  const g=Math.max(0,Math.floor(Number(gross)||0));
  const special=(rules.salarySpecial||[]).find(([from,to])=>g>=from&&g<to);
  if(special)return special[2](g);
  if(g<rules.salaryMin.limit)return Math.max(0,g-rules.salaryMin.deduction);
  if(g<6600000){const a=Math.floor(g/4000)*4000;return a<3600000?a*0.7-80000:a*0.8-440000;}
  if(g<8500000)return Math.floor(g*0.9-1100000);
  return g-1950000;
}
function nenchoBasicDeduction(totalIncome,rules){
  return rules.basic.find(([limit])=>totalIncome<=limit)[1];
}
// 所得税の速算表（課税所得は1,000円未満切捨て済み）
function nenchoIncomeTax(taxable){
  const t=[[1950000,0.05,0],[3300000,0.10,97500],[6950000,0.20,427500],[9000000,0.23,636000],[18000000,0.33,1536000],[40000000,0.40,2796000],[Infinity,0.45,4796000]];
  const [,rate,minus]=t.find(([limit])=>taxable<=limit);
  return Math.max(0,Math.floor(taxable*rate-minus));
}
// 生命保険料控除（新契約）: 区分ごとに最高4万円、合計最高12万円
function nenchoLifeInsurance(premium){
  const p=Math.max(0,Number(premium)||0);
  if(p<=20000)return p;
  if(p<=40000)return Math.floor(p/2+10000);
  if(p<=80000)return Math.floor(p/4+20000);
  return 40000;
}
function nenchoSpouseDeduction(kind,totalIncome,specialAmount){
  if(kind==='special')return Math.max(0,Math.min(380000,Math.floor(Number(specialAmount)||0)));
  if(kind!=='spouse'&&kind!=='spouseElderly')return 0;
  const elderly=kind==='spouseElderly';
  if(totalIncome<=9000000)return elderly?480000:380000;
  if(totalIncome<=9500000)return elderly?320000:260000;
  if(totalIncome<=10000000)return elderly?160000:130000;
  return 0;
}
// 簡易年末調整。給与以外の所得がなく、年末調整で通常申告する控除だけを対象にした概算。
function estimateYearEndAdjustment({year,gross,socialInsurance,withheld,inputs={}}){
  const {rules,year:rulesYear,fallback}=nenchoRulesFor(year);
  const num=key=>Math.max(0,Math.floor(Number(inputs[key])||0));
  const salaryGross=Math.max(0,Math.floor(Number(gross)||0)-num('nonTaxable'));
  const salaryIncome=nenchoSalaryIncome(salaryGross,rules);
  const deductions={
    social:Math.max(0,Math.floor(Number(socialInsurance)||0))+num('extraSocial'),
    ideco:num('ideco'),
    life:Math.min(120000,nenchoLifeInsurance(inputs.lifeGeneral)+nenchoLifeInsurance(inputs.lifeMedical)+nenchoLifeInsurance(inputs.lifePension)),
    earthquake:Math.min(50000,num('earthquake')),
    spouse:nenchoSpouseDeduction(inputs.spouse,salaryIncome,inputs.spouseSpecial),
    dependents:num('dependentsGeneral')*380000+num('dependentsSpecific')*630000+num('dependentsElderly')*480000+num('dependentsElderlyLiving')*580000,
    basic:nenchoBasicDeduction(salaryIncome,rules)
  };
  const totalDeductions=Object.values(deductions).reduce((sum,v)=>sum+v,0);
  const taxable=Math.max(0,Math.floor((salaryIncome-totalDeductions)/1000)*1000);
  const computedTax=nenchoIncomeTax(taxable);
  const afterCredit=Math.max(0,computedTax-num('housingCredit'));
  const annualTax=Math.floor(afterCredit*1.021/100)*100; // 復興特別所得税込み、100円未満切捨て
  const paid=Math.max(0,Math.floor(Number(withheld)||0));
  return {year,rulesYear,rulesLabel:rules.label,rulesNote:rules.note||'',fallback,salaryGross,salaryIncome,deductions,totalDeductions,taxable,computedTax,annualTax,withheld:paid,refund:paid-annualTax};
}

function salaryAnnualRows(records,year){
  const rows=[...Array.from({length:12},(_,i)=>({key:`monthly-${String(i+1).padStart(2,'0')}`,label:`${i+1}月`,items:[]})),
    {key:'summerBonus',label:'夏季賞与',items:[]},{key:'winterBonus',label:'冬季賞与',items:[]}];
  records.filter(tx=>tx.salary?.month?.startsWith(`${year}-`)).forEach(tx=>{
    const kind=tx.salary.kind||'monthly';
    const key=kind==='monthly'?`monthly-${tx.salary.month.slice(5)}`:kind;
    const row=rows.find(item=>item.key===key);
    if(row)row.items.push(tx);
  });
  return rows.map(row=>({...row,...salaryYearTotals(row.items,year)}));
}

function setOccurrenceAmount(tx,date,amount){
  const overrides={...(tx.overrides||{})};
  if(amount===null) delete overrides[date];
  else overrides[date]=amount;
  return {...tx,overrides};
}

// 定期取引の1回だけ、金額（amount）と日付（toDate）を変える。ほかの回はそのまま。
// 金額は元の日付に確定額として付けてから移動するので、移動先へ引き継がれる。
function editOccurrence(tx,date,{amount,toDate},skippedKeys=new Set(),today=todayStr()){
  if(!tx||!tx.recurring)return {error:'定期取引が見つかりません'};
  let next=tx;
  if(amount!==undefined&&amount!==null){
    if(!Number.isSafeInteger(amount)||amount<=0)return {error:'1円以上の金額を入力してください'};
    const current=tx.overrides?.[date]!==undefined?tx.overrides[date]:tx.amount;
    if(amount!==Number(current))next=setOccurrenceAmount(next,date,amount===Number(tx.amount)?null:amount);
  }
  if(toDate&&toDate!==date){
    const moved=moveScheduledTransaction(next,date,toDate,today,skippedKeys);
    if(moved.error)return {error:moved.error};
    next=moved.transaction;
  }
  return {transaction:next};
}

function occurrencesInMonth(tx,month){
  if(!tx.startDate||!/^\d{4}-\d{2}$/.test(month)) return [];
  const start=sod(parseISO(`${month}-01`));
  const end=sod(new Date(start.getFullYear(),start.getMonth()+1,0));
  return expandRec(tx,addDays(start,-7),addDays(end,7),new Set())
    .filter(event=>!isBefore(event.date,start)&&!isAfter(event.date,end))
    .map(event=>fmt(event.date));
}

function SalaryManager({accounts,txs,onChange,onDelete,addToast,prefs,onPrefs}){

  useEffect(()=>{
    if(!form||editId)return;

    };

  },[form,editId]);
  useEffect(()=>{

  },[bulkCopy?.sourceId]);
  function add(kind='monthly'){

    if(!candidates.length){setError(`${prev||'前月'}の月給がありません。先に前月の給与を登録してください。`);return;}

function TxManager({ accounts, txs, onChange, onDelete, addToast, salaryMonthly=0, repaymentMonthly=0 }){
  const DEF={label:'',type:'expense',amount:'',category:'その他',accountId:'',fromAccountId:'',toAccountId:'',overrides:{},recurring:false,frequency:'monthly',startDate:todayStr(),endDate:'',adjustBizDay:''};

  const [showForm,setShowForm]=useState(false);
  const [err,setErr]=useState('');

  const [overrideMonth,setOverrideMonth]=useState(todayStr().slice(0,7));
  const [searchText,setSearchText]=useState('');
  const [filterType,setFilterType]=useState('all');
  const [filterRecurring,setFilterRecurring]=useState('all');
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const editingTx=editId?txs.find(tx=>tx.id===editId):null;
  useEffect(()=>{if(!showForm)return;const fn=e=>{if(e.key==='Escape')cancel();};document.addEventListener('keydown',fn);return()=>document.removeEventListener('keydown',fn);},[showForm]);

  function handleLabelChange(val){
    setForm(f=>({...f,label:val,category:editId?f.category:autoCategoryFor(f,val)}));
    if(val.trim()){
      const seen=new Set();
      const matches=txs.filter(tx=>{
        if(!tx.label.toLowerCase().includes(val.toLowerCase())||seen.has(tx.label)) return false;
        seen.add(tx.label); return true;
      }).slice(0,6);
      setSugs(matches); setShowSugs(matches.length>0);
    } else { setShowSugs(false); }
  }
  function selectSug(tx){
    setForm(f=>({...f,label:tx.label,type:tx.type,amount:String(tx.amount),
      accountId:tx.accountId||'',fromAccountId:tx.fromAccountId||'',toAccountId:tx.toAccountId||'',
      recurring:tx.recurring,frequency:tx.frequency||'monthly',
      adjustBizDay:tx.adjustBizDay===true?'prev':(tx.adjustBizDay||''),
      category:tx.category||'その他'}));
    setShowSugs(false);
  }

  function getOccurrences(f,maxN){
    if(!f.startDate) return [];
    const today2=todayD();
    const cap=addMonths(today2,24);
    const max=maxN||(f.frequency==='daily'?31:f.frequency==='weekly'?16:f.frequency==='yearly'?5:13);
    return expandRec(f,today2,cap,new Set()).slice(0,max).map(event=>fmt(event.date));
  }

  function submit(e){
    e.preventDefault();
    if(form.type!=='transfer'&&!form.label.trim()){setErr('名前を入力してください');return;}
    const parsedAmt=parseJpAmt(form.amount);
    if(!parsedAmt||parsedAmt<=0){setErr('金額を入力してください');return;}
    if(form.type==='transfer'){
      if(!form.fromAccountId||!form.toAccountId){setErr('振替元・振替先の口座を選択してください');return;}
      if(form.fromAccountId===form.toAccountId){setErr('振替元と振替先は別の口座を選択してください');return;}
    } else {
      if(!form.accountId){setErr('口座を選択してください');return;}
    }
    if(!validTxDate(form.startDate)){setErr('有効な日付を入力してください');return;}
    if(form.recurring&&form.endDate&&(!validTxDate(form.endDate)||form.endDate<form.startDate)){setErr('終了日は開始日以降にしてください');return;}
    setErr('');
    const original=editId?txs.find(t=>t.id===editId):null;
    const tx={...(original||{}),...form,label:form.type==='transfer'?(original?.type==='transfer'?original.label:'資金振替'):form.label.trim(),amount:parsedAmt,endDate:form.endDate||null};
    if(editId){
      onChange(current=>current.map(t=>t.id===editId?{...tx,id:editId}:t));
      setEditId(null);
      addToast&&addToast('取引を更新しました');
    } else {
      onChange(current=>[...current,{...tx,id:genId()}]);
      addToast&&addToast('取引を追加しました');
    }
    setForm({...DEF,accountId:form.accountId});
    setShowForm(false);
  }

    if(!confirmTarget) return;

  const dateCls='border border-gray-300 dark:border-gray-600 rounded-lg px-2 py-1.5 text-sm flex-1 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-indigo-400';

  const accMap2=Object.fromEntries(accounts.map(a=>[a.id,a]));

    return txs.filter(tx=>{
      if(filterType!=='all'&&tx.type!==filterType) return false;

      if(filterRecurring==='single'&&tx.recurring) return false;

      return true;

    });
    const upcoming=active.map(tx=>({tx,date:getOccurrences(tx,1)[0]||''})).filter(item=>item.date).sort((a,b)=>a.date.localeCompare(b.date));
    return {
      count:active.length,
      income:active.filter(tx=>tx.type==='income').reduce((sum,tx)=>sum+monthlyEquivalent(tx),0),

        h('div',{className:'flex items-center justify-between px-5 py-4 border-b border-gray-100 dark:border-gray-800 flex-shrink-0'},

// ─── Balance Table ────────────────────────────────────
function buildBalanceTablePeriods(cols, fData, txEventMap){
  const entries=Object.entries(txEventMap||{}).sort(([a],[b])=>a.localeCompare(b));
  let eventIndex=0;
  return cols.map((col,ci)=>{
    const startDate=ci===0?fData[0].date:fmt(addDays(parseISO(cols[ci-1].date),1));
    const eventsByAccount={};
    while(eventIndex<entries.length&&entries[eventIndex][0]<=col.date){
      const [date,accountEvents]=entries[eventIndex++];
      if(date<startDate) continue;
      Object.entries(accountEvents).forEach(([accountId,events])=>{
        if(!eventsByAccount[accountId]) eventsByAccount[accountId]=[];
        eventsByAccount[accountId].push(...events.map(event=>({...event,date})));
      });
    }
    return {startDate,eventsByAccount};
  });
}

function balanceChangeDays(fData, visibleAccounts, txEventMap){
  if(fData.length<3) return fData;
  const visibleIds=new Set(visibleAccounts.map(a=>String(a.id)));
  return fData.filter((col,i)=>{
    if(i===0||i===fData.length-1||col.date===todayStr()) return true;
    if(visibleAccounts.some(a=>(col[a.id]??0)!==(fData[i-1][a.id]??0))) return true;
    return Object.entries(txEventMap?.[col.date]||{}).some(([id,events])=>visibleIds.has(id)&&events?.length);
  });
}
