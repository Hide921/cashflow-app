const LS_DARK='cf_dark';
const LS_SKIPPED='cf_skipped';
function App(){
  const [accounts,setAccounts]=useState([]);
  const accountsRef=useRef([]);
  const [txs,setTxs]=useState([]);
  const txsRef=useRef([]);
  const [loans,setLoans]=useState([]);
  const loansRef=useRef([]);
  const cashflowTxs=useMemo(()=>withLoanRepaymentPlans(txs,loans,accounts),[txs,loans,accounts]);
  const [budgets,setBudgets]=useState({});
  const [skippedOccurrences,setSkippedOccurrences]=useState([]);
  const [preferences,setPreferences]=useState(DEFAULT_PREFS);
  const [investmentData,setInvestmentData]=useState({stocks:[],log:[],collateral:[],loading:true,error:''});
  const [loading,setLoading]=useState(true);
  const [dark,setDark]=useState(()=>localGet(LS_DARK)==='1');
  const [showSettings,setShowSettings]=useState(false);
  const [activeView,setActiveView]=useState('home');
  const [syncStatus,setSyncStatus]=useState({state:'saving',message:'データを読み込んでいます'});
  const [localSaveFailed,setLocalSaveFailed]=useState(false);
  const [toasts,setToasts]=useState([]);
  const saveQueues=useRef({});
  const saveQueuesBusy=useRef({});
  const volatilePending=useRef({});
  const cacheRetry=useRef({});
  const retryRef=useRef(null);
  const hydratedRef=useRef(false);
  const loadFailedRef=useRef(false);

  function addToast(message,type='success'){
    const id=Date.now()+Math.random();
    setToasts(prev=>[...prev,{id,message,type}]);
    setTimeout(()=>setToasts(prev=>prev.filter(t=>t.id!==id)),3500);
  }

  useEffect(()=>{
    let alive=true;
    async function hydrate(){
      setLoading(true);
      const cache=readLocalCache();
      const pending=readPending();
      const pendingOr=(key,fallback)=>Object.prototype.hasOwnProperty.call(pending,key)?pending[key]:fallback;
      try{
        const {values:data,stamps}=await loadAllData();
        if(!alive)return;
        loadFailedRef.current=false;
        const storedStamps=readStoredStamps();
        DATA_KEYS.forEach(key=>{
          const hasPending=Object.prototype.hasOwnProperty.call(pending,key);
          if(hasPending&&storedStamps[key]!==undefined)remoteStamps[key]=storedStamps[key];
          else if(!hasPending)rememberStamp(key,stamps[key]);
        });
        const legacySkipped=(()=>{try{return JSON.parse(localGet(LS_SKIPPED)||'[]');}catch{return [];}})();
        const a=pendingOr('accounts',data.accounts??cache.accounts??[]);
        const t=pendingOr('transactions',data.transactions??cache.transactions??[]);
        const l=pendingOr('loans',data.loans??cache.loans??[]);
        const b=pendingOr('budgets',data.budgets??cache.budgets??{});
        const s=pendingOr('skipped',data.skipped??cache.skipped??legacySkipped);
        const p={...DEFAULT_PREFS,...pendingOr('preferences',data.preferences??cache.preferences??{})};
        accountsRef.current=a;txsRef.current=t;loansRef.current=l;setAccounts(a);setTxs(t);setLoans(l);setBudgets(b);setSkippedOccurrences(s);setPreferences(p);
        DATA_KEYS.forEach(k=>cacheLocally(k,k,{accounts:a,transactions:t,loans:l,budgets:b,skipped:s,preferences:p}[k],Object.prototype.hasOwnProperty.call(pending,k)?pending[k]:null));
        try{
          const investments=await loadInvestmentData();
          if(!alive)return;
          setInvestmentData({...investments,loading:false,error:''});
          cacheLocally('investmentData','investmentData',investments,null);
        }catch(investmentError){
          const saved=withPendingInvestmentStocks(cache.investmentData||{stocks:[],log:[],collateral:[]});
          setInvestmentData({...saved,loading:false,error:'投資データは前回の保存内容を表示しています'});
        }
        setSyncStatus({state:'synced',message:'クラウドと同期済み'});
      }catch(e){
        if(!alive)return;
        loadFailedRef.current=true;
        Object.assign(remoteStamps,readStoredStamps());
        const cachedAccounts=pendingOr('accounts',cache.accounts||[]);
        const cachedTxs=pendingOr('transactions',cache.transactions||[]),cachedLoans=pendingOr('loans',cache.loans||[]);
        accountsRef.current=cachedAccounts;txsRef.current=cachedTxs;loansRef.current=cachedLoans;setAccounts(cachedAccounts);setTxs(cachedTxs);setLoans(cachedLoans);setBudgets(pendingOr('budgets',cache.budgets||{}));setSkippedOccurrences(pendingOr('skipped',cache.skipped||[]));setPreferences({...DEFAULT_PREFS,...pendingOr('preferences',cache.preferences||{})});
        const saved=withPendingInvestmentStocks(cache.investmentData||{stocks:[],log:[],collateral:[]});
        setInvestmentData({...saved,loading:false,error:'投資データは前回の保存内容を表示しています'});
        setSyncStatus({state:navigator.onLine?'error':'offline',message:`ローカルデータを表示中: ${e.message}`});
      }finally{
        if(alive){
          hydratedRef.current=true;
          setLoading(false);
          if(navigator.onLine&&(Object.keys(readPending()).length||Object.keys(volatilePending.current).length||Object.keys(cacheRetry.current).length))syncAll();
        }
      }
    }
    hydrate();
    return()=>{alive=false;};
  },[]);

  useEffect(()=>{
    if(dark){ document.documentElement.classList.add('dark'); }
    else { document.documentElement.classList.remove('dark'); }
    localSet(LS_DARK,dark?'1':'0');
  },[dark]);

  useEffect(()=>{
    const offline=()=>setSyncStatus(Object.keys(volatilePending.current).length?{state:'error',message:'オフラインです。端末保存にも失敗しているため、ページを閉じずに再試行してください'}:{state:'offline',message:'オフラインです。変更は端末に保存されています'});
    const online=()=>syncAll();
    const visible=()=>{if(document.visibilityState==='visible')checkRemoteChanges();};
    window.addEventListener('offline',offline);window.addEventListener('online',online);document.addEventListener('visibilitychange',visible);
    return()=>{window.removeEventListener('offline',offline);window.removeEventListener('online',online);document.removeEventListener('visibilitychange',visible);};
  });

  useEffect(()=>{
    if(!preferences.notifications||typeof Notification==='undefined'||Notification.permission!=='granted'||!cashflowTxs.length)return;
    const stamp=`cf_notified_${todayStr()}`;
    if(localGet(stamp)==='1')return;
    const start=todayD(),end=addDays(start,preferences.notifyDays||7),keys=new Set(skippedOccurrences);
    let largeCount=0,largeTotal=0;
    cashflowTxs.filter(tx=>tx.type==='expense'&&!tx.loanPayment).forEach(tx=>{
      if(tx.recurring) expandRec(tx,start,end,keys).forEach(e=>{if(Math.abs(e.amt)>=(preferences.largePayment||100000)){largeCount++;largeTotal+=Math.abs(e.amt);}});
      else if(tx.startDate){const d=sod(parseISO(tx.startDate));if(!isBefore(d,start)&&!isAfter(d,end)&&tx.amount>=(preferences.largePayment||100000)){largeCount++;largeTotal+=tx.amount;}}
    });
    const notificationForecast=accounts.length?buildForecast(accounts,cashflowTxs,end,keys):[];
    const risks=findShortfalls(accounts,notificationForecast);
    const lowLine=Number(preferences.lowBalance)||0;
    const lowAccounts=lowLine>0?accounts.filter(a=>notificationForecast.some(row=>Number(row[a.id])<lowLine)):[];
    const parts=[];
    if(risks.length)parts.push(`${risks.length}口座で残高不足の可能性`);
    else if(lowAccounts.length)parts.push(`${lowAccounts.length}口座が注意ラインを下回る見込み`);
    if(largeCount)parts.push(`大口支払い${largeCount}件・計¥${largeTotal.toLocaleString()}`);
    if(parts.length){new Notification('資金管理のお知らせ',{body:parts.join('／')});localSet(stamp,'1');}
  },[accounts,cashflowTxs,preferences,skippedOccurrences]);

  function savePendingKey(key,value){
    saveQueuesBusy.current[key]=(saveQueuesBusy.current[key]||0)+1;
    const done=()=>{if(--saveQueuesBusy.current[key]<=0)delete saveQueuesBusy.current[key];};
    const task=(saveQueues.current[key]||Promise.resolve()).then(()=>_sbSet(key,value));
    task.then(done,done);
    saveQueues.current[key]=task.catch(()=>{});
    return task.then(()=>{
      const retry=cacheRetry.current[key];
      if(retry&&JSON.stringify(retry.pendingValue)===JSON.stringify(value)){
        if(writeLocalCache(retry.cacheKey,retry.data))delete cacheRetry.current[key];
        else{setLocalSaveFailed(true);return;}
      }
      if(JSON.stringify(volatilePending.current[key])===JSON.stringify(value)){
        delete volatilePending.current[key];
        const pending=readPending();
        if(Object.prototype.hasOwnProperty.call(pending,key)){
          delete pending[key];
          if(!localSet(LS_PENDING,JSON.stringify(pending))){volatilePending.current[key]=value;setLocalSaveFailed(true);}
        }
      }else if(!clearPendingIfCurrent(key,value)){
        setLocalSaveFailed(true);
        setSyncStatus({state:'error',message:'端末の未同期記録を更新できません。再試行してください'});
      }
      if(!Object.keys(volatilePending.current).length&&!Object.keys(cacheRetry.current).length)setLocalSaveFailed(false);
    });
  }
  function cacheLocally(key,cacheKey,data,pendingValue){
    if(writeLocalCache(cacheKey,data)){
      delete cacheRetry.current[key];
      if(!Object.keys(cacheRetry.current).length&&!Object.keys(volatilePending.current).length)setLocalSaveFailed(false);
    }
    else{cacheRetry.current[key]={cacheKey,data,pendingValue};setLocalSaveFailed(true);}
  }
  function rememberPending(key,value){
    if(markPending(key,value)){
      delete volatilePending.current[key];
      if(!Object.keys(volatilePending.current).length&&!Object.keys(cacheRetry.current).length)setLocalSaveFailed(false);
    }
    else{volatilePending.current[key]=value;setLocalSaveFailed(true);}
  }
  function persist(key,value){
    rememberPending(key,value);
    cacheLocally(key,key,value,value);
    retryRef.current=syncAll;
    if(!navigator.onLine){setSyncStatus(Object.keys(volatilePending.current).length?{state:'error',message:'端末への保存に失敗しました。ページを閉じずにオンラインで再試行してください'}:{state:'offline',message:'変更は端末に保存され、オンライン復帰時に同期されます'});return;}
    setSyncStatus({state:'saving',message:'クラウドへ保存しています'});
    savePendingKey(key,value)
      .then(()=>{if(!Object.keys(readPending()).length&&!Object.keys(volatilePending.current).length&&!Object.keys(cacheRetry.current).length)setSyncStatus({state:'synced',message:`${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})} に同期済み`});else if(Object.keys(cacheRetry.current).length)setSyncStatus({state:'error',message:'端末キャッシュの保存に失敗しました。再試行してください'});})
      .catch(e=>{if(e&&e.conflict){reportSyncError(e);return;}setSyncStatus({state:'error',message:e.message});addToast(Object.keys(volatilePending.current).length?'同期に失敗し、端末にも保存できていません。ページを閉じずに再試行してください':'同期に失敗しました。端末には保存されています','error');});
  }
  async function syncAll(){
    if(!navigator.onLine||!hydratedRef.current){setSyncStatus(Object.keys(volatilePending.current).length?{state:'error',message:'端末保存に失敗しています。オンラインで再試行してください'}:{state:'offline',message:'オフラインです。変更は端末に保存されています'});return;}
    setSyncStatus({state:'saving',message:'すべてのデータを同期しています'});
    try{
      await Promise.all(Object.values(saveQueues.current));
      Object.entries(cacheRetry.current).forEach(([key,retry])=>{
        if(retry.pendingValue!==null)return;
        if(writeLocalCache(retry.cacheKey,retry.data))delete cacheRetry.current[key];
      });
      const tasks=Object.entries({...readPending(),...volatilePending.current}).map(([key,value])=>savePendingKey(key,value));
      await Promise.all(tasks);
      if(Object.keys(readPending()).length||Object.keys(volatilePending.current).length||Object.keys(cacheRetry.current).length)throw new Error('端末保存または同期が完了していません');
      if(loadFailedRef.current){
        window.location.reload();
        return;
      }
      setLocalSaveFailed(false);setSyncStatus({state:'synced',message:'すべて同期済み'});addToast('クラウドと同期しました');
    }catch(e){reportSyncError(e,'再同期に失敗しました');}
  }
  function conflictKeys(){return DATA_KEYS.filter(key=>Object.prototype.hasOwnProperty.call(readPending(),key)||Object.prototype.hasOwnProperty.call(volatilePending.current,key));}
  function reportSyncError(e,fallback){
    if(e&&e.conflict){
      setSyncStatus({state:'conflict',message:'他の端末で更新されたため保存を止めました。この端末の変更は端末内に残っています'});
      addToast('他の端末でデータが更新されています。どちらを残すか選んでください','error');
      return;
    }
    setSyncStatus({state:'error',message:e?.message||fallback});
    addToast(fallback,'error');
  }
  function resolveConflictWithCloud(){
    const keys=conflictKeys();
    if(!window.confirm('クラウドの最新データを読み込みます。この端末で未同期の変更は破棄されます。よろしいですか？'))return;
    const pending=readPending();
    keys.forEach(key=>{delete pending[key];delete volatilePending.current[key];});
    localSet(LS_PENDING,JSON.stringify(pending));
    window.location.reload();
  }
  function resolveConflictWithLocal(){
    if(!window.confirm('この端末の内容でクラウドを上書きします。他の端末での変更は失われます。よろしいですか？'))return;
    conflictKeys().forEach(key=>{delete remoteStamps[key];});
    syncAll();
  }
  async function checkRemoteChanges(){
    if(!hydratedRef.current||loadFailedRef.current||!navigator.onLine)return;
    try{
      const stamps=await loadRemoteStamps();
      const changed=DATA_KEYS.filter(key=>remoteStamps[key]!==undefined&&stamps[key]!==remoteStamps[key]);
      if(!changed.length)return;
      const pending=conflictKeys();
      if(!pending.length&&!Object.keys(saveQueuesBusy.current).length){setSyncStatus({state:'stale',message:'他の端末で更新されています。再読み込みすると最新を表示します'});return;}
      if(changed.some(key=>pending.includes(key)))setSyncStatus({state:'conflict',message:'他の端末で更新されています。どちらを残すか選んでください'});
    }catch{}
  }
  function updAcc(next){const value=typeof next==='function'?next(accountsRef.current):next;accountsRef.current=value;setAccounts(value);persist('accounts',value);}
  function updTxs(next){const value=typeof next==='function'?next(txsRef.current):next;txsRef.current=value;setTxs(value);persist('transactions',value);}
  function updLoans(next){const value=typeof next==='function'?next(loansRef.current):next;loansRef.current=value;setLoans(value);persist('loans',value);}
  function applyPayment(loanId,paymentId,accountId){
    const loan=loansRef.current.find(item=>item.id===loanId),payment=loan?.payments?.find(item=>item.id===paymentId);
    if(!payment){addToast('返済記録が見つかりません','error');return;}
    try{const next=reflectLoanPayment(accountsRef.current,loan,payment,accountId);if(next===accountsRef.current){addToast('この返済は反映済みです');return;}updAcc(next);addToast('返済を口座残高と残高表へ反映しました');}catch(error){addToast(error.message,'error');}
  }
  function undoPayment(loanId,paymentId){updAcc(current=>undoLoanPayment(current,loanId,paymentId));}
  function updCashflowTx(updated){
    if(updated.loanPayment){addToast('返済履歴は借入タブで管理してください','error');return;}
    const clean=stripLoanScheduleFields(updated);
    if(updated.loanPlan){
      updLoans(current=>current.map(loan=>loan.id===updated.loanId?{...loan,repaymentOverrides:clean.overrides||{},repaymentDateMoves:clean.dateMoves||{}}:loan));
    }else updTxs(current=>current.map(tx=>tx.id===updated.id?clean:tx));
    addToast('取引を更新しました');
  }
  function updBudgets(next){setBudgets(next);persist('budgets',next);addToast('予算を保存しました');}
  function updPreferences(next){setPreferences(next);persist('preferences',next);}
  async function reloadInvestments(){
    setInvestmentData(current=>({...current,loading:true,error:''}));
    try{
      const next=await loadInvestmentData();
      setInvestmentData({...next,loading:false,error:''});
      writeLocalCache('investmentData',next);
    }catch(e){
      setInvestmentData(current=>({...current,loading:false,error:'投資データを更新できませんでした'}));
    }
  }
  function updateInvestmentStocks(next,successMessage){
    const clean=canonicalInvestmentStocks(next);
    const cached={stocks:clean,log:investmentData.log||[],collateral:investmentData.collateral||[]};
    setInvestmentData(current=>({...current,stocks:clean,error:''}));
    rememberPending('sp_stocks',clean);
    cacheLocally('sp_stocks','investmentData',cached,clean);
    retryRef.current=syncAll;
    if(!navigator.onLine){
      setSyncStatus(Object.keys(volatilePending.current).length?{state:'error',message:'端末への保存に失敗しました。ページを閉じずにオンラインで再試行してください'}:{state:'offline',message:'投資データは端末に保存され、オンライン復帰時に同期されます'});
      addToast(successMessage+(Object.keys(volatilePending.current).length?'（端末保存失敗）':'（端末に保存）'));
      return;
    }
    setSyncStatus({state:'saving',message:'投資データをクラウドへ保存しています'});
    savePendingKey('sp_stocks',clean)
      .then(()=>{if(!Object.keys(readPending()).length&&!Object.keys(volatilePending.current).length&&!Object.keys(cacheRetry.current).length)setSyncStatus({state:'synced',message:'投資データを同期済み'});else if(Object.keys(cacheRetry.current).length)setSyncStatus({state:'error',message:'端末キャッシュの保存に失敗しました。再試行してください'});setInvestmentData(current=>({...current,error:''}));addToast(successMessage);})
      .catch(e=>{setSyncStatus({state:'error',message:e.message});setInvestmentData(current=>({...current,error:Object.keys(volatilePending.current).length?'クラウドと端末への保存に失敗しました':'クラウドへの保存に失敗しました。端末には保存されています'}));addToast('投資データの同期に失敗しました','error');});
  }
  function applyEmbeddedInvestmentData(next){
    if(!next||!Array.isArray(next.stocks))return;
    const merged={stocks:next.stocks,log:Array.isArray(next.log)?next.log:investmentData.log||[],collateral:Array.isArray(next.collateral)?next.collateral:investmentData.collateral||[]};
    setInvestmentData(current=>({...current,...withPendingInvestmentStocks(merged),loading:false,error:''}));
    writeLocalCache('investmentData',merged);
  }
  function handleSkip(key){
    if(accountsRef.current.some(account=>(account.loanRepayments||[]).some(item=>key===`${item.id}_${item.paidAt}`))){addToast('この返済は口座残高に反映済みです');return;}
    const next=skippedOccurrences.includes(key)?skippedOccurrences:[...skippedOccurrences,key];
    setSkippedOccurrences(next);
    localSet(LS_SKIPPED,JSON.stringify(next));
    persist('skipped',next);
    addToast('支払済みとして予測から除外しました');
  }
  function handleRestore(key){
    const next=skippedOccurrences.filter(k=>k!==key);
    setSkippedOccurrences(next);
    localSet(LS_SKIPPED,JSON.stringify(next));
    persist('skipped',next);
    addToast('予定を予測に戻しました');
  }
  function deleteTx(id){
    if(accountsRef.current.some(account=>(account.loanRepayments||[]).some(item=>item.id===id))){setActiveView('loans');addToast('返済履歴から削除してください');return;}
    const loan=loansRef.current.find(item=>loanRepaymentId(item.id)===id);
    if(loan)updLoans(current=>current.map(item=>item.id===loan.id?{...item,repaymentAccountId:''}:item));
    else updTxs(current=>current.filter(t=>t.id!==id));
    const next=skippedOccurrences.filter(k=>!k.startsWith(id+'_'));
    setSkippedOccurrences(next);persist('skipped',next);
  }
  function restoreBackup(data){
    if(!data||!Array.isArray(data.accounts)||!Array.isArray(data.transactions)){addToast('対応していないバックアップ形式です','error');return;}
    if(!window.confirm(`口座${data.accounts.length}件・取引${data.transactions.length}件で現在のデータを置き換えますか？`))return;
    const nextLoans=data.loans||[],nextBudgets=data.budgets||{},nextSkipped=data.skipped||[],nextPrefs={...DEFAULT_PREFS,...(data.preferences||{})};
    accountsRef.current=data.accounts;txsRef.current=data.transactions;loansRef.current=nextLoans;setAccounts(data.accounts);setTxs(data.transactions);setLoans(nextLoans);setBudgets(nextBudgets);setSkippedOccurrences(nextSkipped);setPreferences(nextPrefs);
    persist('accounts',data.accounts);persist('transactions',data.transactions);persist('loans',nextLoans);persist('budgets',nextBudgets);persist('skipped',nextSkipped);persist('preferences',nextPrefs);
    addToast('バックアップを復元しました');setShowSettings(false);
  }
  function importCsv(text){
    const {items,skipped}=transactionsFromCsv(text,accounts);
    if(!items.length){addToast('追加できる取引がありませんでした','error');return;}
    updTxs(current=>[...current,...items]);addToast(`${items.length}件を追加しました${skipped?`（${skipped}件スキップ）`:''}`);setShowSettings(false);setActiveView('transactions');
  }

  if(loading) return h('div',{className:'min-h-screen bg-[#f7f7f5] dark:bg-gray-950 flex items-center justify-center'},
    h('div',{className:'text-center'},h('div',{className:'w-8 h-8 rounded-full border-2 border-slate-200 border-t-slate-800 animate-spin mx-auto mb-3'}),h('p',{className:'text-gray-400 dark:text-gray-500 text-sm'},'読み込み中…'))
  );

  return h('div',{className:'min-h-screen bg-[#f7f7f5] dark:bg-gray-950'},
    h('header',{className:'bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-30'},
      h('div',{className:'max-w-[1600px] mx-auto px-3 sm:px-6 h-16 flex items-center justify-between gap-3'},
        h('button',{onClick:()=>setActiveView('home'),className:'flex items-center gap-2.5 flex-shrink-0','aria-label':'ホームへ'},
          h('div',{className:'w-9 h-9 bg-slate-900 dark:bg-slate-100 rounded-xl flex items-center justify-center'},
            h('span',{className:'text-base leading-none font-bold text-white dark:text-slate-950'},'¥')
          ),
          h('h1',{className:'hidden sm:block text-base font-bold text-gray-900 dark:text-gray-100 tracking-tight'},'Cashflow')
        ),
        h(AppNavigation,{active:activeView,onChange:setActiveView}),
        h('div',{className:'flex items-center gap-1.5'},
          h(SyncStatus,{status:syncStatus,onRetry:()=>retryRef.current?retryRef.current():syncAll()}),
          h('button',{
            onClick:()=>setDark(v=>!v),
            className:'w-8 h-8 flex items-center justify-center rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors',
            title:dark?'ライトモードに切替':'ダークモードに切替','aria-label':dark?'ライトモードに切替':'ダークモードに切替'
          },
            dark
              ? h('svg',{className:'w-4 h-4',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:'2'},
                  h('circle',{cx:'12',cy:'12',r:'5'}),
                  h('path',{d:'M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42'})
                )
              : h('svg',{className:'w-4 h-4',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:'2'},
                  h('path',{d:'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'})
                )
          ),
          h('div',{className:'w-px h-5 bg-gray-200 dark:bg-gray-700 mx-1'}),
          h('button',{
            onClick:()=>setShowSettings(true),
            className:'flex items-center gap-1.5 px-2 sm:px-3 py-1.5 rounded-full text-sm font-medium text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors','aria-label':'設定を開く'
          },
            h('svg',{className:'w-4 h-4',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:'2'},
              h('circle',{cx:'12',cy:'12',r:'3'}),
              h('path',{d:'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'})
            ),
            h('span',{className:'hidden sm:inline'},'設定')
          )
        )
      )
    ),
    h('main',{className:activeView==='investments'?'w-full px-2 sm:px-3 py-3 sm:py-4 pb-24':'max-w-[1600px] mx-auto px-3 sm:px-6 py-4 sm:py-6 pb-28'},
      syncStatus.state==='conflict'&&h('div',{role:'alert',className:'mb-4 rounded-xl border border-amber-300 bg-amber-50 dark:border-amber-800 dark:bg-amber-950/40 px-4 py-3 text-sm text-amber-900 dark:text-amber-200'},
        h('p',null,'他の端末（または別のタブ）でデータが更新されています。どちらの内容を残すか選んでください。'),
        h('div',{className:'mt-2 flex flex-wrap gap-3'},
          h('button',{type:'button',onClick:resolveConflictWithCloud,className:'font-semibold underline'},'クラウドの最新を読み込む（この端末の変更を破棄）'),
          h('button',{type:'button',onClick:resolveConflictWithLocal,className:'font-semibold underline'},'この端末の内容で上書き')
        )
      ),
      syncStatus.state==='stale'&&h('div',{role:'status',className:'mb-4 rounded-xl border border-indigo-200 bg-indigo-50 dark:border-indigo-800 dark:bg-indigo-950/40 px-4 py-3 text-sm text-indigo-900 dark:text-indigo-200'},
        '他の端末でデータが更新されました。',
        h('button',{type:'button',onClick:()=>window.location.reload(),className:'ml-3 font-semibold underline'},'最新を読み込む')
      ),
      localSaveFailed&&h('div',{role:'alert',className:'mb-4 rounded-xl border border-rose-300 bg-rose-50 dark:border-rose-800 dark:bg-rose-950/40 px-4 py-3 text-sm text-rose-800 dark:text-rose-200'},
        '端末の保存領域に問題があります。同期が完了するまでページを閉じず、オンラインで再試行してください。',
        h('button',{type:'button',onClick:syncAll,className:'ml-3 font-semibold underline'},'再試行')
      ),
      activeView==='home'&&h(Dashboard,{accounts,txs:cashflowTxs,loans,dark,
        onAddTx:tx=>updTxs(current=>[...current,tx]),
        onUpdTx:updCashflowTx,
        onUpdAcc:updated=>updAcc(current=>current.map(a=>a.id===updated.id?{...a,balance:updated.balance,balanceAsOf:updated.balanceAsOf,balanceIncludesAsOfDay:!!updated.balanceIncludesAsOfDay}:a)),
        onNavigate:setActiveView,
        skippedOccurrences,
        onSkip:handleSkip,
        onRestore:handleRestore,
        onDeleteTx:deleteTx,
        investmentData
      }),
      activeView==='transactions'&&h('div',{className:'space-y-4'},
        h('div',null,h('h2',{className:'text-xl font-bold text-gray-900 dark:text-gray-100'},'取引'),h('p',{className:'text-sm text-gray-400 mt-1'},'予定・実績・定期取引を管理')),
        h(TxManager,{accounts,txs:txs.filter(tx=>!tx.salary),onChange:updTxs,onDelete:deleteTx,addToast})
      ),
      activeView==='salary'&&h(SalaryManager,{accounts,txs,onChange:updTxs,onDelete:deleteTx,addToast}),
      activeView==='accounts'&&h('div',{className:'space-y-4'},h('div',null,h('h2',{className:'text-xl font-bold text-gray-900 dark:text-gray-100'},'口座'),h('p',{className:'text-sm text-gray-400 mt-1'},'残高と表示色を管理')),h(AccountManager,{accounts,onChange:updAcc,addToast})),
      activeView==='investments'&&h(InvestmentHub,{data:investmentData,onReload:reloadInvestments,onStocksChange:updateInvestmentStocks,onEmbeddedChange:applyEmbeddedInvestmentData}),
      activeView==='loans'&&h('div',{className:'space-y-4'},h('div',null,h('h2',{className:'text-xl font-bold text-gray-900 dark:text-gray-100'},'借入'),h('p',{className:'text-sm text-gray-400 mt-1'},'カードローンや個人間の借入残高・返済を管理')),h(LoanManager,{loans,accounts,txs,onChange:updLoans,onReflectPayment:applyPayment,onUndoPayment:undoPayment,addToast})),
      activeView==='analysis'&&h(AnalysisView,{txs:cashflowTxs,budgets,onBudgetChange:updBudgets,skippedOccurrences})
    ),
    showSettings&&h(PreferencesModal,{onClose:()=>setShowSettings(false),dark,setDark,syncStatus,onRetry:syncAll,accounts,txs,loans,budgets,skipped:skippedOccurrences,prefs:preferences,onPrefs:updPreferences,onRestore:restoreBackup,onCsvImport:importCsv}),
    h(Toast,{toasts})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(React.StrictMode,null,h(App)));
</script>
